<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyFlow | 專業排球系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-5 pb-20 text-slate-900 select-none">
    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter text-slate-900">VOLLEYFLOW</h1>
            <div id="admin-status" class="mt-4"></div>
        </header>

        <div id="admin-panel" class="hidden animate-fade-in">
            <div class="bg-white p-8 rounded-[40px] shadow-2xl mb-10 border-2 border-blue-50">
                <h3 class="font-black text-sm mb-4 italic uppercase text-slate-800">Create New Game</h3>
                <div class="space-y-3">
                    <div class="flex items-center bg-slate-50 rounded-2xl px-4 border border-slate-100">
                        <input id="new_loc" type="text" placeholder="地方名 (如: 天水圍)" class="flex-1 bg-transparent py-4 outline-none font-bold text-sm text-slate-700">
                        <span class="text-slate-400 font-bold text-sm">體育館</span>
                    </div>
                    <input id="new_date" type="date" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <input id="new_time" type="text" placeholder="時間 (如: 19:00-21:00)" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-400">名額: <input id="new_max" type="number" value="15" class="bg-transparent text-slate-700 w-10"></div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-400">費用: <input id="new_price" type="number" value="30" class="bg-transparent text-slate-700 w-10"></div>
                    </div>
                    <button onclick="vflow.createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">發布場次</button>
                    <div id="super-admin-tools" class="hidden mt-4">
                        <button onclick="vflow.addAdminAccount()" class="w-full border-2 border-slate-900 text-slate-900 font-black py-2 rounded-2xl text-[10px] uppercase tracking-widest">＋ 新增管理員帳號</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-content">
            <div class="flex justify-center py-20"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div></div>
        </div>

        <div id="login_modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-xs p-8 rounded-[40px] shadow-2xl text-center">
                <h3 class="font-black italic mb-6 text-slate-800">ADMIN LOGIN</h3>
                <input id="login_u" type="text" placeholder="用戶名稱" class="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none border font-bold">
                <input id="login_p" type="password" placeholder="密碼" class="w-full bg-slate-50 p-4 rounded-2xl mb-6 outline-none border font-bold">
                <button onclick="vflow.login()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">登入</button>
                <button onclick="vflow.closeLogin()" class="mt-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest">Cancel</button>
            </div>
        </div>

        <footer class="mt-20 py-10 text-center opacity-20">
            <div class="inline-block py-4 px-10" onclick="vflow.clickSecret()">
                <p class="text-[9px] font-black uppercase tracking-[0.3em]">© 2026 VolleyFlow Collective</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0",
            authDomain: "volleyballflow-7cf02.firebaseapp.com",
            projectId: "volleyballflow-7cf02",
            storageBucket: "volleyballflow-7cf02.firebasestorage.app",
            messagingSenderId: "1032620495700",
            appId: "1:1032620495700:web:c2d84f02e435d99e15eec1"
        };

        const SUPER_ADMIN = { user: "Manusyip", pass: "Manusyip0830" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let user = JSON.parse(sessionStorage.getItem('vf_user'));
        let currentView = 'list';
        let payUrl = "";
        let selectedPositions = [];
        let secretClicks = 0;

        window.vflow = {
            clickSecret: () => {
                secretClicks++;
                if (secretClicks === 4) { document.getElementById('login_modal').classList.remove('hidden'); secretClicks = 0; }
                setTimeout(() => secretClicks = 0, 3000);
            },
            closeLogin: () => document.getElementById('login_modal').classList.add('hidden'),
            login: async () => {
                const u = document.getElementById('login_u').value;
                const p = document.getElementById('login_p').value;
                if (u === SUPER_ADMIN.user && p === SUPER_ADMIN.pass) {
                    sessionStorage.setItem('vf_user', JSON.stringify({ name: u, role: 'super' }));
                    location.reload();
                } else {
                    const q = query(collection(db, "admins"), where("username", "==", u), where("password", "==", p));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        sessionStorage.setItem('vf_user', JSON.stringify({ name: u, role: 'normal' }));
                        location.reload();
                    } else { alert("帳號或密碼錯誤"); }
                }
            },
            createGame: async () => {
                const loc = document.getElementById('new_loc').value.trim();
                const dateVal = document.getElementById('new_date').value;
                const timeStr = document.getElementById('new_time').value.trim();
                const max = parseInt(document.getElementById('new_max').value) || 15;
                const price = parseInt(document.getElementById('new_price').value) || 30;

                if (!loc || !dateVal || !timeStr) return alert("請填寫完整資訊");
                if (!user) return alert("請先登入管理員");

                const weekDay = ["日", "一", "二", "三", "四", "五", "六"][new Date(dateVal).getDay()];
                try {
                    await addDoc(collection(db, "games"), {
                        location: `${loc}體育館`,
                        time: `${dateVal} (${weekDay}) ${timeStr}`,
                        maxPlayers: max,
                        price: price,
                        createdBy: user.name,
                        timestamp: serverTimestamp(),
                        limits: { S: 2, OH: 4, MB: 2, OP: 2, L: 2 },
                        enableLimit: false
                    });
                    location.reload();
                } catch (e) { alert("發佈失敗: " + e.message); }
            },
            addAdminAccount: async () => {
                const u = prompt("新管理員用戶名:");
                const p = prompt("新管理員密碼:");
                if (u && p) { await setDoc(doc(db, "admins", u), { username: u, password: p }); alert("新增成功"); }
            },
            renderList: (games) => {
                const container = document.getElementById('main-content');
                if (games.length === 0) { container.innerHTML = `<p class="text-center py-20 text-slate-400 font-bold italic">暫無場次</p>`; return; }
                container.innerHTML = `<h2 class="text-xl font-black italic text-slate-700 mb-6 px-2">招募中場次</h2>
                <div class="grid gap-4">${games.map(g => {
                    const canDelete = user?.role === 'super' || user?.name === g.createdBy;
                    return `<div class="bg-white p-6 rounded-[30px] shadow-sm border border-slate-100 relative">
                        <div onclick="vflow.goToGame('${g.id}')" class="cursor-pointer">
                            <p class="text-[10px] font-black text-blue-600 uppercase mb-1">${g.time}</p>
                            <h3 class="text-xl font-black text-slate-800">${g.location}</h3>
                            <p class="text-[9px] font-bold text-slate-300 mt-1">Host: ${g.createdBy || 'System'}</p>
                        </div>
                        ${canDelete ? `<button onclick="vflow.delGame('${g.id}')" class="absolute top-6 right-6 text-red-300 text-[10px] font-bold">剷場</button>` : ''}
                    </div>`}).join('')}</div>`;
            },
            goToGame: (id) => {
                currentView = 'details';
                onSnapshot(doc(db, "games", id), (d) => {
                    if (!d.exists()) return;
                    const game = d.data();
                    const isMgr = user?.role === 'super' || user?.name === game.createdBy;
                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-6 text-blue-600 font-black text-xs">← BACK TO LIST</button>
                        <div class="bg-slate-900 text-white p-8 rounded-[40px] mb-6 shadow-xl relative">
                            <h2 class="text-2xl font-black italic mb-1">${game.location}</h2>
                            <p class="text-sm font-bold opacity-50 font-mono">${game.time}</p>
                            ${isMgr ? `<button onclick="vflow.copyWA('${id}','${game.location}','${game.time}')" class="absolute right-6 bottom-6 bg-blue-600 text-[10px] px-4 py-2 rounded-full font-black">複製 WA</button>` : ''}
                        </div>
                        ${isMgr ? `<div class="bg-blue-50 p-6 rounded-[30px] mb-6 border border-blue-100 text-xs">
                            <div class="flex justify-between font-black mb-4"><span class="text-green-600">已收: <span id="stat-paid">$0</span></span><span class="text-blue-600">預計: <span id="stat-total">$0</span></span></div>
                            <div class="flex flex-col gap-2 pt-3 border-t border-blue-100">
                                <div>上限: <input type="number" value="${game.maxPlayers}" onchange="vflow.upField('${id}','maxPlayers',this.value)" class="w-12 p-1 rounded"></div>
                                <div>費用: <input type="number" value="${game.price}" onchange="vflow.upField('${id}','price',this.value)" class="w-12 p-1 rounded"></div>
                            </div>
                        </div>` : ''}
                        <div class="bg-white p-8 rounded-[30px] shadow-sm mb-6 border border-slate-100 text-center">
                            <div class="flex justify-between items-center mb-6"><span class="font-black italic text-slate-400 text-sm">Booking</span><span id="p-count" class="text-blue-600 font-black text-[10px] bg-blue-50 px-3 py-1 rounded-full">已報名：0 / ${game.maxPlayers}</span></div>
                            <input id="ig" type="text" placeholder="@Instagram_ID" class="w-full bg-slate-50 p-4 rounded-2xl mb-4 outline-none font-bold">
                            <div id="pos-grid" class="grid grid-cols-1 gap-2 mb-8"></div>
                            <button onclick="vflow.join('${id}', ${game.price})" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl">確認報名支付 $${game.price}</button>
                        </div>
                        <div id="player-list" class="space-y-2 pb-10"></div>
                    `;
                    vflow.listenPlayers(id, game, isMgr);
                });
            },
            listenPlayers: (gid, gData, isMgr) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const players = []; let paid = 0;
                    snap.forEach(d => { const p = {id:d.id, ...d.data()}; players.push(p); if(p.status==='confirmed') paid++; });
                    if(document.getElementById('p-count')) document.getElementById('p-count').innerText = `已報名：${players.length} / ${gData.maxPlayers}`;
                    if(isMgr && document.getElementById('stat-paid')) {
                        document.getElementById('stat-paid').innerText = `$${paid * gData.price}`;
                        document.getElementById('stat-total').innerText = `$${players.length * gData.price}`;
                    }
                    const grid = document.getElementById('pos-grid');
                    if(grid) {
                        grid.innerHTML = ['Setter','Outside Hitter','Middle Blocker','Opposite Hitter','Libero'].map(p => {
                            const isSel = selectedPositions.includes(p);
                            return `<button onclick="vflow.setPos('${p}')" class="p-4 rounded-2xl border font-black text-xs ${isSel?'bg-blue-600 text-white':'bg-slate-50'}">${p.toUpperCase()}</button>`
                        }).join('');
                    }
                    const listDiv = document.getElementById('player-list');
                    if(isMgr) {
                        listDiv.innerHTML = players.map(p => `<div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm">
                            <div><p class="font-black text-slate-800">${p.ig}</p><p class="text-[9px] font-black ${p.status==='confirmed'?'text-green-500':'text-orange-400'}">${p.status==='confirmed'?'● PAID':'○ PENDING'}</p></div>
                            <div class="flex gap-1"><button onclick="vflow.confirmP('${gid}','${p.id}')" class="bg-green-500 text-white px-3 py-2 rounded-xl text-[10px] font-black">核實</button><button onclick="vflow.delP('${gid}','${p.id}')" class="bg-red-50 text-red-400 px-3 py-2 rounded-xl text-[10px] font-black">刪除</button></div>
                        </div>`).join('');
                    } else { listDiv.innerHTML = `<p class="py-10 text-center text-slate-300 text-[10px] italic tracking-widest">Privacy List Secured</p>`; }
                });
            },
            setPos: (p) => {
                const idx = selectedPositions.indexOf(p);
                if(idx > -1) selectedPositions.splice(idx, 1);
                else if(selectedPositions.length < 2) selectedPositions.push(p);
                // 為了讓 UI 更新，這裡簡單做法是重新跑一遍渲染
                const btns = document.querySelectorAll('#pos-grid button');
                btns.forEach(b => {
                    const name = b.innerText;
                    if(selectedPositions.includes(name)) { b.classList.add('bg-blue-600','text-white'); b.classList.remove('bg-slate-50'); }
                    else { b.classList.remove('bg-blue-600','text-white'); b.classList.add('bg-slate-50'); }
                });
            },
            join: async (gid, pr) => {
                const ig = document.getElementById('ig').value.trim();
                if(!ig.startsWith('@') || selectedPositions.length === 0) return alert("請輸入 IG (@開頭) 並選擇位置");
                if(!confirm(`確認支付 $${pr} 報名？`)) return;
                await addDoc(collection(db, `games/${gid}/players`), { ig, pos: selectedPositions.join(' & '), status: "pending", timestamp: serverTimestamp() });
                window.open(payUrl, "_blank"); location.reload();
            },
            delGame: async (id) => { if(confirm("刪除場次？")) await deleteDoc(doc(db, "games", id)); },
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid) => await deleteDoc(doc(db, `games/${gid}/players`, pid)),
            upField: async (id, f, v) => await updateDoc(doc(db, "games", id), { [f]: parseInt(v) }),
            copyWA: async (gid, loc, time) => {
                const snap = await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")));
                let txt = `🏐 *VolleyFlow 名單*\n📍 地點：${loc}\n⏰ 時間：${time}\n\n`;
                let i = 1; snap.forEach(d => { const p = d.data(); txt += `${i}. ${p.ig} (${p.pos}) ${p.status==='confirmed'?'✅':'⏳'}\n`; i++; });
                navigator.clipboard.writeText(txt); alert("已複製！");
            }
        };

        if (user) {
            document.getElementById('admin-status').innerHTML = `<div class="mt-4 flex justify-center gap-2 items-center"><span class="text-[10px] font-black bg-blue-100 text-blue-600 px-3 py-1 rounded-full">ADMIN: ${user.name}</span><button onclick="sessionStorage.removeItem('vf_user');location.reload();" class="text-[10px] font-black text-red-400 underline">Logout</button></div>`;
            document.getElementById('admin-panel').classList.remove('hidden');
            if(user.role === 'super') document.getElementById('super-admin-tools').classList.remove('hidden');
        }

        onSnapshot(doc(db, "settings", "global"), (d) => { if(d.exists()) payUrl = d.data().payUrl; });
        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
            const games = []; snap.forEach(d => games.push({id: d.id, ...d.data()}));
            if(currentView === 'list') vflow.renderList(games);
        });
    </script>
</body>
</html>
