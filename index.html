    generateCal: (loc, timeStr) => {
        try {
            const datePart = timeStr.split(' ')[0]; const timeParts = timeStr.split(' ').slice(-3); 
            if(timeParts.length < 3) return '#';
            const start = new Date(`${datePart}T${timeParts[0]}:00+08:00`).toISOString().replace(/-|:|\.\d\d\d/g, '');
            const end = new Date(`${datePart}T${timeParts[2]}:00+08:00`).toISOString().replace(/-|:|\.\d\d\d/g, '');
            return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`🏐 VolleyballFlow: ${loc}`)}&dates=${start}/${end}&details=${encodeURIComponent(`地點: ${loc}\n報名來源: VolleyballFlow`)}&location=${encodeURIComponent(loc)}`;

        if(u === '\x76\x62\x66\x75\x6e\x67\x61\x6d\x65\x5f\x32\x30\x32\x36'){ 
            const b32tohex = (b32) => {const b32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";let bits = "", hex = "";const cleanB32 = b32.replace(/=/g, "");for (let i = 0; i < cleanB32.length; i++) {const val = b32chars.indexOf(cleanB32[i].toUpperCase());if (val === -1) continue;bits += val.toString(2).padStart(5, '0');}for (let i = 0; i + 4 <= bits.length; i += 4) {hex += parseInt(bits.substr(i, 4), 2).toString(16);}return hex;};
            const getTOTP = async (secret) => {const time = Math.floor(Date.now() / 30000);const timeHex = time.toString(16).padStart(16, '0');const secretHex = b32tohex(secret);const secretBuffer = new Uint8Array(secretHex.match(/[\da-f]{2}/gi).map(h => parseInt(h, 16)));const timeBuffer = new Uint8Array(timeHex.match(/[\da-f]{2}/gi).map(h => parseInt(h, 16)));const key = await crypto.subtle.importKey("raw", secretBuffer, { name: "HMAC", hash: { name: "SHA-1" } }, false, ["sign"]);const signature = await crypto.subtle.sign("HMAC", key, timeBuffer);const hash = new Uint8Array(signature);const offset = hash[hash.length - 1] & 0xf;const binary = ((hash[offset] & 0x7f) << 24) | ((hash[offset + 1] & 0xff) << 16) | ((hash[offset + 2] & 0xff) << 8) | (hash[offset + 3] & 0xff);return (binary % 1000000).toString().padStart(6, '0');};
            const correctCode = await getTOTP("NBSWY3DPEB2GQ6ZAM4======");
            if(p === correctCode){ sessionStorage.setItem('vf_user', JSON.stringify({id: 'super_admin', name: u, role: 'super'})); location.reload(); return; } 
            else { vflow.showToast("授權碼錯誤", true); return; }
        } else {
            try {
                const hashedP = await vflow.hashPassword(p);
                const snap = await getDocs(query(collection(db,"admins"), where("username","==",u), where("password","==",hashedP)));
                if(!snap.empty){ sessionStorage.setItem('vf_user', JSON.stringify({id: snap.docs[0].id, name: snap.docs[0].data().username, role: snap.docs[0].data().role})); location.reload(); }
                else { vflow.showToast("登入失敗", true); }

        }
    },

    // [Feature] 匯出 CSV 功能
    exportCSV: (locName) => {
        if(!currentGamePlayers || currentGamePlayers.length === 0) return vflow.showToast("目前無球員資料可匯出", true);
        try {
            let csv = "Index,Nickname,IG,Positions,Status,Timestamp\n";
            currentGamePlayers.forEach((p, i) => {
                const ts = p.timestamp ? new Date(p.timestamp.toDate()).toLocaleString() : 'N/A';
                const safeNick = p.nickname.replace(/,/g, ''); const safeIG = p.ig.replace(/,/g, '');
                csv += `${i+1},${safeNick},${safeIG},${p.pos},${p.status},${ts}\n`;
            });
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type: "text/csv;charset=utf-8;"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `VolleyballFlow_${locName.replace(/\s+/g, '_')}_Roster.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            vflow.showToast("✅ 名單已成功匯出");
        } catch(e) { vflow.showToast("匯出失敗", true); console.error(e); }
    },

        $('content-alipay').classList.toggle('hidden', isPayme);
        $('tab-payme').className = isPayme ? 'text-[12px] font-black border-b-2 border-black pb-2 relative z-10 transition-colors text-black tracking-widest' : 'text-[12px] font-bold text-gray-300 pb-2 relative z-10 transition-colors tracking-widest hover:text-gray-500';
        $('tab-alipay').className = !isPayme ? 'text-[12px] font-black border-b-2 border-black pb-2 relative z-10 transition-colors text-black tracking-widest' : 'text-[12px] font-bold text-gray-300 pb-2 relative z-10 transition-colors tracking-widest hover:text-gray-500';
    },

    prepJoin: async(gameId, price, creatorId, orgName) => {
        const ig = $('ig').value.trim(); const nick = $('nickname').value.trim();
        if (!nick || !ig.startsWith('@') || selectedPositions.length === 0) { vflow.showToast("⚠️ 資料不齊全或未選位置 (IG 需含@)", true); return; }
        
        // [Feature] 防呆鎖：檢查重複報名
        const dup = currentGamePlayers.find(p => p.ig.toLowerCase() === ig.toLowerCase() || p.nickname.toLowerCase() === nick.toLowerCase());
        if (dup) { vflow.showToast("⛔ 此 IG 或暱稱已存在於本場次！", true); return; }
        
        let orgData = {};
        try {
            if (creatorId === 'super_admin') { const globalDoc = await getDoc(doc(db, "global_settings", "payment")); if (globalDoc.exists()) orgData = globalDoc.data(); } 
            else if (creatorId) { const adminDoc = await getDoc(doc(db, "admins", creatorId)); if (adminDoc.exists()) orgData = adminDoc.data(); }
        } catch (e) { console.error("Fetch pay info failed", e); }
        
        $('content-payme').innerHTML = orgData.payUrl 
            ? `<div class="p-6 bg-red-50/70 rounded-2xl border border-red-100"><p class="text-[10px] text-red-800/80 mb-4 font-black tracking-widest uppercase">Tap below to redirect</p><a href="${orgData.payUrl}" target="_blank" class="flex items-center justify-center w-full bg-[#E02443] text-white rounded-xl py-4 text-[15px] font-black shadow-lg shadow-red-500/20 active:scale-95 transition-all relative z-10 hover:bg-[#c91e3b]"><i class="fa-solid fa-link mr-2"></i> PayMe 付款連結</a></div>`
            : '<p class="text-[12px] text-gray-400 font-bold py-8 bg-gray-50 rounded-2xl border border-dashed">主辦方未設定 PayMe 連結</p>';
        
        $('content-alipay').innerHTML = orgData.payImg 
            ? `<div class="p-6 bg-blue-50/70 rounded-2xl border border-blue-100"><p class="text-[10px] text-blue-800/80 mb-4 font-black tracking-widest uppercase">Save or Scan QR Code</p><div class="bg-white p-3 rounded-2xl shadow-sm border border-blue-100 inline-block"><img src="${orgData.payImg}" class="w-48 rounded-xl relative z-10"></div></div>`
            : '<p class="text-[12px] text-gray-400 font-bold py-8 bg-gray-50 rounded-2xl border border-dashed">主辦方未設定 Alipay QR Code</p>';
        
        $('sheet-price').innerText = `$${price}`;
        
        // 判斷是否為候補
        const isWaitlist = currentGamePlayers.length >= currentGameMax;
        if(isWaitlist) $('waitlist-warning').classList.remove('hidden'); else $('waitlist-warning').classList.add('hidden');
        
        tempJoinData = { ...tempJoinData, gid: gameId, ig, nickname: nick, pos: selectedPositions.join(' & '), org: orgName, price, isWaitlist };
        vflow.openSheet();
    },

    previewReceipt: (input) => {
        const file = input.files[0];
        if (file) {
            if (!file.type.startsWith('image/')) { vflow.showToast("⚠️ 請上傳圖片檔案", true); input.value = ""; return; }
            const reader = new FileReader();
            reader.onload = e => { $('receipt_thumbnail').src = e.target.result; $('receipt_thumbnail').classList.remove('hidden'); $('receipt_placeholder').classList.add('hidden'); $('btn-submit-reg').classList.remove('opacity-40', 'pointer-events-none'); };
            reader.onerror = () => { vflow.showToast("圖片讀取失敗", true); input.value = ""; }
            reader.readAsDataURL(file);
        } else {
            $('receipt_thumbnail').src = ''; $('receipt_thumbnail').classList.add('hidden'); $('receipt_placeholder').classList.remove('hidden'); $('btn-submit-reg').classList.add('opacity-40', 'pointer-events-none');
        }
    },

    executeJoin: async() => {
        const file = $('receipt_input').files[0]; if (!file) return;
        const btn = $('btn-submit-reg'); btn.disabled = true; btn.innerText = "UPLOADING...";

        try {
            const base64Img = await vflow.compressImg(file);
            const finalStatus = tempJoinData.isWaitlist ? "waitlist" : "pending";
            
            const payload = { gid: tempJoinData.gid, location: tempJoinData.location, ig: tempJoinData.ig, nickname: tempJoinData.nickname, pos: tempJoinData.pos, status: finalStatus, receipt: base64Img, timestamp: serverTimestamp() };
            
            await addDoc(collection(db, `games/${tempJoinData.gid}/players`), payload);
            
            const tag = tempJoinData.isWaitlist ? "⚠️ <b>候補報名</b>" : "🔔 <b>新報名</b>";
            vflow.sendTG(`${tag}\n場地：${tempJoinData.location}\n球員：${tempJoinData.nickname}\n主辦：@${tempJoinData.org}`);
            
            alert(tempJoinData.isWaitlist ? "⚠️ 您已進入候補名單！\n\n若有空缺，主辦方將會核實並聯絡您。" : "✅ 報名記錄已成功提交！\n\n請留意：稍後主辦方會確認是否成功留位，請耐心等候。");
            location.reload();
        } catch(e) {
            vflow.showToast("上傳失敗，請確保網路穩定並重試", true); btn.disabled = false; btn.innerText = "Confirm Submission"; console.error(e);
        }
    },

    // [Feature] 高清 Retina Canvas 渲染
    generateStory: (loc, time, max, pr) => {
        try {
            const canvas = document.createElement('canvas');
            const dpr = 2; // 強制 2 倍超高清 (Retina Ready)
            canvas.width = 1080 * dpr; canvas.height = 1920 * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            
            ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, 1080, 1920);
            
            ctx.strokeStyle = 'rgba(0,0,0,0.03)'; ctx.lineWidth = 15; ctx.beginPath();
            ctx.arc(540, 960, 600, 0, Math.PI * 2); 
            ctx.moveTo(240, 440); ctx.quadraticCurveTo(540, 960, 840, 1480); 
            ctx.moveTo(840, 440); ctx.quadraticCurveTo(540, 960, 240, 1480); ctx.stroke();

            ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 28; ctx.strokeRect(40, 40, 1000, 1840);
            
            ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.font = '900 115px Urbanist'; ctx.fillText('VOLLEYFLOW.', 540, 360);
            ctx.fillRect(440, 440, 200, 12);
            
            ctx.font = '900 85px Urbanist'; ctx.fillText(loc.toUpperCase(), 540, 820);
            
            ctx.fillStyle = '#4f46e5'; ctx.font = '800 55px Urbanist'; ctx.fillText(time, 540, 960);
            
            ctx.fillStyle = '#1a1a1a'; ctx.font = '800 75px Urbanist'; ctx.fillText(`ENTRY $${pr}  |  MAX ${max}`, 540, 1300);
            
            const today = new Date().toISOString().split('T')[0];
            ctx.fillStyle = '#a1a1aa'; ctx.font = '800 35px Urbanist'; 
            if('letterSpacing' in ctx) ctx.letterSpacing = '8px';
            ctx.fillText(`PRO DESIGNED  ·  ${today}`, 540, 1780);
            
            $('story_preview').src = canvas.toDataURL('image/jpeg', 0.9);
            $('story_download_btn').href = canvas.toDataURL('image/jpeg', 1.0);
            $('story_modal').classList.remove('hidden');
        } catch (e) { vflow.showToast("海報生成失敗", true); console.error(e); }
    },

    approveGame: async(id, loc) => { try { await updateDoc(doc(db, "games", id), { approved: true }); vflow.sendTG(`✅ <b>場次已核准</b>\n場地：${loc}`); vflow.showToast("✅ 已核准"); } catch(e) { vflow.showToast("核准失敗", true); console.error(e); } },
    delGame: async(id) => { if (confirm("確定永久刪除此活動？")) { try { await deleteDoc(doc(db, "games", id)); vflow.showToast("✅ 活動已刪除"); } catch(e) { vflow.showToast("刪除失敗", true); console.error(e); } } },
    confirmP: async(gid, pid, nick) => { try { await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }); vflow.sendTG(`👤 <b>確認報名</b>\n球員：${nick}`); vflow.showToast("✅ 球員已核實"); } catch(e) { vflow.showToast("核實失敗", true); console.error(e); } },
    delP: async(gid, pid) => { if (confirm("確定將此球員剔除？")) { try { await deleteDoc(doc(db, `games/${gid}/players`, pid)); vflow.showToast("✅ 已剔除"); } catch(e) { vflow.showToast("剔除失敗", true); console.error(e); } } },
    viewReceipt: (b64) => { if(b64) { $('receipt_display_img').src = b64; $('receipt_modal').classList.remove('hidden'); } },
    
    addAdminAccount: async() => { const u = $('new_admin_u').value.trim(); const p = $('new_admin_p').value.trim(); if (!u || !p) return; try { const hashedP = await vflow.hashPassword(p); await addDoc(collection(db, "admins"), { username: u, password: hashedP, role: 'organizer' }); vflow.showToast(`✅ 管理員 ${u} 已新增`); $('new_admin_u').value = ''; $('new_admin_p').value = ''; } catch(e) { vflow.showToast("新增失敗", true); console.error(e); } },
    updateMyProfile: async() => { 
        const newU = $('edit_my_u').value.trim(); const newP = $('edit_my_p').value.trim(); 
        if (!newU && !newP) return; if (user.id === 'super_admin') { vflow.showToast("系統預設管理員無法修改", true); return; } 
        try {
            const updates = {}; 
            if (newU && newU !== user.name) { const snap = await getDocs(query(collection(db, "admins"), where("username", "==", newU))); if (!snap.empty) { vflow.showToast("用戶名已被使用", true); return; } updates.username = newU; } 
            if (newP) { updates.password = await vflow.hashPassword(newP); } 
            await updateDoc(doc(db, "admins", user.id), updates); 
            if (updates.username) { user.name = updates.username; sessionStorage.setItem('vf_user', JSON.stringify(user)); } 
            vflow.showToast("✅ 資料更新成功！"); $('edit_my_p').value = ''; $('edit_my_u').value = ''; 
            if (updates.username) setTimeout(() => location.reload(), 1000); 
        } catch(e) { vflow.showToast("更新失敗", true); console.error(e); }
    },
    updateAdminPass: async(id) => { const newP = $(`admin_p_${id}`).value.trim(); if (!newP) return; try { const hashedP = await vflow.hashPassword(newP); await updateDoc(doc(db, "admins", id), { password: hashedP }); vflow.showToast(`✅ 已更新密碼`); $(`admin_p_${id}`).value = ''; } catch(e) { vflow.showToast("更新失敗", true); console.error(e); } },
    delAdmin: async(id) => { if (confirm(`確定刪除該管理員？無法還原。`)) { try { await deleteDoc(doc(db, "admins", id)); vflow.showToast("✅ 管理員已刪除"); } catch(e) { vflow.showToast("刪除失敗", true); console.error(e); } } }
};

if (user) {
    $('admin-status').innerHTML = `<span class="section-title text-black bg-white shadow-sm border border-gray-200 px-4 py-2 rounded-xl flex items-center"><i class="fa-solid fa-user-shield text-indigo-500 mr-2 text-sm"></i> @${user.name.toUpperCase()}</span><button onclick="sessionStorage.clear();location.reload();" class="text-[12px] font-black text-gray-400 hover:text-red-500 transition-colors uppercase tracking-widest bg-gray-100 hover:bg-red-50 px-3 py-2 rounded-xl"><i class="fa-solid fa-right-from-bracket"></i></button>`;
    $('admin-panel').classList.remove('hidden');
    if (user.role === 'super') {
        $('super-admin-tools').classList.remove('hidden');
        onSnapshot(collection(db, "admins"), (snap) => {
            const list = []; snap.forEach(docSnap => list.push({id: docSnap.id, ...docSnap.data()}));
            $('admin-list-container').innerHTML = `<p class="mb-4 text-gray-400 text-[10px] uppercase tracking-[3px] font-bold">Admin Directory</p>` + list.map(a => `
                <div class="flex flex-col bg-white p-4 rounded-xl border border-gray-100 shadow-sm relative z-10 transition hover:shadow-md hover:border-indigo-100">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-black text-[13px] tracking-tight text-indigo-600">@${a.username.toUpperCase()}</span>
                        <button onclick="vflow.delAdmin('${a.id}')" class="text-red-500 font-black px-3 py-1.5 bg-red-50 rounded-lg text-[10px] hover:bg-red-500 hover:text-white transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="flex gap-2">
                        <input id="admin_p_${a.id}" type="password" placeholder="NEW PASSWORD" class="input-flat !py-2.5 text-[12px] flex-1 bg-gray-50/50">
                        <button onclick="vflow.updateAdminPass('${a.id}')" class="bg-gray-900 text-white font-bold rounded-lg px-4 text-[10px] hover:bg-indigo-600 active:scale-95 transition">SAVE PW</button>
                    </div>
                </div>`).join('');
        }, (error) => { console.error("Admin fetch error:", error); });
    }
}

onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
    const gamesData = []; snap.forEach(docSnap => gamesData.push({id: docSnap.id, ...docSnap.data()}));
    if (currentView === 'list') vflow.renderList(gamesData);
}, (error) => { vflow.showToast("無法載入活動列表", true); console.error("Games fetch error:", error); });
</script>
</body>
</html>
