<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VolleyballFlow 4.0 | 專業排球活動平台</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 明亮專業主題設定 */
        body { 
            background: #f4f7f6; /* 清新淺灰背景 */
            color: #0f172a; /* 深色文字 */
            font-family: 'Urbanist', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        /* 專業白色卡片設計 */
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        /* Modal 背景 */
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 3000; }

        /* Bottom Sheet 底部抽屜 */
        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: #ffffff; color: #0f172a;
            border-top-left-radius: 32px; border-top-right-radius: 32px;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 1000; padding: 32px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999;
        }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }

        /* 收據 Ticket 設計 */
        .ticket-design {
            border: 2px dashed #cbd5e1; border-left: none; border-right: none;
            padding: 20px 0; position: relative;
        }
        .ticket-design::before, .ticket-design::after {
            content: ''; position: absolute; top: 50%; width: 20px; height: 20px; background: #ffffff; border-radius: 50%;
        }
        .ticket-design::before { left: -12px; transform: translateY(-50%); border-right: 2px dashed #cbd5e1; }
        .ticket-design::after { right: -12px; transform: translateY(-50%); border-left: 2px dashed #cbd5e1; }

        /* 位置按鈕與標籤 (明亮版) */
        .pos-btn { transition: all 0.2s; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; }
        .pos-selected { background: #4f46e5 !important; color: #ffffff !important; border-color: #4f46e5 !important; font-weight: 900; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        
        /* 輸入框通用樣式 */
        .input-light {
            width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 16px; 
            font-size: 14px; outline: none; color: #0f172a; transition: all 0.2s;
        }
        .input-light:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="p-5 pb-24">

    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-10 text-center relative z-10 pt-4">
            <h1 onclick="vflow.clickSecret()" class="text-4xl font-black italic tracking-tighter text-slate-900 leading-none cursor-pointer select-none">VOLLEYFLOW<span class="text-indigo-600">.</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em] mt-3">Professional Ecosystem</p>
            <div id="admin-status" class="mt-6"></div>
        </header>

        <div id="admin-panel" class="hidden space-y-6 mb-12">
            
            <div id="super-admin-tools" class="hidden glass-card p-6 border-red-200 bg-red-50">
                <h3 class="text-xs font-black uppercase text-red-600 tracking-widest mb-4">👑 Super Admin</h3>
                <div class="flex gap-2 mb-4">
                    <input id="new_admin_u" type="text" placeholder="New Username" class="flex-1 bg-white border border-red-200 p-3 rounded-xl text-xs outline-none focus:border-red-400">
                    <input id="new_admin_p" type="text" placeholder="Password" class="flex-1 bg-white border border-red-200 p-3 rounded-xl text-xs outline-none focus:border-red-400">
                    <button onclick="vflow.addAdminAccount()" class="bg-red-500 text-white px-4 rounded-xl text-[10px] font-black shadow-md">Add</button>
                </div>
                <div id="admin-list-container" class="space-y-2 mt-4 border-t border-red-200 pt-4"></div>
            </div>

            <div class="glass-card p-6">
                <h3 class="text-[11px] font-black uppercase text-slate-500 tracking-widest mb-4">收款設定 Payment</h3>
                <div class="grid grid-cols-2 gap-2 mb-4 bg-slate-100 p-1 rounded-2xl">
                    <button onclick="vflow.setPayMode('link')" id="mode-link" class="py-3 rounded-xl text-[10px] font-black uppercase transition-all bg-white text-indigo-600 shadow-sm">PayMe 連結</button>
                    <button onclick="vflow.setPayMode('image')" id="mode-image" class="py-3 rounded-xl text-[10px] font-black uppercase transition-all text-slate-500 hover:bg-slate-200/50">Alipay QR圖</button>
                </div>
                <div id="pay-url-box" class="flex gap-2">
                    <input id="pay_url_input" type="text" placeholder="貼上 PayMe / FPS 連結..." class="input-light flex-1 !p-3">
                    <button onclick="vflow.updatePayUrl()" class="bg-indigo-600 text-white px-6 rounded-xl text-[10px] font-black uppercase shadow-md active:scale-95">儲存</button>
                </div>
                <div id="pay-image-box" class="hidden">
                    <input id="pay_img_input" type="file" accept="image/*" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-[10px] mb-2 text-slate-600">
                    <button onclick="vflow.uploadPayImg()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl text-[10px] font-black uppercase shadow-md active:scale-95">上傳 Alipay QR Code</button>
                </div>
            </div>

            <div class="glass-card p-8 bg-gradient-to-br from-white to-slate-50">
                <h3 class="text-sm font-black uppercase text-slate-800 tracking-tighter mb-6" id="create-title">Create New Game 🏐</h3>
                <div class="space-y-4">
                    <input id="new_loc" type="text" placeholder="體育館名稱" class="input-light">
                    <input id="new_date" type="date" class="input-light text-slate-600">
                    <input id="new_time" type="text" placeholder="時間 (例如 19:00 - 21:00)" class="input-light">
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                            <label class="text-[9px] font-bold text-slate-400 uppercase block">名額</label>
                            <input id="new_max" type="number" value="15" class="bg-transparent text-slate-800 w-full outline-none font-black text-lg">
                        </div>
                        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                            <label class="text-[9px] font-bold text-slate-400 uppercase block">收費</label>
                            <input id="new_price" type="number" value="30" class="bg-transparent text-slate-800 w-full outline-none font-black text-lg">
                        </div>
                        <div class="bg-red-50 p-3 rounded-2xl border border-red-100 shadow-sm">
                            <label class="text-[9px] font-bold text-red-500 uppercase block">場租</label>
                            <input id="new_cost" type="number" value="0" class="bg-transparent text-red-600 w-full outline-none font-black text-lg">
                        </div>
                    </div>
                    <button onclick="vflow.createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs mt-2">發布場次</button>
                </div>
            </div>
        </div>

        <div id="main-content" class="relative z-10 space-y-5"></div>

        <div id="story_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[2000]">
            <div class="bg-white w-full max-w-sm p-6 rounded-[32px] shadow-2xl border border-slate-100">
                <h3 class="text-slate-800 text-center font-black uppercase mb-4 tracking-widest">Post Ready! 📸</h3>
                <img id="story_preview" src="" class="w-full rounded-2xl mb-6 shadow-md border border-slate-100">
                <a id="story_download_btn" href="#" download="story.png" class="block w-full bg-indigo-600 text-white text-center font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs mb-2">下載宣傳圖</a>
                <button onclick="document.getElementById('story_modal').classList.add('hidden')" class="w-full text-slate-400 font-bold py-2 text-[10px] uppercase hover:text-slate-600 transition-colors">取消</button>
            </div>
        </div>

        <div id="login_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[3000]">
            <div class="glass-card w-full max-w-xs p-8 text-center bg-white">
                <h3 class="font-black italic text-slate-800 mb-6 uppercase text-xl">Organizer Login</h3>
                <input id="login_u" type="text" placeholder="Username" class="input-light mb-3">
                <input id="login_p" type="password" placeholder="Password" class="input-light mb-6">
                <div class="flex gap-3">
                    <button onclick="vflow.closeLogin()" class="flex-1 bg-slate-100 text-slate-600 font-black py-3.5 rounded-xl uppercase text-xs hover:bg-slate-200 transition-colors">Cancel</button>
                    <button onclick="vflow.login()" class="flex-1 bg-indigo-600 text-white font-black py-3.5 rounded-xl uppercase text-xs shadow-md shadow-indigo-200">Login</button>
                </div>
            </div>
        </div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay" onclick="vflow.closeSheet()"></div>
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-100">
                <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
            </div>
            <h3 class="text-2xl font-black italic uppercase tracking-tighter text-slate-900" id="sheet-title">付款收據</h3>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1" id="sheet-subtitle">Confirm & Pay</p>
        </div>

        <div class="ticket-design mb-8">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-black text-slate-400 uppercase">活動詳情</span>
                <span class="text-[10px] font-black text-indigo-600 uppercase bg-indigo-50 px-2 py-1 rounded" id="sheet-org-name">Organizer</span>
            </div>
            <p class="font-black text-lg text-slate-800" id="sheet-loc-time">Location & Time</p>
            <div class="mt-6 pt-6 border-t border-slate-100 flex justify-between items-end">
                <div>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">總計費用</p>
                    <p class="text-3xl font-black text-slate-900" id="sheet-price">$0</p>
                </div>
                <p class="text-[10px] font-black text-slate-600 bg-slate-100 px-3 py-1 rounded-full border border-slate-200" id="sheet-ig-tag">@your_ig</p>
            </div>
        </div>

        <div id="sheet-action-area" class="space-y-4"></div>
        <button onclick="location.reload()" class="w-full mt-6 text-slate-400 font-black text-[10px] uppercase tracking-widest hover:text-slate-600">完成 / 稍後再說</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0",
            authDomain: "volleyballflow-7cf02.firebaseapp.com",
            projectId: "volleyballflow-7cf02",
            storageBucket: "volleyballflow-7cf02.firebasestorage.app",
            messagingSenderId: "1032620495700",
            appId: "1:1032620495700:web:c2d84f02e435d99e15eec1"
        };
        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });
        
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };

        let user = JSON.parse(sessionStorage.getItem('vf_user'));
        let currentView = 'list';
        let myPaymentData = { mode: 'link', payUrl: '', payImg: '' };
        let selectedPositions = [];
        let secretClicks = 0;

        window.vflow = {
            sendTG: async (msg) => { try { await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage?chat_id=${TG_CONFIG.chatId}&text=${encodeURIComponent(msg)}`); } catch(e){} },

            clickSecret: () => { 
                secretClicks++; 
                if(secretClicks === 4){ document.getElementById('login_modal').classList.remove('hidden'); secretClicks=0; } 
                setTimeout(()=>secretClicks=0, 3000); 
            },
            closeLogin: () => {
                document.getElementById('login_modal').classList.add('hidden');
                document.getElementById('login_u').value = ''; document.getElementById('login_p').value = '';
            },
            
            login: async () => { 
                const u = document.getElementById('login_u').value.trim(); const p = document.getElementById('login_p').value.trim();
                if(u === "Manusyip" && p === "Manusyip0830") { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'super'})); location.reload(); return; }
                const snap = await getDocs(query(collection(db, "admins"), where("username", "==", u), where("password", "==", p)));
                if(!snap.empty) { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'normal'})); location.reload(); } else { alert("帳號或密碼錯誤"); }
            },
            
            openSheet: () => { document.getElementById('bottom-sheet').classList.add('open'); document.getElementById('sheet-overlay').classList.add('open'); },
            closeSheet: () => { document.getElementById('bottom-sheet').classList.remove('open'); document.getElementById('sheet-overlay').classList.remove('open'); },

            setPayMode: (mode) => {
                myPaymentData.mode = mode; const isLink = mode === 'link';
                document.getElementById('mode-link').className = `py-3 rounded-xl text-[10px] font-black uppercase transition-all ${isLink ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`;
                document.getElementById('mode-image').className = `py-3 rounded-xl text-[10px] font-black uppercase transition-all ${!isLink ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`;
                document.getElementById('pay-url-box').classList.toggle('hidden', !isLink); document.getElementById('pay-image-box').classList.toggle('hidden', isLink);
            },

            updatePayUrl: async () => { await setDoc(doc(db, "admins", user.name), { payMode: 'link', payUrl: document.getElementById('pay_url_input').value }, { merge: true }); alert("已儲存 PayMe 連結!"); },
            uploadPayImg: function() {
                const file = document.getElementById('pay_img_input').files[0]; if(!file) return alert("請選擇圖片");
                const reader = new FileReader(); reader.onloadend = async () => { await setDoc(doc(db, "admins", user.name), { payMode: 'image', payImg: reader.result }, { merge: true }); alert("已上傳 Alipay QR Code!"); }; reader.readAsDataURL(file);
            },

            createGame: async () => {
                const loc = document.getElementById('new_loc').value.trim(); const dateVal = document.getElementById('new_date').value; const timeStr = document.getElementById('new_time').value.trim();
                if(!loc || !dateVal || !timeStr) return alert("請填寫完整資料");
                const weekDay = ["日", "一", "二", "三", "四", "五", "六"][new Date(dateVal).getDay()];
                const fullLoc = loc.includes("體育館") ? loc : `${loc}體育館`; const fullTime = `${dateVal} (${weekDay}) ${timeStr}`;
                await addDoc(collection(db, "games"), { location: fullLoc, time: fullTime, maxPlayers: parseInt(document.getElementById('new_max').value), price: parseInt(document.getElementById('new_price').value), cost: parseInt(document.getElementById('new_cost').value || 0), createdBy: user.name, timestamp: serverTimestamp() });
                vflow.sendTG(`🆕 新場次發佈\n📍 ${fullLoc}\n⏰ ${fullTime}\n👤 搞手: ${user.name}`);
                location.reload();
            },

            cloneGame: async (id) => {
                const docSnap = await getDoc(doc(db, "games", id));
                if (docSnap.exists()) {
                    const g = docSnap.data();
                    document.getElementById('new_loc').value = g.location.replace('體育館', ''); document.getElementById('new_max').value = g.maxPlayers; document.getElementById('new_price').value = g.price; document.getElementById('new_cost').value = g.cost || 0;
                    document.getElementById('create-title').innerText = "Clone Session (請設定新日期)"; document.getElementById('admin-panel').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            },

            delGame: async (id) => { if(confirm("確定要刪除整個場次嗎？此動作無法復原。")) { await deleteDoc(doc(db, "games", id)); location.reload(); } },

            setPos: (p) => {
                const idx = selectedPositions.indexOf(p);
                if(idx > -1) selectedPositions.splice(idx, 1); else { if(selectedPositions.length >= 2) return alert("最多只能選擇 2 個位置"); selectedPositions.push(p); }
                document.querySelectorAll('.pos-btn').forEach(btn => { if(selectedPositions.includes(btn.getAttribute('data-pos'))) btn.classList.add('pos-selected'); else btn.classList.remove('pos-selected'); });
            },

            join: async (gid, pr, loc, time, maxLimit, createdBy) => {
                const ig = document.getElementById('ig').value.trim();
                if(!ig.startsWith('@')) return alert("IG 必須以 @ 開頭");
                if(selectedPositions.length === 0) return alert("請至少選擇 1 個位置");
                localStorage.setItem('vf_player_profile', JSON.stringify({ ig: ig, positions: selectedPositions }));
                const posStr = selectedPositions.join(' & ');
                if(!confirm(`確認報名 ${loc}?`)) return;

                try {
                    const blDoc = await getDoc(doc(db, "blacklists", ig.toLowerCase()));
                    const noShowCount = blDoc.exists() ? blDoc.data().count : 0;
                    const pSnap = await getDocs(collection(db, `games/${gid}/players`));
                    const isWaitlist = pSnap.size >= maxLimit; const joinStatus = isWaitlist ? "waitlist" : "pending";

                    await addDoc(collection(db, `games/${gid}/players`), { ig, pos: posStr, status: joinStatus, noShowCount, timestamp: serverTimestamp() });
                    vflow.sendTG(`📝 ${ig} 報名咗\n📍 ${loc}\n⏰ ${time}\n🏐 位置: ${posStr}\n📊 狀態: ${isWaitlist ? '⏳ 後補' : '✅ 正選'}`);
                    
                    document.getElementById('sheet-loc-time').innerText = `${loc} | ${time}`;
                    document.getElementById('sheet-price').innerText = `$${pr}`; document.getElementById('sheet-ig-tag').innerText = ig; document.getElementById('sheet-org-name').innerText = `@${createdBy}`;

                    const area = document.getElementById('sheet-action-area');
                    if(isWaitlist) {
                        document.getElementById('sheet-title').innerText = "進入後補名單"; document.getElementById('sheet-subtitle').innerText = "Waitlist Confirmed";
                        area.innerHTML = `<div class="bg-amber-50 border border-amber-200 p-6 rounded-2xl"><p class="text-sm font-bold text-amber-700 text-center leading-relaxed">正選名額已滿<br>如有球員退出，搞手會主動 IG 聯絡您付款。</p></div>`;
                    } else {
                        const adminDoc = await getDoc(doc(db, "admins", createdBy)); const orgData = adminDoc.data();
                        document.getElementById('sheet-title').innerText = "報名成功"; document.getElementById('sheet-subtitle').innerText = "Ticket Reserved";
                        
                        if(orgData && orgData.payMode === 'link' && orgData.payUrl) {
                            area.innerHTML = `<button onclick="window.open('${orgData.payUrl}', '_blank')" class="w-full bg-[#E51B5C] text-white font-black py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-transform"><i class="fa-solid fa-link text-lg"></i> PayMe 連結一鍵付款</button>`;
                        } else if(orgData && orgData.payImg) {
                            area.innerHTML = `<div class="bg-slate-50 p-5 rounded-3xl border border-slate-200 text-center"><img src="${orgData.payImg}" class="w-56 mx-auto rounded-xl mb-4 shadow-sm border border-slate-200"><div class="bg-[#00A0E9] text-white text-[11px] font-bold py-2 px-4 rounded-full inline-block tracking-widest"><i class="fa-solid fa-qrcode mr-1"></i> 掃描 Alipay / FPS QR Code</div></div>`;
                        } else {
                            area.innerHTML = `<p class="text-xs text-center font-bold text-slate-400 py-5 border border-dashed border-slate-300 rounded-2xl bg-slate-50">搞手尚未設定自動收款，請等候 IG 通知</p>`;
                        }
                    }
                    vflow.openSheet();
                } catch(e) { alert("報名發生錯誤，請重試"); }
            },

            renderList: (games) => {
                const container = document.getElementById('main-content');
                if(games.length === 0) { container.innerHTML = `<div class="glass-card py-24 text-center border-dashed border-2 border-slate-200 shadow-none"><i class="fa-solid fa-volleyball text-4xl text-slate-300 mb-4 block"></i><p class="text-slate-400 font-black italic uppercase tracking-widest text-sm">No Sessions Active</p></div>`; return; }
                container.innerHTML = games.map(g => `
                    <div onclick="vflow.goToGame('${g.id}')" class="glass-card p-6 active:scale-[0.98] transition-all cursor-pointer relative overflow-hidden group hover:border-indigo-300 hover:shadow-lg">
                        <div class="flex justify-between items-start mb-3">
                            <p class="text-[11px] font-black text-indigo-600 uppercase tracking-wide">${g.time}</p>
                            <span class="text-[9px] font-black text-slate-500 uppercase bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200">Org: ${g.createdBy}</span>
                        </div>
                        <h3 class="text-2xl font-black italic text-slate-800 group-hover:text-indigo-600 transition-colors">${g.location}</h3>
                        ${(user?.role==='super'||user?.name===g.createdBy) ? `
                            <div class="mt-5 flex gap-2 border-t border-slate-100 pt-4">
                                <button onclick="event.stopPropagation();vflow.generateStory('${g.location}', '${g.time}', ${g.maxPlayers}, ${g.price}, '${g.createdBy}')" class="flex-1 bg-indigo-50 text-indigo-600 text-[10px] font-black py-2.5 rounded-lg uppercase hover:bg-indigo-100 transition-colors">Story圖</button>
                                <button onclick="event.stopPropagation();vflow.cloneGame('${g.id}')" class="flex-1 bg-slate-100 text-slate-600 text-[10px] font-black py-2.5 rounded-lg uppercase hover:bg-slate-200 transition-colors">Clone</button>
                                <button onclick="event.stopPropagation();vflow.delGame('${g.id}')" class="flex-1 bg-red-50 text-red-500 text-[10px] font-black py-2.5 rounded-lg uppercase hover:bg-red-100 transition-colors">Delete</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            },

            generateStory: (loc, time, max, price, orgName) => {
                const canvas = document.createElement('canvas'); canvas.width = 1080; canvas.height = 1920; const ctx = canvas.getContext('2d');
                // 明亮主題 IG Story 背景
                const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
                grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#f1f5f9');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1080, 1920);
                // 裝飾圖形
                ctx.fillStyle = '#e0e7ff'; ctx.beginPath(); ctx.arc(100, 200, 300, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(900, 1700, 400, 0, 2 * Math.PI); ctx.fill();
                
                ctx.textAlign = 'center'; 
                ctx.fillStyle = '#0f172a'; ctx.font = 'italic 900 110px sans-serif'; ctx.fillText('VOLLEYFLOW.', 540, 300);
                ctx.fillStyle = '#4f46e5'; ctx.font = '700 45px sans-serif'; ctx.fillText(`Organizer: @${orgName}`, 540, 390);
                
                ctx.fillStyle = '#ffffff'; ctx.shadowColor = "rgba(0,0,0,0.05)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
                ctx.beginPath(); ctx.roundRect(80, 550, 920, 750, 60); ctx.fill(); ctx.shadowColor = "transparent";
                
                ctx.fillStyle = '#0f172a'; ctx.font = '900 85px sans-serif'; ctx.fillText(loc, 540, 780);
                ctx.fillStyle = '#64748b'; ctx.font = '600 55px sans-serif'; ctx.fillText(time, 540, 930);
                ctx.fillStyle = '#4f46e5'; ctx.font = '900 75px sans-serif'; ctx.fillText(`Entry: $${price}  |  Seats: ${max}`, 540, 1150);
                
                ctx.fillStyle = '#0f172a'; ctx.font = '900 70px sans-serif'; ctx.fillText('👉 LINK IN BIO 👈', 540, 1650);
                
                document.getElementById('story_preview').src = canvas.toDataURL("image/png");
                document.getElementById('story_download_btn').href = canvas.toDataURL("image/png");
                document.getElementById('story_modal').classList.remove('hidden');
            },

            goToGame: (id) => {
                currentView = 'detail'; selectedPositions = [];
                onSnapshot(doc(db, "games", id), (d) => {
                    if(!d.exists()) return;
                    const g = d.data(); const isMgr = user?.role === 'super' || user?.name === g.createdBy; const cost = g.cost || 0;
                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-5 text-indigo-600 font-black text-xs uppercase tracking-widest px-2 hover:text-indigo-800 transition-colors"><i class="fa-solid fa-arrow-left mr-2"></i>Back</button>
                        
                        <div class="glass-card p-10 mb-8 relative border-none bg-gradient-to-br from-indigo-50 to-blue-50 overflow-hidden shadow-sm">
                            <div class="absolute -right-10 -top-10 text-indigo-100 text-[150px]"><i class="fa-solid fa-volleyball"></i></div>
                            <h2 class="text-3xl font-black italic mb-3 relative z-10 text-slate-800">${g.location}</h2>
                            <p class="text-sm font-bold text-indigo-600 tracking-tighter relative z-10 bg-white inline-block px-3 py-1 rounded-md border border-indigo-100">${g.time}</p>
                            ${isMgr ? `<button onclick="vflow.copyWA('${id}','${g.location}','${g.time}', ${g.maxPlayers})" class="absolute right-6 bottom-6 bg-slate-900 text-white text-[10px] px-5 py-2.5 rounded-full font-black uppercase shadow-lg relative z-10 hover:bg-slate-800 transition-colors"><i class="fa-brands fa-whatsapp mr-1"></i> Copy List</button>` : ''}
                        </div>
                        
                        ${isMgr ? `
                            <div class="glass-card p-6 mb-8 border-indigo-100 bg-white">
                                <p class="text-[10px] font-black text-indigo-600 mb-6 uppercase tracking-[0.2em] text-center bg-indigo-50 py-2 rounded-lg">Profit & Analytics</p>
                                <div class="grid grid-cols-2 gap-4 mb-6">
                                    <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                                        <p class="text-[9px] font-bold text-slate-500 uppercase mb-1">場地成本</p>
                                        <p class="text-xl font-black text-slate-800">-$${cost}</p>
                                    </div>
                                    <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                                        <p class="text-[9px] font-bold text-slate-500 uppercase mb-1">已收金額</p>
                                        <p class="text-xl font-black text-emerald-600" id="stat-paid">$0</p>
                                    </div>
                                </div>
                                <div class="bg-indigo-600 text-white p-6 rounded-2xl flex justify-between items-center shadow-md shadow-indigo-200">
                                    <div><p class="text-[9px] font-bold text-indigo-200 uppercase mb-1">預計淨利潤</p><p class="text-3xl font-black" id="stat-profit">$0</p></div>
                                    <div class="text-right"><p class="text-[8px] font-bold text-indigo-200 uppercase mb-1">系統抽成 (10%)</p><p class="text-sm font-black bg-white/20 px-2 py-1 rounded" id="stat-commission">$0</p></div>
                                </div>
                                <div class="mt-6 flex flex-col gap-3 text-slate-600 text-[11px] font-bold border-t border-slate-100 pt-5">
                                    <div class="flex justify-between items-center"><span>調整總名額:</span><input type="number" value="${g.maxPlayers}" onchange="vflow.upField('${id}','maxPlayers',this.value)" class="w-20 bg-slate-100 border border-slate-200 rounded-lg p-2 outline-none text-slate-900 text-center focus:border-indigo-500"></div>
                                    <div class="flex justify-between items-center"><span>調整每位收費:</span><input type="number" value="${g.price}" onchange="vflow.upField('${id}','price',this.value)" class="w-20 bg-slate-100 border border-slate-200 rounded-lg p-2 outline-none text-slate-900 text-center focus:border-indigo-500"></div>
                                </div>
                            </div>` : ''}
                        
                        <div class="glass-card p-8 mb-8 border-none shadow-md">
                            <div class="flex justify-between items-center mb-6">
                                <span class="font-black italic text-slate-500 text-[11px] uppercase tracking-widest">Player Registration</span>
                                <span id="p-count" class="text-indigo-700 font-black text-[11px] bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-md uppercase italic">Loading...</span>
                            </div>
                            <input id="ig" type="text" placeholder="@Your_Instagram" class="input-light mb-5 font-bold text-center text-base">
                            <div class="grid grid-cols-1 gap-2.5 mb-8">
                                ${['Setter (二傳)', 'Outside Hitter (大搥)', 'Middle Blocker (快攻)', 'Opposite (接應)', 'Libero (自由人)'].map(p => `<button data-pos="${p}" onclick="vflow.setPos('${p}')" class="pos-btn py-4 rounded-[16px] text-[11px] font-black uppercase shadow-sm">${p}</button>`).join('')}
                            </div>
                            <button onclick="vflow.join('${id}', ${g.price}, '${g.location}', '${g.time}', ${g.maxPlayers}, '${g.createdBy}')" class="w-full bg-slate-900 text-white font-black py-5 rounded-[20px] shadow-xl shadow-slate-300 uppercase tracking-widest active:scale-95 transition-all text-sm hover:bg-slate-800">立刻報名 $${g.price}</button>
                        </div>
                        <div id="player-list" class="space-y-3 pb-20"></div>
                    `;
                    const saved = JSON.parse(localStorage.getItem('vf_player_profile'));
                    if(saved) { document.getElementById('ig').value = saved.ig; saved.positions.forEach(p => vflow.setPos(p)); }
                    vflow.listenPlayers(id, isMgr, g.maxPlayers, g.price, cost);
                });
            },

            listenPlayers: (gid, isMgr, max, price, cost) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const players = []; let paidCount = 0; let mainCount = 0;
                    snap.forEach(d => { const p = {id: d.id, ...d.data()}; players.push(p); if(players.length <= max) mainCount++; if(p.status === 'confirmed' && players.length <= max) paidCount++; });
                    if(document.getElementById('p-count')) document.getElementById('p-count').innerText = `${mainCount} / ${max}`;
                    if(isMgr && document.getElementById('stat-paid')) { 
                        const rev = mainCount * price; const profit = rev - cost;
                        document.getElementById('stat-paid').innerText = `$${paidCount * price}`; document.getElementById('stat-profit').innerText = `$${profit}`; document.getElementById('stat-commission').innerText = `$${(profit > 0 ? profit*0.1 : 0).toFixed(1)}`; 
                    }
                    if(isMgr) {
                        document.getElementById('player-list').innerHTML = players.map((p, index) => {
                            const isWait = index >= max;
                            return `
                            <div class="glass-card p-5 border flex flex-col gap-4 shadow-sm ${isWait ? 'opacity-60 bg-amber-50/50 border-amber-100' : 'bg-white border-slate-100'}">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="font-black text-slate-800 text-sm">${isWait ? 'W' + (index-max+1) : index+1}. ${p.ig} ${(p.noShowCount>0) ? '<span class="text-[9px] bg-red-100 text-red-600 px-2 py-0.5 rounded ml-2 uppercase animate-pulse-soft border border-red-200">飛機底</span>' : ''}</p>
                                        <p class="text-[9px] font-black uppercase tracking-widest ${p.status==='confirmed'?'text-emerald-500':'text-orange-500'} mt-1">${p.status==='confirmed'?'● PAID':'○ PENDING'} - ${p.pos}</p>
                                    </div>
                                    <div class="flex gap-1.5">
                                        <button onclick="vflow.confirmP('${gid}','${p.id}')" class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-4 py-2.5 rounded-xl text-[9px] font-black uppercase shadow-sm hover:bg-emerald-100">核實</button>
                                        <button onclick="vflow.delP('${gid}','${p.id}','${p.ig}')" class="bg-slate-100 text-slate-500 border border-slate-200 px-4 py-2.5 rounded-xl text-[9px] font-black uppercase hover:bg-slate-200">踢走</button>
                                    </div>
                                </div>
                                <button onclick="vflow.markNoShow('${gid}','${p.id}','${p.ig}')" class="w-full bg-red-50 text-red-500 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest border border-red-100 hover:bg-red-100 transition-colors">🚫 標記放飛機 (扣除信用)</button>
                            </div>`;
                        }).join('');
                    } else { document.getElementById('player-list').innerHTML = `<div class="py-12 text-center bg-slate-50 rounded-3xl border border-slate-100"><i class="fa-solid fa-shield-halved text-slate-300 text-3xl mb-3 block"></i><p class="text-slate-400 text-[11px] font-black uppercase italic tracking-widest">List Protected</p></div>`; }
                });
            },
            
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid, ig) => { if(confirm(`確定要踢走 ${ig} 嗎？`)) { await deleteDoc(doc(db, `games/${gid}/players`, pid)); vflow.sendTG(`⚠️ 搞手踢走咗 ${ig}`); } },
            markNoShow: async (gid, pid, ig) => { if(!confirm(`確定要將 ${ig} 加入全平台黑名單？此紀錄會跟隨此 IG。`)) return; await setDoc(doc(db, "blacklists", ig.toLowerCase()), { count: increment(1), lastOffense: serverTimestamp() }, { merge: true }); await deleteDoc(doc(db, `games/${gid}/players`, pid)); vflow.sendTG(`🚨 嚴重警告：搞手標記咗 ${ig} 放飛機並踢出名單！`); },
            upField: async (id, f, v) => await updateDoc(doc(db, "games", id), { [f]: parseInt(v) }),
            
            addAdminAccount: async () => { 
                const u = document.getElementById('new_admin_u').value.trim(); const p = document.getElementById('new_admin_p').value.trim();
                if(!u || !p) return alert("Please enter username and password");
                await setDoc(doc(db, "admins", u), { username: u, password: p, role: 'organizer' }); 
                alert("搞手帳號創建成功！"); document.getElementById('new_admin_u').value = ''; document.getElementById('new_admin_p').value = ''; vflow.loadAdminList();
            },
            loadAdminList: async () => {
                const snap = await getDocs(collection(db, "admins")); let h = "";
                snap.forEach(d => { if(d.id !== 'Manusyip') { h += `<div class="bg-white border border-red-100 p-3 rounded-xl flex justify-between items-center"><span class="text-xs font-bold text-slate-700">@${d.id}</span><button onclick="vflow.delAdmin('${d.id}')" class="text-red-500 text-[10px] font-black uppercase bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100">刪除</button></div>`; } });
                document.getElementById('admin-list-container').innerHTML = h;
            },
            delAdmin: async (id) => { if(confirm(`確定刪除搞手 ${id}?`)) await deleteDoc(doc(db, "admins", id)); vflow.loadAdminList(); },
            
            copyWA: async (gid, loc, time, max) => {
                const snap = await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")));
                let txt = `🏐 *VOLLEYFLOW 名單*\n📍 ${loc}\n⏰ ${time}\n\n`;
                let i = 0; snap.forEach(d => { const p = d.data(); if(i === max) txt += `\n--- ⏳ 後補名單 ---\n`; txt += `${i >= max ? 'W'+(i-max+1) : i+1}. ${p.ig} (${p.pos}) ${p.status==='confirmed'?'✅':'⏳'}\n`; i++; });
                navigator.clipboard.writeText(txt); alert("已經複製到剪貼簿，可以去 WhatsApp 貼上！");
            }
        };

        if (user) {
            document.getElementById('admin-status').innerHTML = `<div class="flex justify-center gap-3 items-center"><span class="bg-indigo-50 border border-indigo-100 text-indigo-700 text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm">Org: ${user.name}</span><button onclick="sessionStorage.clear();location.reload();" class="text-[10px] font-black text-slate-400 hover:text-slate-600 uppercase transition-colors">Logout</button></div>`;
            document.getElementById('admin-panel').classList.remove('hidden');
            getDoc(doc(db, "admins", user.name)).then(d => { if(d.exists()) vflow.setPayMode(d.data().payMode || 'link'); });
            if(user.role === 'super') { document.getElementById('super-admin-tools').classList.remove('hidden'); vflow.loadAdminList(); }
        }

        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
            const games = []; snap.forEach(d => games.push({id: d.id, ...d.data()}));
            if(currentView === 'list') vflow.renderList(games);
        });
    </script>
</body>
</html>
