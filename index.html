<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyFlow | 專業排球系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- [區域 1: 配置與超級管理員設定] ---
        const firebaseConfig = {
            apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0",
            authDomain: "volleyballflow-7cf02.firebaseapp.com",
            projectId: "volleyballflow-7cf02",
            storageBucket: "volleyballflow-7cf02.firebasestorage.app",
            messagingSenderId: "1032620495700",
            appId: "1:1032620495700:web:c2d84f02e435d99e15eec1",
            measurementId: "G-Z5FCYXRT4M"
        };

        const SUPER_ADMIN = { user: "Manusyip", pass: "Manusyip0830" };
        const POS_MAP = { 'Setter': 'S', 'Outside Hitter': 'OH', 'Middle Blocker': 'MB', 'Opposite Hitter': 'OP', 'Libero': 'L' };

        // -----------------------------------------
        // 核心邏輯
        // -----------------------------------------
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let currentUser = JSON.parse(sessionStorage.getItem('vf_user_info')); 
        let isAdmin = !!currentUser;
        let isSuper = currentUser?.username === SUPER_ADMIN.user;
        let currentView = 'list';
        let selectedPositions = [];
        let payUrl = "";

        // --- [新功能: 登入邏輯] ---
        window.handleLogin = async () => {
            const u = document.getElementById('login_u').value;
            const p = document.getElementById('login_p').value;

            // 檢查是否為超級管理員
            if(u === SUPER_ADMIN.user && p === SUPER_ADMIN.pass) {
                const info = { username: u, role: 'super' };
                sessionStorage.setItem('vf_user_info', JSON.stringify(info));
                location.reload();
                return;
            }

            // 檢查普通管理員 (Firestore)
            const q = query(collection(db, "admins"), where("username", "==", u), where("password", "==", p));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const adminData = snap.docs[0].data();
                sessionStorage.setItem('vf_user_info', JSON.stringify({ username: u, role: 'normal', managedGames: adminData.managedGames || [] }));
                location.reload();
            } else {
                alert("帳號或密碼錯誤！");
            }
        };

        window.logout = () => { sessionStorage.removeItem('vf_user_info'); location.reload(); };

        // 秘密入口
        let bottomClickCount = 0;
        window.bottomSecret = () => {
            bottomClickCount++;
            if (bottomClickCount === 4) {
                document.getElementById('login_modal').classList.remove('hidden');
                bottomClickCount = 0;
            }
            setTimeout(() => { bottomClickCount = 0; }, 3000);
        };

        // 初始化
        function initApp() {
            onSnapshot(doc(db, "settings", "global"), (d) => { if (d.exists()) payUrl = d.data().payUrl; });
            onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snapshot) => {
                const games = [];
                snapshot.forEach(d => games.push({id: d.id, ...d.data()}));
                if (currentView === 'list') renderGameList(games);
            });
        }

        // -----------------------------------------
        // 模板渲染
        // -----------------------------------------
        function renderGameList(games) {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <h2 class="text-xl font-black italic text-slate-700 mb-6 px-2">招募中場次</h2>
                <div class="grid gap-4">
                    ${games.map(g => {
                        // 檢查權限：超級管理員 或 該場次的負責人
                        const canManage = isSuper || (currentUser && currentUser.username === g.createdBy);
                        return `
                        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-slate-100 relative">
                            <div onclick="goToGame('${g.id}')" class="cursor-pointer">
                                <p class="text-[10px] font-black text-blue-600 uppercase mb-1">${g.time}</p>
                                <h3 class="text-xl font-black text-slate-800">${g.location}</h3>
                                <p class="text-[9px] text-slate-400 mt-1">主辦: ${g.createdBy || '系統'}</p>
                            </div>
                            ${canManage ? `<button onclick="deleteEntireGame('${g.id}')" class="absolute top-6 right-6 text-red-300 text-[10px] font-bold">剷場</button>` : ''}
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        // --- [新功能: 智能發佈場次] ---
        window.createGame = async () => {
            const locName = document.getElementById('new_loc').value;
            const dateVal = document.getElementById('new_date').value;
            const timeVal = document.getElementById('new_time').value;
            const customMax = parseInt(document.getElementById('new_max').value) || 15;
            const customPrice = parseInt(document.getElementById('new_price').value) || 30;

            if(!locName || !dateVal || !timeVal) return alert("請填寫完整資訊");

            // 自動計算星期幾
            const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
            const dateObj = new Date(dateVal);
            const weekDay = weekDays[dateObj.getDay()];
            
            // 格式化時間字串: "2024-05-20 (一) 19:00-21:00"
            const finalTimeStr = `${dateVal} (${weekDay}) ${timeVal}`;
            const finalLoc = `${locName}體育館`;

            await addDoc(collection(db, "games"), {
                location: finalLoc,
                time: finalTimeStr,
                maxPlayers: customMax,
                price: customPrice,
                createdBy: currentUser.username,
                timestamp: serverTimestamp(),
                limits: { S: 2, OH: 4, MB: 2, OP: 2, L: 2 },
                enableLimit: false
            });
            alert("發佈成功！");
            location.reload();
        };

        // --- [超級管理員功能: 新增管理員] ---
        window.addNewAdmin = async () => {
            const u = prompt("輸入新管理員用戶名:");
            const p = prompt("輸入新管理員密碼:");
            if(u && p) {
                await setDoc(doc(db, "admins", u), { username: u, password: p, createdBy: "Manusyip" });
                alert("新增成功！");
            }
        };

        window.goToGame = (id) => {
            currentView = 'details';
            onSnapshot(doc(db, "games", id), (d) => {
                if (!d.exists()) return;
                const game = d.data();
                const canManage = isSuper || (currentUser && currentUser.username === game.createdBy);

                document.getElementById('main-content').innerHTML = `
                    <button onclick="window.location.reload()" class="mb-6 text-blue-600 font-black text-xs">← 返回列表</button>
                    <div class="bg-slate-900 text-white p-8 rounded-[40px] mb-6 shadow-xl relative">
                        <h2 class="text-2xl font-black italic mb-1">${game.location}</h2>
                        <p class="text-sm font-bold opacity-50 font-mono">${game.time}</p>
                        ${canManage ? `<button onclick="copyWA('${id}')" class="absolute right-6 bottom-6 bg-blue-600 text-[10px] px-4 py-2 rounded-full font-black">複製 WA 名單</button>` : ''}
                    </div>

                    ${canManage ? renderAdminPanel(id, game) : ''}

                    <div class="bg-white p-8 rounded-[30px] shadow-sm mb-6 border border-slate-100">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="font-black italic text-slate-400 text-sm">報名表單</h2>
                            <span id="count" class="text-blue-600 font-black text-[10px] bg-blue-50 px-3 py-1 rounded-full">載入中...</span>
                        </div>
                        <input id="ig" type="text" placeholder="@Instagram_ID" class="w-full bg-slate-50 p-4 rounded-2xl mb-4 outline-none font-bold">
                        <div id="pos-grid" class="grid grid-cols-1 gap-2 mb-8"></div>
                        <button onclick="joinGame('${id}', ${game.price})" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl">確認報名並支付 $${game.price || 30}</button>
                    </div>
                    <div id="player-list" class="space-y-2 pb-10"></div>
                `;
                listenToPlayers(id, game);
            });
        };

        function renderAdminPanel(id, game) {
            return `
                <div class="bg-blue-50 p-6 rounded-[30px] mb-6 text-xs border border-blue-100">
                    <h4 class="font-black text-blue-800 mb-3">管理面板 (負責人: ${game.createdBy})</h4>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <div class="bg-white p-3 rounded-xl">已收: <span id="income-paid" class="font-black text-green-600">$0</span></div>
                        <div class="bg-white p-3 rounded-xl">預計: <span id="income-total" class="font-black text-blue-600">$0</span></div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="font-bold text-slate-500">修改本場名額上限:</label>
                        <input type="number" value="${game.maxPlayers || 15}" onchange="updateGameField('${id}', 'maxPlayers', this.value)" class="p-2 rounded-lg border border-blue-200">
                        <label class="font-bold text-slate-500">修改本場費用:</label>
                        <input type="number" value="${game.price || 30}" onchange="updateGameField('${id}', 'price', this.value)" class="p-2 rounded-lg border border-blue-200">
                    </div>
                </div>
            `;
        }

        function listenToPlayers(gameId, gameData) {
            onSnapshot(query(collection(db, `games/${gameId}/players`), orderBy("timestamp", "asc")), (snapshot) => {
                const players = [];
                const posCount = { 'Setter': 0, 'Outside Hitter': 0, 'Middle Blocker': 0, 'Opposite Hitter': 0, 'Libero': 0 };
                let paidCount = 0;
                snapshot.forEach(d => {
                    const p = {id: d.id, ...d.data()};
                    players.push(p);
                    if (p.status === 'confirmed') paidCount++;
                    p.pos.split(' & ').forEach(posName => { if(posCount[posName] !== undefined) posCount[posName]++; });
                });

                const max = gameData.maxPlayers || 15;
                const price = gameData.price || 30;
                if(document.getElementById('count')) document.getElementById('count').innerText = `已報名：${players.length} / ${max}`;
                
                const canManage = isSuper || (currentUser && currentUser.username === gameData.createdBy);
                if(canManage && document.getElementById('income-paid')) {
                    document.getElementById('income-paid').innerText = `$${paidCount * price}`;
                    document.getElementById('income-total').innerText = `$${players.length * price}`;
                }

                // 渲染位置按鈕 (略, 保持原本邏輯)
                renderPosButtons(gameId, posCount, gameData.limits, gameData.enableLimit);
                
                // 渲染球員列表
                const listDiv = document.getElementById('player-list');
                if (canManage) {
                    listDiv.innerHTML = players.map(p => `
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                            <div><p class="font-black">${p.ig}</p><p class="text-[10px] text-blue-500">${p.pos}</p></div>
                            <div class="flex gap-1">
                                <button onclick="confirmPlayer('${gameId}', '${p.id}')" class="bg-green-500 text-white px-3 py-1 rounded-lg text-[10px]">核實</button>
                                <button onclick="deletePlayer('${gameId}', '${p.id}')" class="bg-red-50 text-red-400 px-3 py-1 rounded-lg text-[10px]">刪除</button>
                            </div>
                        </div>`).join('');
                } else {
                    listDiv.innerHTML = `<p class="py-10 text-center text-slate-300 text-[10px] italic">報名名單已加密</p>`;
                }
            });
        }

        window.updateGameField = async (id, field, val) => { await updateDoc(doc(db, "games", id), { [field]: parseInt(val) }); };
        window.confirmPlayer = async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" });
        window.deletePlayer = async (gid, pid) => await deleteDoc(doc(db, `games/${gid}/players`, pid));
        window.deleteEntireGame = async (id) => { if(confirm("確定刪除？")) await deleteDoc(doc(db, "games", id)); };

        window.joinGame = async (gameId, price) => {
            const ig = document.getElementById('ig').value.trim();
            if(!ig.startsWith('@') || selectedPositions.length === 0) return alert("請填寫正確 IG 並選擇位置！");
            if(!confirm(`確認支付 $${price} 報名？`)) return;
            await addDoc(collection(db, `games/${gameId}/players`), { ig, pos: selectedPositions.join(' & '), status: "pending", timestamp: serverTimestamp() });
            window.open(payUrl, "_blank");
            location.reload();
        };

        // 輔助渲染位置按鈕
        function renderPosButtons(gid, counts, limits, enable) {
            const grid = document.getElementById('pos-grid');
            if(!grid) return;
            grid.innerHTML = Object.entries(POS_MAP).map(([full, short]) => {
                const isSel = selectedPositions.includes(full);
                return `<button onclick="setPos('${full}')" class="p-4 rounded-2xl border font-black text-xs ${isSel?'bg-blue-600 text-white':'bg-slate-50'}">${full}</button>`;
            }).join('');
        }

        window.setPos = (p) => {
            const idx = selectedPositions.indexOf(p);
            if (idx > -1) selectedPositions.splice(idx, 1);
            else if (selectedPositions.length < 2) selectedPositions.push(p);
            location.hash = "#update"; // 觸發重繪
        };

        initApp();
    </script>
</head>
<body class="bg-slate-50 p-5 pb-20 font-sans">
    <div class="max-w-md mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter">VOLLEYFLOW</h1>
            ${isAdmin ? `<div class="mt-4 flex justify-center gap-2 items-center"><span class="text-[10px] font-black bg-blue-100 px-2 py-1 rounded">ADMIN: ${currentUser.username}</span><button onclick="logout()" class="text-[10px] underline text-red-400">Logout</button></div>` : ''}
        </header>

        ${isAdmin ? `
        <div class="bg-white p-8 rounded-[40px] shadow-2xl mb-10 border-2 border-blue-50">
            <h3 class="font-black text-sm mb-4 italic uppercase">發佈新場次</h3>
            <div class="space-y-3">
                <div class="flex items-center bg-slate-50 rounded-2xl px-4 border">
                    <input id="new_loc" type="text" placeholder="地方名 (例如: 天水圍)" class="flex-1 bg-transparent py-4 outline-none font-bold text-sm">
                    <span class="text-slate-400 font-bold text-sm">體育館</span>
                </div>
                <input id="new_date" type="date" class="w-full bg-slate-50 p-4 rounded-2xl border outline-none font-bold text-sm">
                <input id="new_time" type="text" placeholder="時間 (例如: 19:00-21:00)" class="w-full bg-slate-50 p-4 rounded-2xl border outline-none font-bold text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-slate-50 p-3 rounded-2xl border text-[10px] font-bold">名額: <input id="new_max" type="number" value="15" class="w-10 bg-transparent"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl border text-[10px] font-bold">費用: <input id="new_price" type="number" value="30" class="w-10 bg-transparent"></div>
                </div>
                <button onclick="createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs">發布場次</button>
                ${isSuper ? `<button onclick="addNewAdmin()" class="w-full border-2 border-slate-900 text-slate-900 font-black py-2 rounded-2xl text-[10px] mt-4">＋ 新增管理員帳號</button>` : ''}
            </div>
        </div>
        ` : ''}

        <div id="main-content"></div>

        <div id="login_modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-xs p-8 rounded-[40px] shadow-2xl">
                <h3 class="font-black italic mb-6 text-center">ADMIN LOGIN</h3>
                <input id="login_u" type="text" placeholder="用戶名稱" class="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none border font-bold">
                <input id="login_p" type="password" placeholder="密碼" class="w-full bg-slate-50 p-4 rounded-2xl mb-6 outline-none border font-bold">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg">登入系統</button>
                <button onclick="document.getElementById('login_modal').classList.add('hidden')" class="w-full text-slate-400 text-[10px] mt-4 font-bold italic">取消</button>
            </div>
        </div>

        <footer class="mt-20 py-10 text-center opacity-20">
            <div class="inline-block py-4 px-10 cursor-default" onclick="bottomSecret()">
                <p class="text-[9px] font-black uppercase tracking-[0.3em]">© 2026 VolleyFlow Collective</p>
            </div>
        </footer>
    </div>
</body>
</html>
