<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyballFlow 3.0 終極版 | 全港排球活動平台</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; background-color: #f8fafc; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 100; }
        .card { background: white; border-radius: 40px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid #f1f5f9; }
        .pos-selected { background-color: #2563eb !important; color: white !important; border-color: #2563eb !important; }
        .waitlist-card { opacity: 0.8; background-color: #fdf4ff !important; border-color: #f5d0fe !important; }
    </style>
</head>
<body class="min-h-screen p-5 pb-20 text-slate-900 select-none">
    <div id="app-root" class="max-w-md mx-auto">
        
        <header class="mb-12 text-center relative z-10">
            <h1 class="text-4xl font-black italic tracking-tighter text-slate-900 leading-none">VOLLEYBALLFLOW</h1>
            <p class="text-[9px] font-black text-blue-600 uppercase tracking-[0.3em] mt-2">B2B Organizer Platform</p>
            <div id="admin-status" class="mt-4"></div>
        </header>

        <div id="admin-panel" class="hidden animate-fade-in relative z-10">
            
            <div class="card p-6 mb-6 border border-blue-100 bg-blue-50/50">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-black text-[11px] italic uppercase text-blue-800 tracking-tighter">My Payment Setup (專屬收款)</h3>
                    <span class="text-[8px] bg-blue-200 text-blue-800 px-2 py-1 rounded font-black">必填</span>
                </div>
                <div class="flex gap-1 mb-3">
                    <button onclick="vflow.setPayMode('link')" id="mode-link" class="flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all bg-blue-600 text-white shadow-md">Pay Link</button>
                    <button onclick="vflow.setPayMode('image')" id="mode-image" class="flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all bg-white text-blue-600">QR Image</button>
                </div>
                <div id="pay-url-box" class="flex gap-2">
                    <input id="pay_url_input" type="text" placeholder="你的 PayMe/FPS 連結..." class="flex-1 bg-white p-3 rounded-xl text-[10px] font-bold outline-none border border-slate-200">
                    <button onclick="vflow.updatePayUrl()" class="bg-blue-600 text-white px-4 rounded-xl text-[9px] font-black uppercase">Save</button>
                </div>
                <div id="pay-image-box" class="hidden">
                    <input id="pay_img_input" type="file" accept="image/*" class="w-full bg-white p-2 rounded-xl text-[9px] font-bold mb-2">
                    <button onclick="vflow.uploadPayImg()" class="w-full bg-blue-600 text-white py-2 rounded-xl text-[9px] font-black uppercase">Upload QR Code</button>
                </div>
            </div>

            <div class="card p-8 mb-10 border-2 border-slate-100">
                <h3 class="font-black text-sm mb-4 italic uppercase text-slate-800 tracking-tighter" id="create-title">Create New Game</h3>
                <div class="space-y-3">
                    <input id="new_loc" type="text" placeholder="地方名 (如: 天水圍)" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <input id="new_date" type="date" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <input id="new_time" type="text" placeholder="時間 (如: 19:00-21:00)" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-[9px] font-black text-slate-400 uppercase">名額 <input id="new_max" type="number" value="15" class="bg-transparent text-slate-700 w-full outline-none font-black mt-1 text-sm"></div>
                        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-[9px] font-black text-slate-400 uppercase">收費 <input id="new_price" type="number" value="30" class="bg-transparent text-slate-700 w-full outline-none font-black mt-1 text-sm"></div>
                        <div class="bg-red-50 p-3 rounded-2xl border border-red-100 text-[9px] font-black text-red-400 uppercase">場租成本 <input id="new_cost" type="number" value="0" placeholder="$" class="bg-transparent text-red-600 w-full outline-none font-black mt-1 text-sm"></div>
                    </div>
                    <button onclick="vflow.createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">發布場次</button>
                    
                    <div id="super-admin-tools" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <div class="bg-slate-50 p-4 rounded-3xl border border-slate-200">
                            <p class="text-[9px] font-black text-slate-500 mb-3 uppercase italic text-center">Platform Admins (平台搞手管理)</p>
                            <div class="flex gap-2 mb-3">
                                <input id="new_admin_u" type="text" placeholder="搞手帳號" class="flex-1 bg-white p-3 rounded-xl text-[10px] font-bold outline-none border border-slate-200">
                                <input id="new_admin_p" type="text" placeholder="密碼" class="flex-1 bg-white p-3 rounded-xl text-[10px] font-bold outline-none border border-slate-200">
                                <button onclick="vflow.addAdminAccount()" class="bg-slate-900 text-white px-3 rounded-xl text-[9px] font-black uppercase">開通</button>
                            </div>
                            <div id="admin-list-container" class="space-y-2 mt-4 border-t border-slate-200 pt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-content" class="relative z-10">
            <div class="flex justify-center py-20"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div></div>
        </div>

        <div id="pay_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 text-center z-50">
            <div class="bg-white w-full max-w-xs p-8 rounded-[40px] shadow-2xl animate-fade-in">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-xl font-black text-slate-800 uppercase italic" id="pay-modal-title">報名成功</h3>
                <p class="text-[10px] text-slate-400 font-bold mb-6 uppercase tracking-widest" id="pay-modal-subtitle">Payment Required</p>
                <div id="pay-action-area" class="mb-6 flex flex-col items-center w-full"></div>
                <button onclick="location.reload()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-widest">關閉</button>
            </div>
        </div>

        <div id="story_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 text-center z-50">
            <div class="bg-white w-full max-w-sm p-6 rounded-[40px] shadow-2xl animate-fade-in">
                <h3 class="text-lg font-black italic mb-4 uppercase text-slate-800 tracking-tighter">IG Story Ready</h3>
                <div class="bg-slate-100 rounded-2xl overflow-hidden mb-4 flex justify-center items-center h-[60vh]">
                    <img id="story_preview" src="" class="h-full object-contain shadow-md" alt="Story Preview">
                </div>
                <a id="story_download_btn" href="#" download="story.png" class="block w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs mb-2">一鍵下載直上 IG</a>
                <button onclick="document.getElementById('story_modal').classList.add('hidden')" class="w-full text-slate-400 font-black py-2 text-[10px] uppercase">取消</button>
            </div>
        </div>

        <div id="login_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-50">
            <div class="card w-full max-w-xs p-8 text-center animate-fade-in">
                <h3 class="font-black italic mb-6 uppercase tracking-tighter">Organizer Login</h3>
                <input id="login_u" type="text" placeholder="Username" class="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none font-bold border border-slate-100">
                <input id="login_p" type="password" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-2xl mb-6 outline-none font-bold border border-slate-100">
                <button onclick="vflow.login()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase">Login</button>
                <button onclick="vflow.closeLogin()" class="mt-4 text-slate-400 text-[10px] font-bold uppercase">Cancel</button>
            </div>
        </div>

        <footer class="mt-20 py-10 text-center opacity-20 relative z-10">
            <div class="inline-block py-4 px-10" onclick="vflow.clickSecret()">
                <p class="text-[9px] font-black uppercase tracking-[0.3em]">© 2026 VolleyballFlow</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // 新增 increment 用作扣除信用分
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0",
            authDomain: "volleyballflow-7cf02.firebaseapp.com",
            projectId: "volleyballflow-7cf02",
            storageBucket: "volleyballflow-7cf02.firebasestorage.app",
            messagingSenderId: "1032620495700",
            appId: "1:1032620495700:web:c2d84f02e435d99e15eec1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };

        let user = JSON.parse(sessionStorage.getItem('vf_user'));
        let currentView = 'list';
        let myPaymentData = { mode: 'link', payUrl: '', payImg: '' };
        let selectedPositions = [];
        let secretClicks = 0;

        window.vflow = {
            // --- 系統基礎 ---
            clickSecret: () => { secretClicks++; if(secretClicks === 4){ document.getElementById('login_modal').classList.remove('hidden'); secretClicks=0; } setTimeout(()=>secretClicks=0, 3000); },
            closeLogin: () => document.getElementById('login_modal').classList.add('hidden'),
            
            login: async () => { 
                const u = document.getElementById('login_u').value.trim(); const p = document.getElementById('login_p').value.trim();
                if(u === "Manusyip" && p === "Manusyip0830") { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'super'})); location.reload(); return; }
                const snap = await getDocs(query(collection(db, "admins"), where("username", "==", u), where("password", "==", p)));
                if(!snap.empty) { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'normal'})); location.reload(); } else { alert("帳號或密碼錯誤"); }
            },
            
            // --- 專屬收款 ---
            setPayMode: (mode) => {
                myPaymentData.mode = mode; const isLink = mode === 'link';
                document.getElementById('mode-link').className = `flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${isLink ? 'bg-blue-600 text-white' : 'bg-white text-blue-600'}`;
                document.getElementById('mode-image').className = `flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${!isLink ? 'bg-blue-600 text-white' : 'bg-white text-blue-600'}`;
                document.getElementById('pay-url-box').classList.toggle('hidden', !isLink); document.getElementById('pay-image-box').classList.toggle('hidden', isLink);
            },
            updatePayUrl: async () => { 
                if(!user) return; 
                await setDoc(doc(db, "admins", user.name), { payMode: 'link', payUrl: document.getElementById('pay_url_input').value }, { merge: true }); 
                alert("個人專屬收款連結已更新！"); 
            },
            uploadPayImg: function() {
                if(!user) return;
                const file = document.getElementById('pay_img_input').files[0]; if(!file) return alert("請選擇圖片");
                const reader = new FileReader(); 
                reader.onloadend = async () => { 
                    await setDoc(doc(db, "admins", user.name), { payMode: 'image', payImg: reader.result }, { merge: true }); 
                    alert("個人專屬 QR Code 已上傳！"); 
                }; 
                reader.readAsDataURL(file);
            },

            // --- 場次管理 ---
            createGame: async () => {
                const loc = document.getElementById('new_loc').value.trim();
                const dateVal = document.getElementById('new_date').value;
                const timeStr = document.getElementById('new_time').value.trim();
                if(!loc || !dateVal || !timeStr) return alert("請填寫完整");
                const weekDay = ["日", "一", "二", "三", "四", "五", "六"][new Date(dateVal).getDay()];
                const finalLoc = loc.includes("體育館") ? loc : `${loc}體育館`;
                await addDoc(collection(db, "games"), { 
                    location: finalLoc, time: `${dateVal} (${weekDay}) ${timeStr}`, 
                    maxPlayers: parseInt(document.getElementById('new_max').value), 
                    price: parseInt(document.getElementById('new_price').value), 
                    cost: parseInt(document.getElementById('new_cost').value || 0), 
                    createdBy: user.name, 
                    timestamp: serverTimestamp() 
                });
                location.reload();
            },
            cloneGame: async (id) => {
                const docSnap = await getDoc(doc(db, "games", id));
                if (docSnap.exists()) {
                    const g = docSnap.data();
                    document.getElementById('new_loc').value = g.location.replace('體育館', '');
                    document.getElementById('new_max').value = g.maxPlayers;
                    document.getElementById('new_price').value = g.price;
                    document.getElementById('new_cost').value = g.cost || 0;
                    document.getElementById('create-title').innerText = "Clone Game (請選擇新日期)";
                    document.getElementById('create-title').classList.add("text-blue-600");
                    document.getElementById('admin-panel').classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            },
            delGame: async (id) => { if(confirm("永久刪除此場次？")) await deleteDoc(doc(db, "games", id)); },

            setPos: (p) => {
                const idx = selectedPositions.indexOf(p);
                if(idx > -1) selectedPositions.splice(idx, 1); else { if(selectedPositions.length >= 2) return alert("最多選 2 個位置"); selectedPositions.push(p); }
                const btns = document.querySelectorAll('.pos-btn');
                btns.forEach(btn => { if(selectedPositions.includes(btn.getAttribute('data-pos'))) { btn.classList.add('pos-selected'); btn.style.backgroundColor = "#2563eb"; btn.style.color = "#ffffff"; } else { btn.classList.remove('pos-selected'); btn.style.backgroundColor = "#f8fafc"; btn.style.color = "#94a3b8"; } });
            },

            // --- 報名與黑名單查詢 ---
            join: async (gid, pr, loc, time, maxLimit, createdBy) => {
                const ig = document.getElementById('ig').value.trim();
                if(!ig.startsWith('@')) return alert("IG 必須以 @ 開頭");
                if(selectedPositions.length === 0) return alert("請至少選擇一個位置");
                localStorage.setItem('vf_player_profile', JSON.stringify({ ig: ig, positions: selectedPositions }));
                const posStr = selectedPositions.join(' & ');
                if(!confirm(`確認報名 ${loc}？`)) return;

                try {
                    // 【新功能】報名前檢查是否黑名單 (飛機王)
                    const igLower = ig.toLowerCase();
                    const blDoc = await getDoc(doc(db, "blacklists", igLower));
                    const noShowCount = blDoc.exists() ? blDoc.data().count : 0;

                    const pSnap = await getDocs(collection(db, `games/${gid}/players`));
                    const isWaitlist = pSnap.size >= maxLimit;
                    const joinStatus = isWaitlist ? "waitlist" : "pending";

                    // 寫入球員資料，包含 noShowCount
                    await addDoc(collection(db, `games/${gid}/players`), { 
                        ig, pos: posStr, status: joinStatus, noShowCount: noShowCount, timestamp: serverTimestamp() 
                    });
                    
                    fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TG_CONFIG.chatId, text: `🔔 *New Booking (${createdBy})!*\n📍 ${loc}\n⏰ ${time}\n👤 ${ig}\n🏐 ${posStr}\n📊 狀態: ${isWaitlist ? '⚠️ Waitlist' : '✅ Pending'}`, parse_mode: 'Markdown' }) });
                    
                    const modal = document.getElementById('pay_modal');
                    const area = document.getElementById('pay-action-area');
                    
                    if(isWaitlist) {
                        document.getElementById('pay-modal-title').innerText = "報名進入後補";
                        document.getElementById('pay-modal-title').classList.replace("text-slate-800", "text-purple-600");
                        document.getElementById('pay-modal-subtitle').innerText = "Waitlist Secured";
                        area.innerHTML = `<p class="text-xs font-bold text-slate-500 py-4 leading-relaxed">名額已滿，您已自動進入後補名單。<br>如有球員退出，搞手會主動聯絡您付款。</p>`;
                    } else {
                        // 獲取該場次搞手的收款資料
                        const adminDoc = await getDoc(doc(db, "admins", createdBy));
                        const orgData = adminDoc.exists() ? adminDoc.data() : null;

                        document.getElementById('pay-modal-title').innerText = "報名成功";
                        document.getElementById('pay-modal-title').classList.replace("text-purple-600", "text-slate-800");
                        document.getElementById('pay-modal-subtitle').innerText = "Payment Required";
                        
                        if(orgData && orgData.payMode === 'link' && orgData.payUrl) {
                            area.innerHTML = `<button onclick="vflow.forceRedirect('${orgData.payUrl}')" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl mb-4 text-sm tracking-widest uppercase">跳轉至付款平台</button>`;
                        } else if(orgData && orgData.payImg) {
                            area.innerHTML = `<img src="${orgData.payImg}" class="w-56 rounded-3xl mb-4 shadow-2xl border-4 border-slate-50"><p class="text-[10px] font-bold text-blue-600">請截圖或長按保存 QR Code 付款</p>`;
                        } else {
                            area.innerHTML = `<p class="text-xs font-bold text-slate-400 py-4">搞手尚未設定自動收款，請等候 IG 聯絡</p>`;
                        }
                    }
                    modal.classList.remove('hidden');
                } catch(e) { alert("報名失敗，請重試"); console.log(e); }
            },
            forceRedirect: (url) => { window.open(url, '_blank'); },

            // --- 渲染場次列表 ---
            renderList: (games) => {
                const container = document.getElementById('main-content');
                if(games.length === 0) { container.innerHTML = `<p class="text-center py-20 text-slate-300 font-black italic uppercase">No Games Found</p>`; return; }
                container.innerHTML = games.map(g => `
                    <div onclick="vflow.goToGame('${g.id}')" class="bg-white p-6 rounded-[35px] shadow-sm mb-4 border border-slate-100 active:scale-95 transition-all cursor-pointer relative overflow-hidden">
                        <div class="flex justify-between items-start mb-1">
                            <p class="text-[10px] font-black text-blue-600 uppercase">${g.time}</p>
                            <span class="text-[8px] font-black bg-slate-100 text-slate-400 px-2 py-0.5 rounded-sm">Org: ${g.createdBy}</span>
                        </div>
                        <h3 class="text-xl font-black text-slate-800">${g.location}</h3>
                        ${(user?.role==='super'||user?.name===g.createdBy) ? `
                            <div class="absolute bottom-6 right-6 flex gap-3">
                                <button onclick="event.stopPropagation();vflow.generateStory('${g.location}', '${g.time}', ${g.maxPlayers}, ${g.price}, '${g.createdBy}')" class="text-indigo-600 hover:text-indigo-800 text-[10px] bg-indigo-50 px-3 py-1 rounded font-black uppercase transition-colors shadow-sm">IG Story</button>
                                <button onclick="event.stopPropagation();vflow.cloneGame('${g.id}')" class="text-blue-400 hover:text-blue-600 text-[10px] bg-blue-50 px-3 py-1 rounded font-black uppercase transition-colors">Clone</button>
                                <button onclick="event.stopPropagation();vflow.delGame('${g.id}')" class="text-red-400 hover:text-red-600 text-[10px] bg-red-50 px-3 py-1 rounded font-black uppercase transition-colors">Del</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            },

            // --- 【新功能】畫布生成 IG Story ---
            generateStory: (loc, time, max, price, orgName) => {
                const canvas = document.createElement('canvas');
                canvas.width = 1080; canvas.height = 1920;
                const ctx = canvas.getContext('2d');

                // 背景漸變
                const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
                grad.addColorStop(0, '#1e3a8a'); // 藍
                grad.addColorStop(1, '#312e81'); // 深紫
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1080, 1920);

                ctx.textAlign = 'center';

                // 裝飾線條
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 10;
                ctx.strokeRect(50, 50, 980, 1820);

                // 標題
                ctx.fillStyle = '#ffffff';
                ctx.font = 'italic 900 100px sans-serif';
                ctx.fillText('VOLLEYBALLFLOW', 540, 300);

                // 搞手名
                ctx.fillStyle = '#818cf8';
                ctx.font = 'italic 700 45px sans-serif';
                ctx.fillText(`Organizer: ${orgName}`, 540, 380);

                // 資訊方塊
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.roundRect = function(x, y, w, h, r) { if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2; this.beginPath(); this.moveTo(x+r, y); this.arcTo(x+w, y, x+w, y+h, r); this.arcTo(x+w, y+h, x, y+h, r); this.arcTo(x, y+h, x, y, r); this.arcTo(x, y, x+w, y, r); this.closePath(); return this; }
                ctx.roundRect(100, 550, 880, 650, 50).fill();

                // 內容
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 85px sans-serif';
                ctx.fillText(loc, 540, 750);

                ctx.font = '600 60px sans-serif';
                ctx.fillText(time, 540, 900);

                ctx.fillStyle = '#fde047';
                ctx.font = '900 65px sans-serif';
                ctx.fillText(`名額: ${max}人   |   收費: $${price}`, 540, 1050);

                // 底部 Call to Action
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 70px sans-serif';
                ctx.fillText('👉 LINK IN BIO 報名 👈', 540, 1600);

                const imgUrl = canvas.toDataURL("image/png");
                document.getElementById('story_preview').src = imgUrl;
                document.getElementById('story_download_btn').href = imgUrl;
                document.getElementById('story_download_btn').download = `Story_${loc}.png`;
                document.getElementById('story_modal').classList.remove('hidden');
            },

            // --- 財務報表與場次詳情 ---
            goToGame: (id) => {
                currentView = 'detail'; selectedPositions = [];
                onSnapshot(doc(db, "games", id), (d) => {
                    if(!d.exists()) return;
                    const g = d.data(); const isMgr = user?.role === 'super' || user?.name === g.createdBy;
                    const cost = g.cost || 0;

                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-6 text-blue-600 font-black text-xs uppercase tracking-widest">← Back to List</button>
                        <div class="bg-slate-900 text-white p-10 rounded-[45px] mb-8 relative shadow-2xl animate-fade-in">
                            <h2 class="text-2xl font-black italic mb-2">${g.location}</h2>
                            <p class="text-xs font-bold opacity-40 font-mono tracking-tighter">${g.time}</p>
                            ${isMgr ? `<button onclick="vflow.copyWA('${id}','${g.location}','${g.time}', ${g.maxPlayers})" class="absolute right-6 bottom-6 bg-blue-600 text-[10px] px-5 py-2 rounded-full font-black shadow-lg uppercase">Copy WA</button>` : ''}
                        </div>
                        
                        ${isMgr ? `
                            <div class="bg-gradient-to-br from-blue-50 to-indigo-50 p-6 rounded-[35px] mb-8 border border-blue-100 animate-fade-in shadow-inner">
                                <p class="text-[9px] font-black text-indigo-400 mb-4 uppercase tracking-[0.2em] text-center">Financial Dashboard</p>
                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-50">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">場租成本</p>
                                        <p class="text-sm font-black text-red-500">-$${cost}</p>
                                    </div>
                                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-indigo-50">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">已收金額</p>
                                        <p class="text-sm font-black text-green-500" id="stat-paid">$0</p>
                                    </div>
                                </div>
                                <div class="bg-indigo-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-lg">
                                    <div>
                                        <p class="text-[9px] font-bold text-indigo-200 uppercase mb-1">預計淨利潤</p>
                                        <p class="text-xl font-black" id="stat-profit">$0</p>
                                    </div>
                                    <div class="text-right border-l border-indigo-400 pl-4">
                                        <p class="text-[8px] font-bold text-indigo-200 uppercase mb-1">平台佣金 (10%)</p>
                                        <p class="text-sm font-black text-yellow-300" id="stat-commission">$0</p>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="card p-8 mb-8 animate-fade-in">
                            <div class="flex justify-between items-center mb-6">
                                <span class="font-black italic text-slate-400 text-[10px] uppercase">Booking Info</span>
                                <span id="p-count" class="text-blue-600 font-black text-[10px] bg-blue-50 px-3 py-1 rounded-full uppercase italic">Loading...</span>
                            </div>
                            <input id="ig" type="text" placeholder="@Instagram_ID" class="w-full bg-slate-50 p-4 rounded-2xl mb-4 outline-none font-bold border border-transparent focus:border-blue-200 text-center text-sm">
                            <div class="grid grid-cols-1 gap-2 mb-8">
                                ${['Setter (二傳)', 'Outside Hitter (大搥)', 'Middle Blocker (快攻)', 'Opposite (接應)', 'Libero (自由人)'].map(p => `<button data-pos="${p}" onclick="vflow.setPos('${p}')" class="pos-btn p-4 rounded-2xl border font-black text-[10px] uppercase transition-all bg-slate-50 text-slate-400 border-transparent">${p}</button>`).join('')}
                            </div>
                            <button onclick="vflow.join('${id}', ${g.price}, '${g.location}', '${g.time}', ${g.maxPlayers}, '${g.createdBy}')" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl uppercase tracking-widest active:scale-95 transition-all">Confirm Booking $${g.price}</button>
                        </div>
                        <div id="player-list" class="space-y-3 pb-20"></div>
                    `;
                    
                    const savedProfile = JSON.parse(localStorage.getItem('vf_player_profile'));
                    if(savedProfile && savedProfile.ig) {
                        document.getElementById('ig').value = savedProfile.ig;
                        savedProfile.positions.forEach(p => vflow.setPos(p));
                    }
                    vflow.listenPlayers(id, isMgr, g.maxPlayers, g.price, cost);
                });
            },

            // --- 渲染球員名單與防飛機系統 ---
            listenPlayers: (gid, isMgr, max, price, cost) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const players = []; let paidCount = 0; let mainCount = 0;
                    snap.forEach(d => { 
                        const p = {id: d.id, ...d.data()}; 
                        players.push(p); 
                        if(players.length <= max) mainCount++;
                        if(p.status === 'confirmed' && players.length <= max) paidCount++; 
                    });

                    if(document.getElementById('p-count')) {
                        const isFull = mainCount >= max;
                        document.getElementById('p-count').innerText = `已報名: ${mainCount} / ${max} ${isFull && players.length > max ? '(有後補)' : ''}`;
                        if(isFull) document.getElementById('p-count').classList.replace('text-blue-600', 'text-orange-500');
                    }
                    
                    if(isMgr && document.getElementById('stat-paid')) { 
                        const totalRevenue = mainCount * price;
                        const expectedProfit = totalRevenue - cost;
                        const commission = expectedProfit > 0 ? expectedProfit * 0.1 : 0;
                        document.getElementById('stat-paid').innerText = `$${paidCount * price}`; 
                        document.getElementById('stat-profit').innerText = `$${expectedProfit}`; 
                        document.getElementById('stat-commission').innerText = `$${commission.toFixed(1)}`; 
                    }
                    
                    const listDiv = document.getElementById('player-list');
                    if(isMgr) {
                        listDiv.innerHTML = players.map((p, index) => {
                            const isWaitlist = index >= max;
                            const statusColor = p.status === 'confirmed' ? 'text-green-500' : (isWaitlist ? 'text-purple-500' : 'text-orange-400');
                            const statusText = p.status === 'confirmed' ? '● PAID' : (isWaitlist ? '⏱ WAIT' : '○ PEND');
                            const cardClass = isWaitlist ? 'waitlist-card' : 'shadow-sm';
                            const numLabel = isWaitlist ? `W${index - max + 1}` : index + 1;
                            
                            // 【新功能】飛機王警告標籤
                            const noShowWarning = (p.noShowCount && p.noShowCount > 0) ? `<span class="ml-2 bg-red-500 text-white px-2 py-0.5 rounded text-[8px] font-black uppercase">⚠️ 飛機底 (${p.noShowCount}次)</span>` : '';

                            return `
                            <div class="bg-white p-5 rounded-3xl border border-slate-100 flex flex-col gap-3 animate-fade-in ${cardClass}">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="font-black text-slate-800 text-sm flex items-center">${numLabel}. ${p.ig} ${noShowWarning}</p>
                                        <p class="text-[8px] font-black ${statusColor} uppercase tracking-tighter mt-1">${statusText} - ${p.pos}</p>
                                    </div>
                                    <div class="flex gap-1">
                                        <button onclick="vflow.confirmP('${gid}','${p.id}')" class="bg-green-500 text-white px-3 py-2 rounded-xl text-[9px] font-black uppercase shadow-sm">核實</button>
                                        <button onclick="vflow.delP('${gid}','${p.id}')" class="bg-red-50 text-red-400 px-3 py-2 rounded-xl text-[9px] font-black uppercase">踢走</button>
                                    </div>
                                </div>
                                <button onclick="vflow.markNoShow('${gid}','${p.id}','${p.ig}')" class="w-full bg-slate-900 text-white py-1.5 rounded-lg text-[8px] font-black uppercase tracking-widest mt-1 opacity-50 hover:opacity-100 transition-opacity">🚫 標記此人放飛機 (扣除信用分)</button>
                            </div>`;
                        }).join('');
                    } else { 
                        listDiv.innerHTML = `<p class="py-10 text-center text-slate-300 text-[10px] font-black uppercase italic tracking-[0.5em]">List Secured</p>`; 
                    }
                });
            },
            
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid) => await deleteDoc(doc(db, `games/${gid}/players`, pid)),
            
            // --- 【新功能】標記飛機王邏輯 ---
            markNoShow: async (gid, pid, ig) => {
                if(!confirm(`確認將 ${ig} 標記為放飛機？\n\n系統將會記錄其不良信用，並將其從本場次剔除。所有平台搞手日後都會見到警告！`)) return;
                const igLower = ig.toLowerCase();
                try {
                    // 1. 在黑名單庫增加次數
                    await setDoc(doc(db, "blacklists", igLower), { count: increment(1), lastOffense: serverTimestamp() }, { merge: true });
                    // 2. 將球員從場次踢走
                    await deleteDoc(doc(db, `games/${gid}/players`, pid));
                    alert(`已成功將 ${ig} 標記為飛機王並踢出！`);
                } catch(e) { alert("標記失敗"); console.log(e); }
            },
            
            // --- 超級管理員 ---
            addAdminAccount: async () => { 
                const u = document.getElementById('new_admin_u').value.trim(); const p = document.getElementById('new_admin_p').value.trim();
                if(!u || !p) return alert("不能留空");
                await setDoc(doc(db, "admins", u), { username: u, password: p, role: 'organizer' }); 
                document.getElementById('new_admin_u').value = ''; document.getElementById('new_admin_p').value = ''; vflow.loadAdminList();
            },
            loadAdminList: async () => { 
                const snap = await getDocs(collection(db, "admins")); let html = "";
                snap.forEach(d => { const data = d.data(); html += `<div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200"><div><span class="text-[12px] font-black">${data.username}</span> <span class="text-[9px] text-slate-400">(${data.password})</span></div><div class="flex gap-2"><button onclick="vflow.delAdmin('${d.id}')" class="bg-red-50 text-red-500 px-3 py-1 rounded-lg text-[9px] font-black uppercase">刪除</button></div></div>`; });
                document.getElementById('admin-list-container').innerHTML = html || "<p class='text-[10px] text-center text-slate-400'>暫無搞手</p>";
            },
            delAdmin: async (id) => { if(confirm("確定刪除此搞手？")) { await deleteDoc(doc(db, "admins", id)); vflow.loadAdminList(); } },
            
            copyWA: async (gid, loc, time, max) => {
                const snap = await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")));
                let txt = `🏐 *VolleyballFlow 名單*\n📍 ${loc}\n⏰ ${time}\n\n`;
                let i = 0; 
                snap.forEach(d => { 
                    const p = d.data(); 
                    if(i === max) txt += `\n--- ⏳ 後補名單 ---\n`;
                    const numLabel = i >= max ? `W${i - max + 1}` : i + 1;
                    const mark = p.status === 'confirmed' ? '✅' : (i >= max ? '⏱' : '⏳');
                    txt += `${numLabel}. ${p.ig} (${p.pos}) ${mark}\n`; 
                    i++; 
                });
                navigator.clipboard.writeText(txt); alert("WhatsApp 名單已複製到剪貼簿！");
            }
        };

        if (user) {
            document.getElementById('admin-status').innerHTML = `
                <div class="flex justify-center items-center gap-3">
                    <span class="text-[10px] font-black bg-indigo-100 text-indigo-700 px-4 py-1.5 rounded-full uppercase italic">Org: ${user.name}</span>
                    <button onclick="sessionStorage.removeItem('vf_user');location.reload();" class="text-[10px] font-black text-red-400 uppercase tracking-widest underline">Logout</button>
                </div>`;
            document.getElementById('admin-panel').classList.remove('hidden');
            
            getDoc(doc(db, "admins", user.name)).then(d => {
                if(d.exists()) {
                    const data = d.data();
                    if(document.getElementById('pay_url_input')) document.getElementById('pay_url_input').value = data.payUrl || '';
                    vflow.setPayMode(data.payMode || 'link');
                }
            });

            if(user.role === 'super') { document.getElementById('super-admin-tools').classList.remove('hidden'); vflow.loadAdminList(); }
        }

        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
            const games = []; snap.forEach(d => games.push({id: d.id, ...d.data()}));
            if(currentView === 'list') vflow.renderList(games);
        });
    </script>
</body>
</html>
