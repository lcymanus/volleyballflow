<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VolleyballFlow 2026 Pro | 全功能版</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { background: #f4f7f6; color: #0f172a; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 3000; }
        .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #ffffff; color: #0f172a; border-top-left-radius: 32px; border-top-right-radius: 32px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); z-index: 1000; padding: 32px; max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .pos-btn { transition: all 0.2s; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; cursor: pointer; }
        .pos-selected { background: #4f46e5 !important; color: #ffffff !important; border-color: #4f46e5 !important; font-weight: 900; }
        .input-light { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 16px; font-size: 14px; outline: none; color: #0f172a; transition: all 0.2s; }
        .input-light:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .desc-text { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="p-5 pb-24">

    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-10 text-center pt-4">
            <h1 onclick="vflow.clickSecret()" class="text-4xl font-black italic tracking-tighter text-slate-900 cursor-pointer select-none">VOLLEYFLOW<span class="text-indigo-600">.</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em] mt-3">Professional Ecosystem</p>
            <div id="admin-status" class="mt-6"></div>
        </header>

        <div id="admin-panel" class="hidden space-y-6 mb-12">
            <div class="glass-card p-8 bg-gradient-to-br from-white to-slate-50 border-2 border-indigo-100">
                <h3 class="text-sm font-black uppercase text-slate-800 tracking-tighter mb-6">快速發布新場次 Quick Create 🏐</h3>
                <div class="space-y-4">
                    <input id="new_loc" type="text" placeholder="體育館名稱" class="input-light">
                    
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2 text-xs">1. 選擇日期 Date</label>
                        <input id="new_date" type="date" class="input-light text-slate-600">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">2. 開始 (刮輪)</label>
                            <input id="start_time" type="time" value="19:00" class="input-light text-slate-600">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">3. 完場 (刮輪)</label>
                            <input id="end_time" type="time" value="21:00" class="input-light text-slate-600">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">4. 場地描述 / 詳情 Description</label>
                        <textarea id="new_desc" placeholder="例如：1號場，中級友誼賽，請自備淺色波衫..." class="input-light h-24"></textarea>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-3 rounded-2xl border border-slate-200"><label class="text-[9px] font-bold text-slate-400 uppercase block">名額</label><input id="new_max" type="number" value="15" class="bg-transparent text-slate-800 w-full outline-none font-black text-lg"></div>
                        <div class="bg-white p-3 rounded-2xl border border-slate-200"><label class="text-[9px] font-bold text-slate-400 uppercase block">收費</label><input id="new_price" type="number" value="30" class="bg-transparent text-slate-800 w-full outline-none font-black text-lg"></div>
                        <div class="bg-red-50 p-3 rounded-2xl border border-red-100"><label class="text-[9px] font-bold text-red-500 uppercase block">場租</label><input id="new_cost" type="number" value="120" class="bg-transparent text-red-600 w-full outline-none font-black text-lg"></div>
                    </div>
                    
                    <button onclick="vflow.createGame()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">確認發布</button>
                </div>
            </div>
        </div>

        <div id="main-content" class="space-y-5"></div>
        
        <div id="login_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[3000]">
            <div class="glass-card w-full max-w-xs p-8 text-center bg-white">
                <h3 class="font-black italic text-slate-800 mb-6 uppercase text-xl">Login</h3>
                <input id="login_u" type="text" placeholder="Username" class="input-light mb-3">
                <input id="login_p" type="password" placeholder="Password" class="input-light mb-6">
                <div class="flex gap-3">
                    <button onclick="vflow.closeLogin()" class="flex-1 bg-slate-100 font-black py-3 rounded-xl text-xs">Cancel</button>
                    <button onclick="vflow.login()" class="flex-1 bg-indigo-600 text-white font-black py-3 rounded-xl text-xs">Login</button>
                </div>
            </div>
        </div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay" onclick="vflow.closeSheet()"></div>
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <div id="sheet-content"></div>
        <div class="mt-4 pt-4 border-t border-slate-100">
            <label class="text-[11px] font-black text-slate-800 uppercase block mb-3 text-center">📸 上傳收據 Confirm Payment</label>
            <input type="file" id="receipt_input" accept="image/*" class="w-full text-xs" onchange="vflow.previewReceipt(this)">
            <button id="btn-submit-reg" onclick="vflow.executeJoin()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl mt-4 opacity-50" disabled>確認報名</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0", authDomain: "volleyballflow-7cf02.firebaseapp.com", projectId: "volleyballflow-7cf02", storageBucket: "volleyballflow-7cf02.firebasestorage.app", messagingSenderId: "1032620495700", appId: "1:1032620495700:web:c2d84f02e435d99e15eec1" };
        const app = initializeApp(firebaseConfig); 
        const db = initializeFirestore(app, {});
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };

        let user = JSON.parse(sessionStorage.getItem('vf_user')); 
        let currentView = 'list'; let selectedPositions = []; let secretClicks = 0; let tempJoinData = null;

        window.vflow = {
            clickSecret: () => { secretClicks++; if(secretClicks===4){ document.getElementById('login_modal').classList.remove('hidden'); secretClicks=0; } setTimeout(()=>secretClicks=0, 3000); },
            closeLogin: () => document.getElementById('login_modal').classList.add('hidden'),
            login: async () => {
                const u = document.getElementById('login_u').value.trim(); const p = document.getElementById('login_p').value.trim();
                if(u==="Manusyip" && p==="Manusyip0830") { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'super'})); location.reload(); return; }
                const snap = await getDocs(query(collection(db, "admins"), where("username", "==", u), where("password", "==", p)));
                if(!snap.empty) { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'normal'})); location.reload(); } else alert("Login Failed");
            },

            sendTG: async (msg) => { try { await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage?chat_id=${TG_CONFIG.chatId}&text=${encodeURIComponent(msg)}`); } catch(e){} },

            createGame: async () => {
                const loc = document.getElementById('new_loc').value.trim();
                const dateVal = document.getElementById('new_date').value;
                const sT = document.getElementById('start_time').value;
                const eT = document.getElementById('end_time').value;
                const desc = document.getElementById('new_desc').value.trim();

                if(!loc || !dateVal) return alert("請填寫地點同日期");

                const weekDay = ["日","一","二","三","四","五","六"][new Date(dateVal).getDay()];
                const fullTime = `${dateVal} (${weekDay}) ${sT} - ${eT}`;
                const isSuper = user?.role === 'super';

                await addDoc(collection(db, "games"), {
                    location: loc.includes("體育館") ? loc : `${loc}體育館`,
                    time: fullTime,
                    description: desc,
                    maxPlayers: parseInt(document.getElementById('new_max').value),
                    price: parseInt(document.getElementById('new_price').value),
                    cost: parseInt(document.getElementById('new_cost').value),
                    createdBy: user.name,
                    approved: isSuper,
                    timestamp: serverTimestamp()
                });

                if(isSuper) vflow.sendTG(`🆕 新場次！\n📍 ${loc}\n⏰ ${fullTime}\n📝 ${desc}`);
                alert("已發佈！"); location.reload();
            },

            renderList: (games) => {
                const container = document.getElementById('main-content');
                container.innerHTML = games.map(g => {
                    if(!g.approved && user?.role !== 'super' && user?.name !== g.createdBy) return '';
                    return `
                    <div onclick="vflow.goToGame('${g.id}')" class="glass-card p-6 relative ${!g.approved ? 'bg-amber-50 border-amber-200' : ''}">
                        <p class="text-[10px] font-black text-indigo-600 uppercase mb-2">${g.time}</p>
                        <h3 class="text-xl font-black italic">${g.location} ${!g.approved ? '⚠️' : ''}</h3>
                        ${g.description ? `<p class="text-xs text-slate-400 mt-2 line-clamp-1">${g.description}</p>` : ''}
                        ${(user?.role==='super' || user?.name===g.createdBy) ? `
                        <div class="mt-4 flex gap-2 border-t pt-4">
                            <button onclick="event.stopPropagation();vflow.delGame('${g.id}')" class="bg-red-50 text-red-500 text-[10px] px-3 py-2 rounded-lg font-black uppercase">Delete</button>
                        </div>` : ''}
                    </div>`;
                }).join('');
            },

            goToGame: (id) => {
                currentView = 'detail';
                onSnapshot(doc(db, "games", id), (d) => {
                    if(!d.exists()) return; const g = d.data();
                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-4 text-indigo-600 font-black text-xs uppercase underline">← Back to List</button>
                        <div class="glass-card p-8 bg-indigo-600 text-white mb-6">
                            <h2 class="text-2xl font-black italic mb-1">${g.location}</h2>
                            <p class="text-xs opacity-80 font-bold mb-4">${g.time}</p>
                            ${g.description ? `<div class="bg-white/10 p-4 rounded-xl text-sm desc-text border border-white/20">${g.description}</div>` : ''}
                        </div>
                        <div class="glass-card p-8 mb-6">
                            <input id="ig" type="text" placeholder="@Instagram" class="input-light mb-4 text-center font-black">
                            <div class="grid grid-cols-1 gap-2 mb-6">${['Setter','Outside','Middle','Opposite','Libero'].map(p=>`<button onclick="vflow.setPos('${p}')" data-pos="${p}" class="pos-btn py-3 rounded-xl text-[10px] font-black">${p}</button>`).join('')}</div>
                            <button onclick="vflow.prepJoin('${id}',${g.price},'${g.location}')" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl">報名 $${g.price}</button>
                        </div>
                        <div id="player-list" class="space-y-3 pb-10"></div>
                    `;
                    vflow.listenPlayers(id, (user?.name===g.createdBy || user?.role==='super'), g.maxPlayers);
                });
            },

            listenPlayers: (gid, isMgr, max) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const list = document.getElementById('player-list');
                    if(!isMgr) { list.innerHTML = `<p class="text-center text-slate-400 text-xs uppercase font-black py-10 tracking-widest">Player list is hidden 🔒</p>`; return; }
                    let h = ""; let i = 1;
                    snap.forEach(d => {
                        const p = d.data();
                        h += `<div class="glass-card p-4 flex justify-between items-center ${i > max ? 'bg-amber-50' : ''}">
                                <div><p class="font-black text-sm">${i}. ${p.ig}</p><p class="text-[9px] font-bold text-slate-400 uppercase">${p.pos} | ${p.status}</p></div>
                                <div class="flex gap-1">
                                    <button onclick="vflow.confirmP('${gid}','${d.id}')" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg text-[9px] font-black">CONFIRM</button>
                                    <button onclick="vflow.delP('${gid}','${d.id}')" class="bg-red-50 text-red-500 p-2 rounded-lg text-[9px] font-black">KICK</button>
                                </div>
                              </div>`;
                        i++;
                    });
                    list.innerHTML = h || `<p class="text-center text-slate-300 text-xs py-10">No players yet</p>`;
                });
            },

            setPos: (p) => { 
                const idx = selectedPositions.indexOf(p);
                if(idx>-1) selectedPositions.splice(idx,1); else selectedPositions.push(p);
                document.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('pos-selected', selectedPositions.includes(b.dataset.pos)));
            },
            delGame: async (id) => { if(confirm("確定刪除此場次？")) await deleteDoc(doc(db, "games", id)); },
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid) => { if(confirm("踢人？")) await deleteDoc(doc(db, `games/${gid}/players`, pid)); },
            closeSheet: () => { document.getElementById('bottom-sheet').classList.remove('open'); document.getElementById('sheet-overlay').classList.remove('open'); },
            openSheet: () => { document.getElementById('bottom-sheet').classList.add('open'); document.getElementById('sheet-overlay').classList.add('open'); },
            prepJoin: (gid, pr, loc) => { 
                const ig = document.getElementById('ig').value.trim(); if(!ig.startsWith('@')) return alert("請輸入正確的 @IG 賬號");
                if(selectedPositions.length === 0) return alert("請選擇位置");
                tempJoinData = { gid, pr, loc, ig, pos: selectedPositions.join('&') };
                document.getElementById('sheet-content').innerHTML = `<h3 class="text-xl font-black text-center">${loc}</h3><p class="text-center font-bold text-indigo-600 mb-4">$${pr}</p>`;
                vflow.openSheet();
            },
            previewReceipt: (i) => { if(i.files[0]) { document.getElementById('btn-submit-reg').disabled = false; document.getElementById('btn-submit-reg').classList.remove('opacity-50'); } },
            executeJoin: async () => {
                const btn = document.getElementById('btn-submit-reg'); btn.innerText = "Processing..."; btn.disabled = true;
                await addDoc(collection(db, `games/${tempJoinData.gid}/players`), { ...tempJoinData, status: 'pending', timestamp: serverTimestamp() });
                vflow.sendTG(`📩 收到報名！\nIG: ${tempJoinData.ig}\n場地: ${tempJoinData.loc}`);
                alert("報名成功，請等待管理員核實！"); location.reload();
            }
        };

        // 初始化
        document.getElementById('new_date').valueAsDate = new Date();
        if (user) {
            document.getElementById('admin-status').innerHTML = `<span class="bg-indigo-50 text-indigo-700 text-[10px] font-black px-4 py-2 rounded-full uppercase">Admin: ${user.name}</span>`;
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => { 
            const gs = []; snap.forEach(d => gs.push({id:d.id, ...d.data()})); 
            if(currentView==='list') vflow.renderList(gs); 
        });
    </script>
</body>
</html>
