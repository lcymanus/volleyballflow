<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyFlow | 專業排球系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        .pos-btn-active { background-color: #2563eb !important; color: white !important; border-color: #2563eb !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-5 pb-20 text-slate-900 select-none">
    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter text-slate-900 leading-none">VOLLEYFLOW</h1>
            <div id="admin-info-bar"></div>
        </header>

        <div id="admin-panel" class="hidden animate-fade-in"></div>

        <div id="main-content">
            <div class="flex justify-center py-20"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div></div>
        </div>

        <div id="login_modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-xs p-8 rounded-[40px] shadow-2xl">
                <h3 class="font-black italic mb-6 text-center text-slate-800">ADMIN LOGIN</h3>
                <input id="login_u" type="text" placeholder="用戶名稱" class="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none border border-slate-100 font-bold">
                <input id="login_p" type="password" placeholder="密碼" class="w-full bg-slate-50 p-4 rounded-2xl mb-6 outline-none border border-slate-100 font-bold">
                <button id="btn-login-exec" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all">登入系統</button>
                <button onclick="document.getElementById('login_modal').classList.add('hidden')" class="w-full text-slate-400 text-[10px] mt-4 font-bold italic uppercase tracking-widest">Cancel</button>
            </div>
        </div>

        <footer class="mt-20 py-10 text-center opacity-20">
            <div class="inline-block py-4 px-10 cursor-default" onclick="window.vflow.triggerSecret()">
                <p class="text-[9px] font-black uppercase tracking-[0.3em]">© 2026 VolleyFlow Collective</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. 配置
        const firebaseConfig = {
            apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0",
            authDomain: "volleyballflow-7cf02.firebaseapp.com",
            projectId: "volleyballflow-7cf02",
            storageBucket: "volleyballflow-7cf02.firebasestorage.app",
            messagingSenderId: "1032620495700",
            appId: "1:1032620495700:web:c2d84f02e435d99e15eec1"
        };
        const SUPER_ADMIN = { user: "Manusyip", pass: "Manusyip0830" };
        const POS_MAP = { 'Setter': 'S', 'Outside Hitter': 'OH', 'Middle Blocker': 'MB', 'Opposite Hitter': 'OP', 'Libero': 'L' };

        // 2. 狀態管理
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let user = JSON.parse(sessionStorage.getItem('vf_user'));
        let selectedPositions = [];
        let payUrl = "";
        let currentUnsub = null;

        // 3. 核心功能封裝 (方便以後更新)
        window.vflow = {
            // 秘密入口
            clickCount: 0,
            triggerSecret: () => {
                window.vflow.clickCount++;
                if (window.vflow.clickCount === 4) {
                    document.getElementById('login_modal').classList.remove('hidden');
                    window.vflow.clickCount = 0;
                }
                setTimeout(() => { window.vflow.clickCount = 0; }, 3000);
            },

            // 登入邏輯
            login: async () => {
                const u = document.getElementById('login_u').value;
                const p = document.getElementById('login_p').value;
                if (u === SUPER_ADMIN.user && p === SUPER_ADMIN.pass) {
                    sessionStorage.setItem('vf_user', JSON.stringify({ name: u, role: 'super' }));
                    location.reload();
                } else {
                    const q = query(collection(db, "admins"), where("username", "==", u), where("password", "==", p));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        sessionStorage.setItem('vf_user', JSON.stringify({ name: u, role: 'normal' }));
                        location.reload();
                    } else { alert("驗證失敗"); }
                }
            },

            // 發佈場次 (智能格式)
            createGame: async () => {
                const loc = document.getElementById('new_loc').value;
                const dateVal = document.getElementById('new_date').value;
                const timeStr = document.getElementById('new_time').value;
                const max = parseInt(document.getElementById('new_max').value);
                const price = parseInt(document.getElementById('new_price').value);

                if (!loc || !dateVal || !timeStr) return alert("資料不足");

                const weekDay = ["日", "一", "二", "三", "四", "五", "六"][new Date(dateVal).getDay()];
                await addDoc(collection(db, "games"), {
                    location: `${loc}體育館`,
                    time: `${dateVal} (${weekDay}) ${timeStr}`,
                    maxPlayers: max,
                    price: price,
                    createdBy: user.name,
                    timestamp: serverTimestamp(),
                    limits: { S: 2, OH: 4, MB: 2, OP: 2, L: 2 },
                    enableLimit: false
                });
                location.reload();
            },

            // 渲染列表
            renderList: (games) => {
                const container = document.getElementById('main-content');
                container.innerHTML = `<h2 class="text-xl font-black italic text-slate-700 mb-6 px-2 uppercase tracking-tight">Active Games</h2>
                <div class="grid gap-4">${games.map(g => `
                    <div class="bg-white p-6 rounded-[30px] shadow-sm border border-slate-100 active:scale-95 transition-all relative">
                        <div onclick="vflow.goToGame('${g.id}')" class="cursor-pointer">
                            <p class="text-[10px] font-black text-blue-600 uppercase mb-1">${g.time}</p>
                            <h3 class="text-xl font-black text-slate-800">${g.location}</h3>
                            <p class="text-[9px] font-bold text-slate-300 mt-1 uppercase tracking-widest">Host: ${g.createdBy}</p>
                        </div>
                        ${(user?.role==='super' || user?.name===g.createdBy) ? `<button onclick="vflow.delGame('${g.id}')" class="absolute top-6 right-6 text-red-200 hover:text-red-400 text-[10px] font-bold">剷場</button>` : ''}
                    </div>`).join('')}</div>`;
            },

            // 進入場次詳情
            goToGame: (id) => {
                if (currentUnsub) currentUnsub();
                currentUnsub = onSnapshot(doc(db, "games", id), (d) => {
                    const game = d.data();
                    const isManager = user?.role === 'super' || user?.name === game.createdBy;
                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-6 text-blue-600 font-black text-xs">← BACK TO LIST</button>
                        <div class="bg-slate-900 text-white p-8 rounded-[40px] mb-6 shadow-xl relative overflow-hidden">
                            <h2 class="text-2xl font-black italic mb-1">${game.location}</h2>
                            <p class="text-sm font-bold opacity-50 font-mono">${game.time}</p>
                            ${isManager ? `<button onclick="vflow.copyWA('${id}', '${game.location}', '${game.time}')" class="absolute right-6 bottom-6 bg-blue-600 text-[10px] px-4 py-2 rounded-full font-black">複製 WA</button>` : ''}
                        </div>
                        ${isManager ? vflow.tplAdmin(id, game) : ''}
                        <div class="bg-white p-8 rounded-[30px] shadow-sm mb-6 border border-slate-100">
                            <div class="flex justify-between items-center mb-6">
                                <span class="font-black italic text-slate-400 text-sm uppercase">Booking</span>
                                <span id="p-count" class="text-blue-600 font-black text-[10px] bg-blue-50 px-3 py-1 rounded-full uppercase">Loading...</span>
                            </div>
                            <input id="ig" type="text" placeholder="@Instagram_ID" class="w-full bg-slate-50 p-4 rounded-2xl mb-4 outline-none font-bold border focus:border-blue-400 transition-all">
                            <div id="pos-grid" class="grid grid-cols-1 gap-2 mb-8"></div>
                            <button onclick="vflow.join('${id}', ${game.price})" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all">確認報名並支付 $${game.price}</button>
                        </div>
                        <div id="player-list" class="space-y-2 pb-10"></div>
                    `;
                    vflow.listenPlayers(id, game, isManager);
                });
            },

            // 管理員專用模板
            tplAdmin: (id, game) => `
                <div class="bg-blue-50 p-6 rounded-[30px] mb-6 border border-blue-100 text-xs animate-fade-in">
                    <div class="flex justify-between mb-4 font-black">
                        <span class="text-green-600">已收: <span id="stat-paid">$0</span></span>
                        <span class="text-blue-600">預計: <span id="stat-total">$0</span></span>
                    </div>
                    <div class="space-y-3 pt-3 border-t border-blue-100">
                        <div class="flex items-center justify-between">
                            <label class="font-black text-blue-800">名額上限</label>
                            <input type="number" value="${game.maxPlayers}" onchange="vflow.updateGame('${id}', 'maxPlayers', this.value)" class="w-16 p-1 rounded border">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="font-black text-blue-800">場次費用</label>
                            <input type="number" value="${game.price}" onchange="vflow.updateGame('${id}', 'price', this.value)" class="w-16 p-1 rounded border">
                        </div>
                    </div>
                </div>`,

            // 這裡包含所有輔助函數 (join, listenPlayers, delGame 等)
            // ... (為縮減篇幅，邏輯完整封裝在 vflow 對象中)
            updateGame: async (id, f, v) => await updateDoc(doc(db, "games", id), { [f]: parseInt(v) }),
            delGame: async (id) => { if(confirm("確定刪除場次？")) await deleteDoc(doc(db, "games", id)) },
            confirmPlayer: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            deletePlayer: async (gid, pid) => await deleteDoc(doc(db, `games/${gid}/players`, pid)),
            
            listenPlayers: (gid, gData, isMgr) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const players = []; let paid = 0;
                    const counts = { 'Setter':0, 'Outside Hitter':0, 'Middle Blocker':0, 'Opposite Hitter':0, 'Libero':0 };
                    snap.forEach(d => {
                        const p = {id:d.id, ...d.data()}; players.push(p);
                        if(p.status==='confirmed') paid++;
                        p.pos.split(' & ').forEach(n => { if(counts[n]!==undefined) counts[n]++; });
                    });
                    if(document.getElementById('p-count')) document.getElementById('p-count').innerText = `已報名：${players.length} / ${gData.maxPlayers}`;
                    if(isMgr && document.getElementById('stat-paid')) {
                        document.getElementById('stat-paid').innerText = `$${paid * gData.price}`;
                        document.getElementById('stat-total').innerText = `$${players.length * gData.price}`;
                    }
                    const grid = document.getElementById('pos-grid');
                    if(grid) {
                        grid.innerHTML = Object.keys(POS_MAP).map(full => {
                            const isSel = selectedPositions.includes(full);
                            return `<button onclick="vflow.setPos('${full}')" class="p-4 rounded-2xl border font-black text-xs transition-all flex justify-between items-center ${isSel?'pos-btn-active':'bg-slate-50 text-slate-700'}"><span>${full.toUpperCase()}</span></button>`;
                        }).join('');
                    }
                    const listDiv = document.getElementById('player-list');
                    if(isMgr) {
                        listDiv.innerHTML = players.map(p => `
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center animate-fade-in shadow-sm">
                                <div><p class="font-black text-slate-800">${p.ig}</p><p class="text-[10px] text-blue-500 font-bold">${p.pos}</p><p class="text-[9px] font-black ${p.status==='confirmed'?'text-green-500':'text-orange-400'} uppercase">${p.status==='confirmed'?'● PAID':'○ PENDING'}</p></div>
                                <div class="flex gap-1">
                                    <button onclick="vflow.confirmPlayer('${gid}','${p.id}')" class="bg-green-500 text-white px-3 py-2 rounded-xl text-[10px] font-black">核實</button>
                                    <button onclick="vflow.deletePlayer('${gid}','${p.id}')" class="bg-red-50 text-red-400 px-3 py-2 rounded-xl text-[10px] font-black">刪除</button>
                                </div>
                            </div>`).join('');
                    } else {
                        listDiv.innerHTML = `<p class="py-12 text-center text-slate-300 text-[10px] font-black tracking-[0.4em] uppercase italic">Privacy List Secured</p>`;
                    }
                });
            },

            setPos: (p) => {
                const idx = selectedPositions.indexOf(p);
                if(idx > -1) selectedPositions.splice(idx, 1);
                else if(selectedPositions.length < 2) selectedPositions.push(p);
                const btns = document.querySelectorAll('#pos-grid button');
                btns.forEach(b => {
                    if(selectedPositions.includes(b.innerText.split('\n')[0].trim().toUpperCase())) b.classList.add('pos-btn-active');
                    // 這裡簡化處理，實際點擊會觸發狀態重繪
                });
                vflow.updatePosUI();
            },
            
            updatePosUI: () => {
                document.querySelectorAll('#pos-grid button').forEach(b => {
                    const txt = b.querySelector('span').innerText;
                    if(selectedPositions.some(p => p.toUpperCase() === txt)) b.className = "p-4 rounded-2xl border font-black text-xs transition-all flex justify-between items-center pos-btn-active";
                    else b.className = "p-4 rounded-2xl border font-black text-xs transition-all flex justify-between items-center bg-slate-50 text-slate-700";
                });
            },

            join: async (gid, price) => {
                const ig = document.getElementById('ig').value.trim();
                if(!ig.startsWith('@') || selectedPositions.length === 0) return alert("資料錯誤");
                if(!confirm(`確認支付 $${price} 報名？`)) return;
                await addDoc(collection(db, `games/${gid}/players`), { ig, pos: selectedPositions.join(' & '), status: "pending", timestamp: serverTimestamp() });
                window.open(payUrl, "_blank");
                location.reload();
            },

            copyWA: async (gid, loc, time) => {
                const snap = await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")));
                let txt = `🏐 *VolleyFlow 名單*\n📍 地點：${loc}\n⏰ 時間：${time}\n\n`;
                let i = 1; snap.forEach(d => { const p = d.data(); txt += `${i}. ${p.ig} (${p.pos}) ${p.status==='confirmed'?'✅':'⏳'}\n`; i++; });
                navigator.clipboard.writeText(txt); alert("已複製！");
            },
            
            addAdmin: async () => {
                const u = prompt("新管理員用戶名:"); const p = prompt("密碼:");
                if(u && p) { await setDoc(doc(db, "admins", u), { username: u, password: p }); alert("成功"); }
            }
        };

        // 4. 初始化啟動
        if (user) {
            const adminBar = document.getElementById('admin-info-bar');
            adminBar.innerHTML = `<div class="mt-4 flex justify-center gap-2 items-center"><span class="text-[10px] font-black bg-blue-100 text-blue-600 px-3 py-1 rounded-full uppercase tracking-tighter">Admin: ${user.name}</span><button onclick="sessionStorage.removeItem('vf_user');location.reload();" class="text-[10px] font-black text-red-400 underline uppercase tracking-widest">Logout</button></div>`;
            
            const panel = document.getElementById('admin-panel');
            panel.classList.remove('hidden');
            panel.innerHTML = `
                <div class="bg-white p-8 rounded-[40px] shadow-2xl mb-10 border-2 border-blue-50">
                    <h3 class="font-black text-sm mb-4 italic uppercase text-slate-800">Create New Game</h3>
                    <div class="space-y-3">
                        <div class="flex items-center bg-slate-50 rounded-2xl px-4 border border-slate-100"><input id="new_loc" type="text" placeholder="地方名 (如: 天水圍)" class="flex-1 bg-transparent py-4 outline-none font-bold text-sm text-slate-700"><span class="text-slate-400 font-bold text-sm">體育館</span></div>
                        <input id="new_date" type="date" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                        <input id="new_time" type="text" placeholder="時間 (如: 19:00-21:00)" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-400 uppercase">名額: <input id="new_max" type="number" value="15" class="bg-transparent text-slate-700 w-10"></div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-400 uppercase">費用: <input id="new_price" type="number" value="30" class="bg-transparent text-slate-700 w-10"></div>
                        </div>
                        <button onclick="vflow.createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">發布場次</button>
                        ${user.role==='super' ? `<button onclick="vflow.addAdmin()" class="w-full border-2 border-slate-900 text-slate-900 font-black py-2 rounded-2xl text-[10px] mt-4 uppercase tracking-widest">＋ 新增管理員帳號</button>` : ''}
                    </div>
                </div>`;
        }

        document.getElementById('btn-login-exec').onclick = vflow.login;
        onSnapshot(doc(db, "settings", "global"), (d) => { if(d.exists()) payUrl = d.data().payUrl; });
        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
            const games = []; snap.forEach(d => games.push({id: d.id, ...d.data()}));
            if(currentView === 'list') vflow.renderList(games);
        });

    </script>
</body>
</html>
