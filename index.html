<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyballFlow | 專業排球系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; background-color: #f8fafc; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        .card { background: white; border-radius: 40px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid #f1f5f9; }
        /* 確保選中狀態的 CSS 優先級 */
        .pos-selected { background-color: #2563eb !important; color: white !important; border-color: #2563eb !important; }
    </style>
</head>
<body class="min-h-screen p-5 pb-20 text-slate-900 select-none">
    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter text-slate-900 leading-none">VOLLEYBALLFLOW</h1>
            <div id="admin-status" class="mt-4"></div>
        </header>

        <div id="admin-panel" class="hidden animate-fade-in">
            <div class="card p-8 mb-10 border-2 border-blue-50">
                <h3 class="font-black text-sm mb-4 italic uppercase text-slate-800 tracking-tighter">Create New Game</h3>
                <div class="space-y-3">
                    <input id="new_loc" type="text" placeholder="地方名 (如: 天水圍)" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <input id="new_date" type="date" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <input id="new_time" type="text" placeholder="時間 (如: 19:00-21:00)" class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-100 outline-none font-bold text-sm text-slate-700">
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-400 uppercase">名額: <input id="new_max" type="number" value="15" class="bg-transparent text-slate-700 w-10 outline-none font-black"></div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-400 uppercase">費用: <input id="new_price" type="number" value="30" class="bg-transparent text-slate-700 w-10 outline-none font-black"></div>
                    </div>
                    <button onclick="vflow.createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">發布場次</button>
                    
                    <div id="super-admin-tools" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <div class="bg-blue-50 p-4 rounded-3xl mb-4 border border-blue-100">
                            <p class="text-[9px] font-black text-blue-600 mb-3 uppercase italic text-center">Global Payment Setup</p>
                            <div class="flex gap-1 mb-3">
                                <button onclick="vflow.setPayMode('link')" id="mode-link" class="flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all">Link</button>
                                <button onclick="vflow.setPayMode('image')" id="mode-image" class="flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all">QR Image</button>
                            </div>
                            <div id="pay-url-box" class="flex gap-2">
                                <input id="pay_url_input" type="text" placeholder="https://payme..." class="flex-1 bg-white p-3 rounded-xl text-[10px] font-bold outline-none border border-slate-200">
                                <button onclick="vflow.updatePayUrl()" class="bg-blue-600 text-white px-4 rounded-xl text-[9px] font-black uppercase">Save</button>
                            </div>
                            <div id="pay-image-box" class="hidden">
                                <input id="pay_img_input" type="file" accept="image/*" class="w-full bg-white p-2 rounded-xl text-[9px] font-bold mb-2">
                                <button onclick="vflow.uploadPayImg()" class="w-full bg-blue-600 text-white py-2 rounded-xl text-[9px] font-black uppercase">Upload QR</button>
                            </div>
                        </div>
                        <button onclick="vflow.addAdminAccount()" class="w-full border-2 border-slate-900 text-slate-900 font-black py-3 rounded-2xl text-[10px] uppercase mb-4">＋ 新增管理員帳號</button>
                        <div id="admin-list-container" class="space-y-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-content">
            <div class="flex justify-center py-20"><div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div></div>
        </div>

        <div id="pay_modal" class="hidden fixed inset-0 modal-backdrop z-[60] flex items-center justify-center p-6 text-center">
            <div class="bg-white w-full max-w-xs p-8 rounded-[40px] shadow-2xl animate-fade-in">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-xl font-black text-slate-800 uppercase italic">報名成功</h3>
                <p class="text-[10px] text-slate-400 font-bold mb-6 uppercase tracking-widest">Payment Required</p>
                <div id="pay-action-area" class="mb-6 flex flex-col items-center w-full"></div>
                <button onclick="location.reload()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-widest">我已完成付款</button>
            </div>
        </div>

        <div id="login_modal" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-6">
            <div class="card w-full max-w-xs p-8 text-center">
                <h3 class="font-black italic mb-6 uppercase tracking-tighter">Admin Access</h3>
                <input id="login_u" type="text" placeholder="Username" class="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none font-bold border border-slate-100">
                <input id="login_p" type="password" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-2xl mb-6 outline-none font-bold border border-slate-100">
                <button onclick="vflow.login()" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg uppercase">Login</button>
                <button onclick="vflow.closeLogin()" class="mt-4 text-slate-400 text-[10px] font-bold uppercase">Cancel</button>
            </div>
        </div>

        <footer class="mt-20 py-10 text-center opacity-20">
            <div class="inline-block py-4 px-10" onclick="vflow.clickSecret()">
                <p class="text-[9px] font-black uppercase tracking-[0.3em]">© 2026 VolleyballFlow</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0",
            authDomain: "volleyballflow-7cf02.firebaseapp.com",
            projectId: "volleyballflow-7cf02",
            storageBucket: "volleyballflow-7cf02.firebasestorage.app",
            messagingSenderId: "1032620495700",
            appId: "1:1032620495700:web:c2d84f02e435d99e15eec1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };

        let user = JSON.parse(sessionStorage.getItem('vf_user'));
        let currentView = 'list';
        let paymentData = { mode: 'link', url: '', img: '' };
        let selectedPositions = [];
        let secretClicks = 0;

        window.vflow = {
            clickSecret: () => { secretClicks++; if(secretClicks === 4){ document.getElementById('login_modal').classList.remove('hidden'); secretClicks=0; } setTimeout(()=>secretClicks=0, 3000); },
            closeLogin: () => document.getElementById('login_modal').classList.add('hidden'),
            login: async () => {
                const u = document.getElementById('login_u').value;
                const p = document.getElementById('login_p').value;
                if(u === "Manusyip" && p === "Manusyip0830") { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'super'})); location.reload(); return; }
                const snap = await getDocs(query(collection(db, "admins"), where("username", "==", u), where("password", "==", p)));
                if(!snap.empty) { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'normal'})); location.reload(); } else { alert("帳號或密碼錯誤"); }
            },
            setPayMode: (mode) => {
                paymentData.mode = mode;
                const isLink = mode === 'link';
                document.getElementById('mode-link').className = `flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${isLink ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-600'}`;
                document.getElementById('mode-image').className = `flex-1 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${!isLink ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-600'}`;
                document.getElementById('pay-url-box').classList.toggle('hidden', !isLink);
                document.getElementById('pay-image-box').classList.toggle('hidden', isLink);
            },
            updatePayUrl: async () => { await setDoc(doc(db, "settings", "global"), { payMode: 'link', payUrl: document.getElementById('pay_url_input').value }, { merge: true }); alert("連結已更新"); },
            uploadPayImg: function() {
                const file = document.getElementById('pay_img_input').files[0];
                if(!file) return alert("請選擇檔案");
                const reader = new FileReader();
                reader.onloadend = async () => { await setDoc(doc(db, "settings", "global"), { payMode: 'image', payImg: reader.result }, { merge: true }); alert("圖片已上傳"); };
                reader.readAsDataURL(file);
            },
            createGame: async () => {
                const loc = document.getElementById('new_loc').value.trim();
                const dateVal = document.getElementById('new_date').value;
                const timeStr = document.getElementById('new_time').value.trim();
                if(!loc || !dateVal || !timeStr) return alert("請填寫完整資訊");
                const weekDay = ["日", "一", "二", "三", "四", "五", "六"][new Date(dateVal).getDay()];
                await addDoc(collection(db, "games"), { 
                    location: `${loc}體育館`, 
                    time: `${dateVal} (${weekDay}) ${timeStr}`, 
                    maxPlayers: parseInt(document.getElementById('new_max').value), 
                    price: parseInt(document.getElementById('new_price').value), 
                    createdBy: user.name, 
                    timestamp: serverTimestamp() 
                });
                location.reload();
            },
            addAdminAccount: async () => {
                const u = prompt("新管理員用戶名:");
                const p = prompt("密碼:");
                if(u && p) { await setDoc(doc(db, "admins", u), { username: u, password: p }); vflow.loadAdminList(); }
            },
            loadAdminList: async () => {
                const snap = await getDocs(collection(db, "admins"));
                let html = "";
                snap.forEach(d => { html += `<div class="flex justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 text-[10px] font-black italic"><span>${d.id}</span><button onclick="vflow.delAdmin('${d.id}')" class="text-red-400">撤權</button></div>`; });
                document.getElementById('admin-list-container').innerHTML = html;
            },
            delAdmin: async (id) => { if(confirm("確定刪除管理員？")) { await deleteDoc(doc(db, "admins", id)); vflow.loadAdminList(); } },
            setPos: (p) => {
                const idx = selectedPositions.indexOf(p);
                if(idx > -1) selectedPositions.splice(idx, 1);
                else { if(selectedPositions.length >= 2) return alert("最多選 2 個位置"); selectedPositions.push(p); }
                
                // 強制操作所有按鈕樣式 (解決變色問題)
                const btns = document.querySelectorAll('.pos-btn');
                btns.forEach(btn => {
                    const btnPos = btn.getAttribute('data-pos');
                    if(selectedPositions.includes(btnPos)) {
                        btn.style.backgroundColor = "#2563eb";
                        btn.style.color = "#ffffff";
                        btn.style.borderColor = "#2563eb";
                        btn.classList.add('pos-selected');
                    } else {
                        btn.style.backgroundColor = "#f8fafc";
                        btn.style.color = "#94a3b8";
                        btn.style.borderColor = "transparent";
                        btn.classList.remove('pos-selected');
                    }
                });
            },
            join: async (gid, pr, loc, time) => {
                const ig = document.getElementById('ig').value.trim();
                if(!ig.startsWith('@')) return alert("IG 必須以 @ 開頭");
                if(selectedPositions.length === 0) return alert("請至少選擇一個位置");
                const posStr = selectedPositions.join(' & ');
                if(!confirm(`確認報名 ${loc}？`)) return;

                try {
                    await addDoc(collection(db, `games/${gid}/players`), { ig, pos: posStr, status: "pending", timestamp: serverTimestamp() });
                    // TG 通知
                    fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TG_CONFIG.chatId, text: `🔔 *New Booking!*\n📍 ${loc}\n⏰ ${time}\n👤 ${ig}\n🏐 ${posStr}`, parse_mode: 'Markdown' }) });
                    
                    // 顯示付款區域
                    const area = document.getElementById('pay-action-area');
                    if(paymentData.mode === 'link' && paymentData.payUrl) {
                        area.innerHTML = `<button onclick="vflow.forceRedirect('${paymentData.payUrl}')" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl mb-4 text-sm">立即跳轉付款平台</button><p class="text-[9px] text-slate-400">如果沒有自動跳轉，請點擊上方按鈕</p>`;
                    } else if(paymentData.payImg) {
                        area.innerHTML = `<img src="${paymentData.payImg}" class="w-56 rounded-3xl mb-4 shadow-2xl border-4 border-slate-50"><p class="text-[10px] font-bold text-blue-600">請長按保存 QR Code 付款</p>`;
                    } else {
                        area.innerHTML = `<p class="text-xs font-bold text-slate-400 py-4">管理員未設定付款方式，請聯絡主辦人</p>`;
                    }
                    document.getElementById('pay_modal').classList.remove('hidden');
                } catch(e) { alert("報名失敗，請重試"); }
            },
            forceRedirect: (url) => {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            },
            renderList: (games) => {
                const container = document.getElementById('main-content');
                if(games.length === 0) { container.innerHTML = `<p class="text-center py-20 text-slate-300 font-black italic uppercase">No Games Found</p>`; return; }
                container.innerHTML = games.map(g => `
                    <div onclick="vflow.goToGame('${g.id}')" class="bg-white p-6 rounded-[35px] shadow-sm mb-4 border border-slate-100 active:scale-95 transition-all cursor-pointer relative">
                        <p class="text-[10px] font-black text-blue-600 uppercase mb-1">${g.time}</p>
                        <h3 class="text-xl font-black text-slate-800">${g.location}</h3>
                        ${(user?.role==='super'||user?.name===g.createdBy)? `<button onclick="event.stopPropagation();vflow.delGame('${g.id}')" class="absolute top-6 right-6 text-red-200 text-[9px] font-black uppercase">Delete</button>` : ''}
                    </div>
                `).join('');
            },
            goToGame: (id) => {
                currentView = 'detail'; selectedPositions = [];
                onSnapshot(doc(db, "games", id), (d) => {
                    if(!d.exists()) return;
                    const g = d.data(); const isMgr = user?.role === 'super' || user?.name === g.createdBy;
                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-6 text-blue-600 font-black text-xs uppercase tracking-widest">← Back to List</button>
                        <div class="bg-slate-900 text-white p-10 rounded-[45px] mb-8 relative shadow-2xl animate-fade-in">
                            <h2 class="text-2xl font-black italic mb-2">${g.location}</h2>
                            <p class="text-xs font-bold opacity-40 font-mono tracking-tighter">${g.time}</p>
                            ${isMgr ? `<button onclick="vflow.copyWA('${id}','${g.location}','${g.time}')" class="absolute right-6 bottom-6 bg-blue-600 text-[10px] px-5 py-2 rounded-full font-black shadow-lg">Copy WA</button>` : ''}
                        </div>
                        ${isMgr ? `
                            <div class="bg-blue-50 p-6 rounded-[35px] mb-8 border border-blue-100 animate-fade-in text-center">
                                <div class="flex justify-between mb-4 px-2">
                                    <span class="text-[10px] font-black text-green-600 uppercase">已收: <span id="stat-paid">$0</span></span>
                                    <span class="text-[10px] font-black text-blue-600 uppercase">預計: <span id="stat-total">$0</span></span>
                                </div>
                                <div class="flex flex-col gap-2 pt-3 border-t border-blue-100 text-slate-400 text-[10px] font-black">
                                    <div class="flex justify-between items-center"><span>名額:</span><input type="number" value="${g.maxPlayers}" onchange="vflow.upField('${id}','maxPlayers',this.value)" class="w-12 bg-white rounded p-1 text-center font-black"></div>
                                    <div class="flex justify-between items-center"><span>費用:</span><input type="number" value="${g.price}" onchange="vflow.upField('${id}','price',this.value)" class="w-12 bg-white rounded p-1 text-center font-black"></div>
                                </div>
                            </div>` : ''}
                        <div class="card p-8 mb-8 animate-fade-in">
                            <div class="flex justify-between items-center mb-6">
                                <span class="font-black italic text-slate-400 text-[10px] uppercase">Booking Info</span>
                                <span id="p-count" class="text-blue-600 font-black text-[10px] bg-blue-50 px-3 py-1 rounded-full uppercase italic italic">Loading...</span>
                            </div>
                            <input id="ig" type="text" placeholder="@Instagram_ID" class="w-full bg-slate-50 p-4 rounded-2xl mb-4 outline-none font-bold border border-transparent focus:border-blue-200 text-center text-sm">
                            <div class="grid grid-cols-1 gap-2 mb-8">
                                ${['Setter','Outside Hitter','Middle Blocker','Opposite Hitter','Libero'].map(p => `
                                    <button data-pos="${p}" onclick="vflow.setPos('${p}')" class="pos-btn p-4 rounded-2xl border font-black text-[10px] uppercase transition-all bg-slate-50 text-slate-400 border-transparent">${p}</button>
                                `).join('')}
                            </div>
                            <button onclick="vflow.join('${id}', ${g.price}, '${g.location}', '${g.time}')" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl uppercase tracking-widest active:scale-95 transition-all">Confirm Booking $${g.price}</button>
                        </div>
                        <div id="player-list" class="space-y-3 pb-20"></div>
                    `;
                    vflow.listenPlayers(id, isMgr, g.maxPlayers, g.price);
                });
            },
            listenPlayers: (gid, isMgr, max, price) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const players = []; let paidCount = 0;
                    snap.forEach(d => { 
                        const p = {id: d.id, ...d.data()}; 
                        players.push(p); 
                        if(p.status === 'confirmed') paidCount++; 
                    });
                    
                    if(document.getElementById('p-count')) document.getElementById('p-count').innerText = `已報名: ${players.length} / ${max}`;
                    if(isMgr && document.getElementById('stat-paid')) {
                        document.getElementById('stat-paid').innerText = `$${paidCount * price}`;
                        document.getElementById('stat-total').innerText = `$${players.length * price}`;
                    }

                    const listDiv = document.getElementById('player-list');
                    if(isMgr) {
                        listDiv.innerHTML = players.map((p, index) => `
                            <div class="bg-white p-5 rounded-3xl border border-slate-100 flex justify-between items-center shadow-sm animate-fade-in">
                                <div>
                                    <p class="font-black text-slate-800 text-sm">${index+1}. ${p.ig}</p>
                                    <p class="text-[8px] font-black ${p.status==='confirmed'?'text-green-500':'text-orange-400'} uppercase tracking-tighter mt-1">${p.status==='confirmed'?'● PAID':'○ PENDING'} - ${p.pos}</p>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="vflow.confirmP('${gid}','${p.id}')" class="bg-green-500 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase">核實</button>
                                    <button onclick="vflow.delP('${gid}','${p.id}')" class="bg-red-50 text-red-400 px-4 py-2 rounded-xl text-[9px] font-black uppercase">刪除</button>
                                </div>
                            </div>`).join('');
                    } else {
                        listDiv.innerHTML = `<p class="py-10 text-center text-slate-300 text-[10px] font-black uppercase italic tracking-[0.5em]">List Secured by V-Flow</p>`;
                    }
                });
            },
            delGame: async (id) => { if(confirm("永久刪除此場次？")) await deleteDoc(doc(db, "games", id)); },
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid) => await deleteDoc(doc(db, `games/${gid}/players`, pid)),
            upField: async (id, f, v) => await updateDoc(doc(db, "games", id), { [f]: parseInt(v) }),
            copyWA: async (gid, loc, time) => {
                const snap = await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")));
                let txt = `🏐 *VolleyballFlow 名單*\n📍 ${loc}\n⏰ ${time}\n\n`;
                let i = 1; snap.forEach(d => { 
                    const p = d.data(); 
                    txt += `${i}. ${p.ig} (${p.pos}) ${p.status==='confirmed'?'✅':'⏳'}\n`; 
                    i++; 
                });
                navigator.clipboard.writeText(txt); alert("WhatsApp 名單已複製到剪貼簿！");
            }
        };

        // 系統啟動
        if (user) {
            document.getElementById('admin-status').innerHTML = `
                <div class="flex justify-center items-center gap-2">
                    <span class="text-[10px] font-black bg-blue-100 text-blue-600 px-4 py-1 rounded-full uppercase italic">Admin: ${user.name}</span>
                    <button onclick="sessionStorage.removeItem('vf_user');location.reload();" class="text-[10px] font-black text-red-400 underline uppercase">Logout</button>
                </div>`;
            document.getElementById('admin-panel').classList.remove('hidden');
            if(user.role === 'super') { 
                document.getElementById('super-admin-tools').classList.remove('hidden'); 
                vflow.loadAdminList(); 
            }
        }

        // 全局設定監聽 (付款資訊)
        onSnapshot(doc(db, "settings", "global"), (d) => {
            if(d.exists()) {
                const data = d.data();
                paymentData = data;
                if(document.getElementById('pay_url_input')) document.getElementById('pay_url_input').value = data.payUrl || '';
                vflow.setPayMode(data.payMode || 'link');
            }
        });

        // 場次列表監聽
        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
            const games = [];
            snap.forEach(d => games.push({id: d.id, ...d.data()}));
            if(currentView === 'list') vflow.renderList(games);
        });
    </script>
</body>
</html>
