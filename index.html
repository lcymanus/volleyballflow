<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VolleyballFlow | 專業排球平台</title>

<meta property="og:type" content="website">
<meta property="og:title" content="VolleyballFlow | 香港專業排球平台">
<meta property="og:description" content="專為香港排球愛好者打造的活動報名與社群平台。即時查看最新場次、快速報名！">
<meta property="og:url" content="https://volleyballflow-7cf02.web.app">
<meta property="og:image" content="https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=1200">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body {
    background: #fafafa;
    color: #0f172a;
    font-family: 'Urbanist', sans-serif;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.3s ease;
}
.premium-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 1;
}
.premium-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    border-color: #cbd5e1;
}
.btn-black {
    background: #0f172a;
    color: #ffffff;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05);
}
.btn-black:hover {
    background: #1e293b;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
}
.btn-black:active {
    transform: scale(0.97);
}
.btn-black:disabled { opacity: 0.4; pointer-events: none; background: #64748b; }
.btn-outline {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    background: #ffffff;
}
.btn-outline:hover { border-color: #0f172a; background: #f8fafc; }
.btn-outline.selected {
    background: #0f172a;
    color: #ffffff;
    border-color: #0f172a;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
}
.btn-outline:active { transform: scale(0.97); }
.input-flat {
    width: 100%;
    border: 1px solid #e2e8f0;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
    background: #f8fafc;
    color: #0f172a;
}
.input-flat:focus {
    border-color: #0f172a;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.08);
}
#toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: #0f172a;
    color: #ffffff;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    z-index: 6000;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    text-align: center;
    max-width: 90%;
    display: flex;
    align-items: center;
    gap: 8px;
}
#toast.show { transform: translateX(-50%) translateY(0); }
.bottom-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
    border-radius: 24px 24px 0 0;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 5000;
    padding: 32px 24px;
    box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.05);
}
.bottom-sheet.open { transform: translateY(0); }
.section-title {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #64748b;
}
</style>
</head>
<body class="p-4 md:p-8 pb-24">
<div id="toast">MESSAGE</div>

<div id="app-root" class="max-w-xl md:max-w-6xl mx-auto w-full">
    <header class="mb-12 mt-4 flex justify-between items-end border-b border-slate-100 pb-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tighter leading-none select-none">
                VOLLEYBALL<br><span class="text-indigo-600">FLOW.</span>
            </h1>
            <p class="section-title mt-3">HONG KONG VOLLEYBALL COMMUNITY</p>
        </div>
    </header>

    <div id="main-content" class="space-y-6"></div>
</div>

<div id="sheet-overlay" class="fixed inset-0 bg-slate-900/40 opacity-0 pointer-events-none transition-opacity duration-300 z-[4999] backdrop-blur-xs" onclick="vflow.closeSheet()"></div>
<div id="bottom-sheet" class="bottom-sheet">
    <div class="max-w-md mx-auto relative z-10">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h3 class="text-2xl font-extrabold tracking-tighter uppercase text-slate-900">Register</h3>
                <p id="sheet-waitlist-status" class="text-[11px] font-bold text-slate-400 mt-0.5 uppercase tracking-wide">Normal Application</p>
            </div>
            <span class="text-3xl font-light text-indigo-600" id="sheet-price">$0</span>
        </div>
        <div class="flex gap-4 border-b border-slate-100 pb-4 mb-6">
            <button id="tab-payme" onclick="vflow.switchPayTab('payme')" class="text-[11px] font-extrabold border-b-2 border-slate-900 pb-1 relative z-10 tracking-widest">PAYME</button>
            <button id="tab-alipay" onclick="vflow.switchPayTab('alipay')" class="text-[11px] font-extrabold text-slate-300 pb-1 relative z-10 tracking-widest">ALIPAY</button>
        </div>
        <div id="content-payme" class="mb-6 text-center"></div>
        <div id="content-alipay" class="hidden mb-6 text-center"></div>
        
        <div class="space-y-4">
            <div>
                <label class="section-title block mb-2">Receipt Screenshot</label>
                <div class="border border-dashed border-slate-200 rounded-xl p-6 text-center relative hover:bg-slate-50 transition cursor-pointer bg-white">
                    <input type="file" id="receipt_input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-50" onchange="vflow.previewReceipt(this)">
                    <div id="receipt_placeholder" class="text-slate-400 text-xs font-medium space-y-1">
                        <p><i class="fa-solid fa-cloud-arrow-up text-lg mb-1 block text-slate-300"></i> Tap to upload receipt screenshot</p>
                    </div>
                    <img id="receipt_thumbnail" src="" class="hidden h-32 mx-auto rounded-lg relative z-10 object-contain shadow-sm border border-slate-100">
                </div>
            </div>
            
            <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl">
                <p class="text-[10px] text-slate-700 font-bold mb-1"><i class="fa-solid fa-circle-exclamation text-amber-500 mr-1"></i> 報名須知與免責聲明</p>
                <p class="text-[10px] text-slate-400 leading-relaxed font-normal">
                    參加者須確認個人身體狀況適合參與排球運動，並自行承擔任何風險。主辦方與場地方對任何意外受傷、財物損毀概不負責。提交即表示同意此聲明。
                </p>
            </div>

            <button id="btn-submit-reg" onclick="vflow.executeJoin()" class="w-full btn-black py-4 uppercase text-xs font-bold tracking-wider opacity-30 pointer-events-none mt-2 shadow-lg">Confirm Submission</button>
            <button onclick="vflow.closeSheet()" class="w-full text-slate-400 font-bold text-xs uppercase tracking-wider text-center mt-2 block py-1">Cancel</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { apiKey: 'AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0', authDomain: "volleyballflow-7cf02.firebaseapp.com", projectId: "volleyballflow-7cf02", storageBucket: "volleyballflow-7cf02.firebasestorage.app", messagingSenderId: "1032620495700", appId: "1:1032620495700:web:c2d84f02e435d99e15eec1" };
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const $ = id => document.getElementById(id);

let currentView = 'list';
let selectedPositions = [];
let tempJoinData = {};
let currentPlayers = [];
let isWaitlistMode = false;

window.vflow = {
    showToast: (msg, isError = false) => {
        const t = $('toast');
        if (!t) return;
        t.innerHTML = isError ? `<i class="fa-solid fa-circle-xmark text-red-400"></i> ${msg}` : `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${msg}`;
        t.style.background = isError ? '#f43f5e' : '#0f172a';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    },
    compressImg: (file) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = e => {
            const img = new Image();
            img.onload = () => {
                const cvs = document.createElement('canvas');
                const max = 700; 
                const scale = img.width > max ? max / img.width : 1;
                cvs.width = img.width * scale;
                cvs.height = img.height * scale;
                const ctx = cvs.getContext('2d');
                if (!ctx) { reject(new Error("Canvas Error")); return; }
                ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
                resolve(cvs.toDataURL('image/jpeg', 0.6)); 
            };
            img.onerror = () => reject(new Error("Image Error"));
            img.src = e.target.result;
        };
        r.onerror = () => reject(new Error("File Error"));
        r.readAsDataURL(file);
    }),
    formatTimeDisplay: (timeStr) => {
        if (!timeStr) return '';
        const parts = timeStr.split(') ');
        if (parts.length === 2) {
            return `<div class="text-[14px] font-extrabold text-indigo-600 tracking-wider leading-snug"><span class="block">${parts[0]})</span><span class="block text-slate-800 text-base font-bold">${parts[1]}</span></div>`;
        }
        return `<div class="text-[14px] font-extrabold text-indigo-600 tracking-wider">${timeStr}</div>`;
    },
    openSheet: () => {
        $('bottom-sheet').classList.add('open');
        $('sheet-overlay').classList.replace('opacity-0', 'opacity-100');
        $('sheet-overlay').classList.replace('pointer-events-none', 'pointer-events-auto');
    },
    closeSheet: () => {
        $('bottom-sheet').classList.remove('open');
        $('sheet-overlay').classList.replace('opacity-100', 'opacity-0');
        $('sheet-overlay').classList.replace('pointer-events-auto', 'pointer-events-none');
    },
    switchPayTab: (t) => {
        const isP = t === 'payme';
        $('content-payme').classList.toggle('hidden', !isP);
        $('content-alipay').classList.toggle('hidden', isP);
        $('tab-payme').className = isP ? 'text-[11px] font-extrabold border-b-2 border-slate-900 pb-1 relative z-10 tracking-widest' : 'text-[11px] font-extrabold text-slate-300 pb-1 relative z-10 tracking-widest';
        $('tab-alipay').className = !isP ? 'text-[11px] font-extrabold border-b-2 border-slate-900 pb-1 relative z-10 tracking-widest' : 'text-[11px] font-extrabold text-slate-300 pb-1 relative z-10 tracking-widest';
    },
    renderList: (games) => {
        const container = $('main-content');
        if (!container) return;
        const approvedGames = games.filter(g => g.approved);
        if (approvedGames.length === 0) {
            container.innerHTML = `<div class="text-center py-24"><i class="fa-solid fa-circle-nodes text-3xl text-slate-200 mb-3 block"></i><p class="section-title">No Active Events Available</p></div>`;
            return;
        }
        container.innerHTML = approvedGames.map(g => {
            const descPreview = g.description ? (g.description.length > 35 ? g.description.substring(0, 35) + '...' : g.description) : '';
            return `
            <div onclick="vflow.goToGame('${g.id}')" class="premium-card p-6 md:p-8 cursor-pointer group">
                <div class="flex justify-between items-start mb-6">
                    ${vflow.formatTimeDisplay(g.time)}
                    <span class="text-[9px] font-extrabold text-slate-400 tracking-wider bg-slate-50 px-2 py-1 rounded border border-slate-100 uppercase">@${g.createdBy}</span>
                </div>
                <h3 class="text-xl md:text-2xl font-extrabold tracking-tight mb-3 text-slate-800 uppercase group-hover:text-indigo-600 transition-colors">${g.location}</h3>
                ${descPreview ? `<p class="text-xs text-slate-400 mb-6 leading-relaxed">${descPreview}</p>` : '<div class="h-4"></div>'}
                <div class="flex flex-wrap gap-3 border-t border-slate-100 pt-4 mt-2">
                    <span class="text-[10px] font-extrabold text-indigo-500 tracking-wider group-hover:translate-x-1 transition-transform">VIEW DETAILS <i class="fa-solid fa-arrow-right ml-0.5"></i></span>
                </div>
            </div>`;
        }).join('');
    },
    goToGame: (id) => {
        currentView = 'detail';
        selectedPositions = [];
        $('main-content').innerHTML = `<div class="animate-pulse space-y-6"><div class="h-4 w-20 bg-slate-200 rounded"></div><div class="h-32 bg-slate-200 rounded-2xl"></div></div>`;

        onSnapshot(doc(db, "games", id), async (d) => {
            if (!d.exists()) return;
            const g = d.data();
            tempJoinData = { location: g.location };
            
            $('main-content').innerHTML = `
                <button onclick="location.reload()" class="section-title mb-6 flex items-center gap-2 hover:text-slate-900 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Back to list
                </button>
                <div class="max-w-2xl mx-auto space-y-6">
                    <div>
                        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tighter text-slate-900 uppercase mb-3">${g.location}</h2>
                        <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 shadow-xs">
                            ${vflow.formatTimeDisplay(g.time)}
                            <span id="p-count" class="text-xs font-bold bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full tracking-wide">0 / ${g.maxPlayers}</span>
                        </div>
                    </div>
                    ${g.description ? `
                    <div class="p-4 border-l-4 border-indigo-500 bg-white rounded-r-xl">
                        <p class="section-title !text-[9px] mb-1">Event Description</p>
                        <p class="text-xs md:text-sm text-slate-600 leading-relaxed whitespace-pre-line">${g.description}</p>
                    </div>` : ''}
                    
                    <div class="premium-card p-6">
                        <h3 class="section-title mb-4"><i class="fa-solid fa-user-plus mr-1"></i> Player Information</h3>
                        <div class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <input id="nickname" type="text" placeholder="NICKNAME (名字/綽號)" class="input-flat">
                                <input id="ig" type="text" placeholder="INSTAGRAM ACCOUNT (必須帶 @)" class="input-flat">
                            </div>
                            <div>
                                <label class="section-title !text-[9px] mb-2 block">Select Position (多選最多兩項)</label>
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    ${['Setter (二傳)', 'Outside (大搥)', 'Middle (快攻)', 'Opposite (接應)', 'Libero (自由人)'].map(p => `
                                        <button data-pos="${p}" onclick="vflow.setPos('${p}')" class="pos-btn btn-outline py-3 text-[10px] md:text-xs uppercase bg-white truncate">${p}</button>
                                    `).join('')}
                                </div>
                            </div>
                            <button onclick="vflow.prepJoin('${id}', ${g.price}, '${g.createdById}', '${g.createdBy}', ${g.maxPlayers})" class="w-full btn-black py-4 uppercase text-xs font-bold tracking-wider mt-2 shadow-md">
                                Proceed to Register ($${g.price})
                            </button>
                        </div>
                    </div>
                </div>`;
            
            vflow.listenPlayers(id, g.maxPlayers);
        });
    },
    listenPlayers: (gid, max) => {
        onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
            currentPlayers = [];
            snap.forEach(d => currentPlayers.push({ id: d.id, ...d.data() }));
            const confirmedCount = currentPlayers.filter(p => p.status === 'confirmed').length;
            if ($('p-count')) $('p-count').innerText = `${confirmedCount} 已確認 / ${max} 名額`;
            isWaitlistMode = (confirmedCount >= max);
        });
    },
    setPos: (p) => {
        const idx = selectedPositions.indexOf(p);
        if (idx > -1) selectedPositions.splice(idx, 1);
        else {
            if (selectedPositions.length >= 2) { vflow.showToast("位置最多選擇兩項", true); return; }
            selectedPositions.push(p);
        }
        document.querySelectorAll('.pos-btn').forEach(btn => {
            btn.classList.toggle('selected', selectedPositions.includes(btn.getAttribute('data-pos')));
        });
    },
    prepJoin: async (gid, pr, creatorId, orgName, max) => {
        const ig = $('ig').value.trim();
        const nick = $('nickname').value.trim();
        if (!nick || !ig.startsWith('@') || selectedPositions.length === 0) {
            vflow.showToast("資料錯誤（IG須帶@）或未選位置", true); return;
        }
        if (currentPlayers.some(p => p.nickname.toLowerCase() === nick.toLowerCase() || p.ig.toLowerCase() === ig.toLowerCase())) {
            vflow.showToast("系統提示：您已在名單中，請勿重複提交！", true); return;
        }

        const waitlistLabel = $('sheet-waitlist-status');
        if (waitlistLabel) {
            waitlistLabel.innerHTML = isWaitlistMode ? 
                `<span class="text-rose-500"><i class="fa-solid fa-triangle-exclamation"></i> 額滿輪候中 (Waitlist)</span>` : 
                `<span class="text-emerald-500"><i class="fa-solid fa-circle-check"></i> 正常報名名額</span>`;
        }

        try {
            let orgData = {};
            const docRef = creatorId === 'super_admin' ? doc(db, "global_settings", "payment") : doc(db, "admins", creatorId);
            const adminDoc = await getDoc(docRef);
            if (adminDoc.exists()) orgData = adminDoc.data();
            
            $('content-payme').innerHTML = orgData.payUrl ? `
                <div class="p-4 bg-rose-50 rounded-xl border border-rose-100">
                    <p class="text-[10px] text-rose-700 mb-3 font-bold tracking-wider">點擊下方按鈕自動跳轉 PayMe</p>
                    <a href="${orgData.payUrl}" target="_blank" class="flex items-center justify-center w-full bg-[#E02443] text-white rounded-xl py-3.5 text-xs font-bold shadow-sm"><i class="fa-solid fa-link mr-2"></i> 一鍵開啟 PayMe 付款</a>
                </div>` : '<p class="text-xs text-slate-400 py-4">主辦方未設定 PayMe 連結</p>';
            
            $('content-alipay').innerHTML = orgData.payImg ? `
                <div class="p-4 bg-sky-50 rounded-xl border border-sky-100">
                    <p class="text-[10px] text-sky-700 mb-3 font-bold tracking-wider">請掃描 QR Code 付款</p>
                    <img src="${orgData.payImg}" class="w-44 mx-auto rounded-xl border border-sky-200">
                </div>` : '<p class="text-xs text-slate-400 py-4">主辦方未設定 Alipay 條碼</p>';
            
            $('sheet-price').innerText = `$${pr}`;
            tempJoinData = { ...tempJoinData, gid, ig, nickname: nick, pos: selectedPositions.join(' & '), org: orgName };
            vflow.openSheet();
        } catch (err) { vflow.showToast("獲取主辦方收款帳號失敗", true); }
    },
    previewReceipt: (input) => {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                $('receipt_thumbnail').src = e.target.result;
                $('receipt_thumbnail').classList.remove('hidden');
                $('receipt_placeholder').classList.add('hidden');
                $('btn-submit-reg').classList.remove('opacity-30', 'pointer-events-none');
            };
            reader.readAsDataURL(file);
        }
    },
    executeJoin: async () => {
        const file = $('receipt_input').files[0];
        if (!file) return;
        const btn = $('btn-submit-reg');
        btn.disabled = true; btn.innerText = "UPLOADING...";

        try {
            const base64Img = await vflow.compressImg(file);
            const finalStatus = isWaitlistMode ? "waitlist" : "pending";
            
            await addDoc(collection(db, `games/${tempJoinData.gid}/players`), {
                ...tempJoinData, status: finalStatus, receipt: base64Img, timestamp: serverTimestamp()
            });
            
            alert(isWaitlistMode ? "⚠️ 目前名額已滿，您的申請已進入候補名單(Waitlist)。" : "✅ 報名收據已提交！待主辦方審核確認。");
            location.reload();
        } catch (e) {
            vflow.showToast("上傳報名記錄失敗", true);
            btn.disabled = false; btn.innerText = "CONFIRM SUBMISSION";
        }
    }
};

onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
    const games = []; snap.forEach(d => games.push({ id: d.id, ...d.data() }));
    if (currentView === 'list') vflow.renderList(games);
});
</script>
</body>
</html>
