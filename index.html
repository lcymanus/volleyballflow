<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VolleyballFlow | 專業排球平台</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --brand-primary: #4f46e5;
            --brand-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body { 
            background: #f8fafc;
            color: var(--brand-dark);
            font-family: 'Urbanist', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            position: relative;
            /* 現代動態背景 */
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
        }
        
        /* 品牌浮雕水印 */
        body::before {
            content: "VOLLEYFLOW";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 15vw;
            font-weight: 900;
            font-style: italic;
            color: rgba(15, 23, 42, 0.02);
            pointer-events: none;
            z-index: 0;
            letter-spacing: -0.05em;
        }

        .glass-card { 
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:active { transform: scale(0.98); }

        .btn-primary {
            background: var(--brand-dark);
            color: white;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:active { transform: scale(0.96); opacity: 0.9; }

        .pos-btn { 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1.5px solid #e2e8f0; 
            background: white;
            border-radius: 18px;
        }
        
        .pos-selected { 
            background: var(--brand-dark) !important; 
            color: white !important; 
            border-color: var(--brand-dark) !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(15, 23, 42, 0.3);
        }

        .input-premium {
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid #e2e8f0;
            padding: 18px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .input-premium:focus {
            border-color: var(--brand-primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }

        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: white;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 1000;
            padding: 40px 24px;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.08);
        }
        .bottom-sheet.open { transform: translateY(0); }

        /* 隱藏原生滾動條但保持滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-6 pb-24 no-scrollbar">

    <div id="app-root" class="max-w-md mx-auto relative z-10">
        <header class="mb-12 text-center pt-6">
            <h1 onclick="vflow.clickSecret()" class="text-5xl font-black italic tracking-[ -0.06em] text-slate-900 leading-none cursor-pointer select-none">
                VOLLEY<span class="text-indigo-600">FLOW</span>
            </h1>
            <div class="flex items-center justify-center gap-2 mt-4">
                <span class="h-[1px] w-4 bg-slate-300"></span>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Pro Ecosystem</p>
                <span class="h-[1px] w-4 bg-slate-300"></span>
            </div>
            <div id="admin-status" class="mt-8"></div>
        </header>

        <div id="admin-panel" class="hidden space-y-8 mb-12">
            <div id="super-admin-tools" class="hidden glass-card p-6 border-red-100 bg-red-50/30">
                <h3 class="text-[10px] font-black uppercase text-red-500 tracking-widest mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-crown"></i> Super Admin Tools
                </h3>
                <div class="flex gap-2 mb-4">
                    <input id="new_admin_u" type="text" placeholder="Username" class="flex-1 bg-white border border-red-100 p-3 rounded-xl text-xs outline-none">
                    <input id="new_admin_p" type="text" placeholder="Password" class="flex-1 bg-white border border-red-100 p-3 rounded-xl text-xs outline-none">
                    <button onclick="vflow.addAdminAccount()" class="bg-red-500 text-white px-4 rounded-xl text-[10px] font-black uppercase">Add</button>
                </div>
                <div id="admin-list-container" class="space-y-2 mt-4 border-t border-red-100 pt-4"></div>
            </div>

            <div class="glass-card p-6">
                <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-5">Payment Configuration</h3>
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100">
                        <label class="text-[9px] font-black text-indigo-500 uppercase mb-2 block">PayMe Link</label>
                        <div class="flex gap-2">
                            <input id="pay_url_input" type="text" placeholder="https://..." class="flex-1 text-xs outline-none">
                            <button onclick="vflow.updatePayUrl()" class="text-indigo-600 font-black text-[10px] uppercase">Save</button>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100">
                        <label class="text-[9px] font-black text-sky-500 uppercase mb-2 block">Alipay QR Code</label>
                        <div class="flex gap-2 items-center">
                            <input id="pay_img_input" type="file" accept="image/*" class="flex-1 text-[10px] text-slate-400">
                            <button onclick="vflow.uploadPayImg()" class="bg-sky-500 text-white px-4 py-2 rounded-lg text-[9px] font-black uppercase">Upload</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-8">
                <h3 class="text-lg font-black italic text-slate-800 mb-6 uppercase tracking-tight" id="create-title">New Game Session 🏐</h3>
                <div class="space-y-4">
                    <input id="new_loc" type="text" placeholder="Venue Name (e.g. 港島東)" class="input-premium">
                    <div class="grid grid-cols-2 gap-3">
                        <input id="new_date" type="date" class="input-premium !py-4 text-xs">
                        <div class="flex gap-1">
                            <input id="start_time" type="time" value="19:00" class="input-premium !p-3 text-xs">
                            <input id="end_time" type="time" value="21:00" class="input-premium !p-3 text-xs">
                        </div>
                    </div>
                    <textarea id="new_desc" placeholder="Notes... (e.g. Court 1)" class="input-premium h-24 resize-none"></textarea>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-slate-50 p-4 rounded-2xl"><label class="text-[8px] font-black text-slate-400 uppercase">Limit</label><input id="new_max" type="number" value="15" class="bg-transparent font-black w-full outline-none"></div>
                        <div class="bg-slate-50 p-4 rounded-2xl"><label class="text-[8px] font-black text-slate-400 uppercase">Fee</label><input id="new_price" type="number" value="30" class="bg-transparent font-black w-full outline-none"></div>
                        <div class="bg-red-50/50 p-4 rounded-2xl"><label class="text-[8px] font-black text-red-400 uppercase">Cost</label><input id="new_cost" type="number" value="0" class="bg-transparent font-black text-red-600 w-full outline-none"></div>
                    </div>
                    <button onclick="vflow.createGame()" class="w-full btn-primary font-black py-5 rounded-2xl shadow-xl shadow-indigo-100 uppercase tracking-widest text-xs">Publish Session</button>
                </div>
            </div>
        </div>

        <div id="main-content" class="relative z-10 space-y-6"></div>
        
        <div id="story_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[2000]">
            <div class="bg-white w-full max-w-sm p-8 rounded-[40px] shadow-2xl">
                <h3 class="text-slate-800 text-center font-black italic text-xl mb-6">READY TO POST</h3>
                <img id="story_preview" src="" class="w-full rounded-3xl mb-6 shadow-xl border border-slate-50">
                <a id="story_download_btn" href="#" download="story.png" class="block w-full btn-primary text-center font-black py-5 rounded-2xl shadow-lg uppercase text-xs mb-3">Download Image</a>
                <button onclick="document.getElementById('story_modal').classList.add('hidden')" class="w-full text-slate-400 font-bold text-[10px] uppercase">Close</button>
            </div>
        </div>

        <div id="login_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[3000]">
            <div class="glass-card w-full max-w-xs p-10 text-center">
                <h3 class="font-black italic text-slate-800 mb-8 uppercase text-2xl tracking-tighter">Organizer</h3>
                <input id="login_u" type="text" placeholder="Username" class="input-premium mb-3">
                <input id="login_p" type="password" placeholder="Password" class="input-premium mb-8">
                <div class="flex flex-col gap-3">
                    <button onclick="vflow.login()" class="w-full btn-primary font-black py-4 rounded-2xl uppercase text-xs">Access Portal</button>
                    <button onclick="vflow.closeLogin()" class="w-full text-slate-400 font-bold text-[10px] uppercase py-2">Back</button>
                </div>
            </div>
        </div>

        <div id="receipt_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-[4000]" onclick="this.classList.add('hidden')">
            <div class="relative max-w-full max-h-full">
                <img id="receipt_display_img" src="" class="max-w-full max-h-[85vh] rounded-3xl shadow-2xl border-4 border-white">
            </div>
        </div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay" onclick="vflow.closeSheet()"></div>
    <div id="bottom-sheet" class="bottom-sheet flex flex-col">
        <div class="w-16 h-1.5 bg-slate-100 rounded-full mx-auto mb-10 shrink-0"></div>
        <div class="text-center mb-8">
            <h3 class="text-3xl font-black italic uppercase tracking-tighter text-slate-900">Checkout</h3>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">Secure Registration</p>
        </div>
        
        <div class="bg-slate-50 rounded-[32px] p-8 mb-8 relative overflow-hidden">
            <div class="relative z-10 flex justify-between items-end">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Total Fee</p>
                    <p class="text-4xl font-black text-slate-900" id="sheet-price">$0</p>
                </div>
                <div class="text-right">
                    <p id="sheet-org-name" class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full inline-block">Org</p>
                    <p id="sheet-ig-tag" class="text-sm font-bold text-slate-800 mt-2 block">@ig</p>
                </div>
            </div>
            <div class="absolute top-0 right-0 -mr-10 -mt-10 w-40 h-40 bg-indigo-500/5 rounded-full"></div>
        </div>

        <div id="payment-upload-area" class="space-y-6 flex-1 overflow-y-auto no-scrollbar">
            <div class="flex gap-2 bg-slate-100 p-1.5 rounded-2xl">
                <button id="tab-payme" onclick="vflow.switchPayTab('payme')" class="flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all bg-white text-indigo-600 shadow-sm">PayMe</button>
                <button id="tab-alipay" onclick="vflow.switchPayTab('alipay')" class="flex-1 py-4 rounded-xl text-[10px] font-black uppercase transition-all text-slate-500">Alipay</button>
            </div>
            
            <div id="content-payme" class="animate-in fade-in duration-300"></div>
            <div id="content-alipay" class="hidden animate-in fade-in duration-300"></div>

            <div class="pt-6">
                <p class="text-[10px] font-black text-slate-400 uppercase text-center mb-4 tracking-widest">Screenshot Required</p>
                <div class="file-upload-wrapper border-2 border-dashed border-slate-200 rounded-[24px] p-10 text-center hover:bg-slate-50 transition-all">
                    <input type="file" id="receipt_input" accept="image/*" onchange="vflow.previewReceipt(this)">
                    <div id="receipt_placeholder">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-camera text-slate-400"></i>
                        </div>
                        <p class="text-xs font-black text-slate-500 uppercase tracking-tight">Tap to Upload Receipt</p>
                    </div>
                    <img id="receipt_thumbnail" src="" class="hidden w-full h-40 object-cover rounded-2xl mt-2 shadow-lg">
                </div>
            </div>
        </div>

        <div class="mt-8">
            <button id="btn-submit-reg" onclick="vflow.executeJoin()" class="w-full btn-primary font-black py-5 rounded-2xl shadow-2xl uppercase tracking-widest text-xs opacity-50 cursor-not-allowed" disabled>Confirm & Register</button>
            <button onclick="vflow.closeSheet()" class="w-full mt-4 text-slate-300 font-bold text-[10px] uppercase">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0", authDomain: "volleyballflow-7cf02.firebaseapp.com", projectId: "volleyballflow-7cf02", storageBucket: "volleyballflow-7cf02.firebasestorage.app", messagingSenderId: "1032620495700", appId: "1:1032620495700:web:c2d84f02e435d99e15eec1" };
        const app = initializeApp(firebaseConfig); 
        const db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };
        const SYSTEM_URL = "https://www.volleyballflow.com";

        let user = JSON.parse(sessionStorage.getItem('vf_user')); 
        let currentView = 'list'; let selectedPositions = []; let secretClicks = 0; let tempJoinData = null;

        window.vflow = {
            sendTG: async (msg) => { try { await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage?chat_id=${TG_CONFIG.chatId}&text=${encodeURIComponent(msg + "\n\n🔗 連結: " + SYSTEM_URL)}`); } catch(e){} },
            compressImg: (file) => new Promise(resolve => { const r = new FileReader(); r.onload = e => { const img = new Image(); img.onload = () => { const cvs = document.createElement('canvas'); const max = 800; const scale = img.width > max ? max / img.width : 1; cvs.width = img.width * scale; cvs.height = img.height * scale; const ctx = cvs.getContext('2d'); ctx.drawImage(img, 0, 0, cvs.width, cvs.height); resolve(cvs.toDataURL('image/jpeg', 0.6)); }; img.src = e.target.result; }; r.readAsDataURL(file); }),
            clickSecret: () => { secretClicks++; if(secretClicks===4){ document.getElementById('login_modal').classList.remove('hidden'); secretClicks=0; } setTimeout(()=>secretClicks=0, 3000); },
            closeLogin: () => { document.getElementById('login_modal').classList.add('hidden'); },
            login: async () => {
                const u = document.getElementById('login_u').value.trim();
                const p = document.getElementById('login_p').value.trim();
                if(u==="Manusyip" && p==="Manusyip0830") { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'super'})); location.reload(); return; }
                const snap = await getDocs(query(collection(db, "admins"), where("username", "==", u), where("password", "==", p)));
                if(!snap.empty) { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'normal'})); location.reload(); } else alert("Access Denied");
            },
            openSheet: () => { document.getElementById('bottom-sheet').classList.add('open'); document.getElementById('sheet-overlay').classList.add('open'); },
            closeSheet: () => { document.getElementById('bottom-sheet').classList.remove('open'); document.getElementById('sheet-overlay').classList.remove('open'); },
            updatePayUrl: async () => { await setDoc(doc(db, "admins", user.name), { payUrl: document.getElementById('pay_url_input').value }, { merge: true }); alert("Updated!"); },
            uploadPayImg: function() { const file = document.getElementById('pay_img_input').files[0]; if(!file) return; const reader = new FileReader(); reader.onloadend = async () => { await setDoc(doc(db, "admins", user.name), { payImg: reader.result }, { merge: true }); alert("Uploaded!"); }; reader.readAsDataURL(file); },

            createGame: async () => { 
                const isSuper = user?.role === 'super';
                const loc = document.getElementById('new_loc').value.trim(); 
                const dateVal = document.getElementById('new_date').value; 
                const sT = document.getElementById('start_time').value;
                const eT = document.getElementById('end_time').value;
                if(!loc||!dateVal) return alert("Missing Info");
                const weekDay = ["日","一","二","三","四","五","六"][new Date(dateVal).getDay()];
                const fullLoc = loc.includes("體育館") ? loc : `${loc}體育館`;
                const fullTime = `${dateVal} (${weekDay}) ${sT} - ${eT}`;
                await addDoc(collection(db, "games"), { 
                    location: fullLoc, time: fullTime, description: document.getElementById('new_desc').value.trim(),
                    maxPlayers: parseInt(document.getElementById('new_max').value), 
                    price: parseInt(document.getElementById('new_price').value), 
                    cost: parseInt(document.getElementById('new_cost').value||0), 
                    createdBy: user.name, approved: isSuper, timestamp: serverTimestamp() 
                });
                if(isSuper) vflow.sendTG(`🆕 新場次發佈！\n📍 ${fullLoc}\n⏰ ${fullTime}`);
                alert(isSuper ? "Published!" : "Pending Review."); location.reload(); 
            },

            approveGame: async (id, loc) => { await updateDoc(doc(db, "games", id), { approved: true }); vflow.sendTG(`✅ 【場次已批准】\n📍 ${loc}`); alert("Approved!"); },
            delGame: async (id) => { if(confirm("Delete Game?")) { await deleteDoc(doc(db, "games", id)); } },
            setPos: (p) => { 
                const idx = selectedPositions.indexOf(p); 
                if(idx>-1) selectedPositions.splice(idx,1); 
                else { if(selectedPositions.length>=2) return; selectedPositions.push(p); } 
                document.querySelectorAll('.pos-btn').forEach(btn => { 
                    btn.classList.toggle('pos-selected', selectedPositions.includes(btn.getAttribute('data-pos'))); 
                }); 
            },

            prepJoin: async (gid, pr, loc, time, maxLimit, createdBy) => {
                const ig = document.getElementById('ig').value.trim();
                const nickname = document.getElementById('nickname').value.trim();
                if(!ig.startsWith('@')) return alert("IG must start with @"); 
                if(!nickname) return alert("Please enter nickname");
                if(selectedPositions.length===0) return alert("Select position"); 
                const adminDoc = await getDoc(doc(db, "admins", createdBy)); const orgData = adminDoc.data() || {};
                document.getElementById('content-payme').innerHTML = orgData.payUrl ? `<a href="${orgData.payUrl}" target="_blank" class="w-full bg-[#E51B5C] text-white font-black py-5 rounded-2xl flex justify-center items-center gap-2 shadow-lg shadow-pink-100">PayMe One-Click</a>` : `No Link Provided`;
                document.getElementById('content-alipay').innerHTML = orgData.payImg ? `<img src="${orgData.payImg}" class="w-48 mx-auto rounded-3xl shadow-lg border border-slate-50">` : `No QR Provided`;
                document.getElementById('sheet-price').innerText = `$${pr}`; document.getElementById('sheet-org-name').innerText = `@${createdBy}`; document.getElementById('sheet-ig-tag').innerText = ig;
                tempJoinData = { gid, pr, loc, time, maxLimit, createdBy, ig, nickname, pos: selectedPositions.join(' & ') };
                vflow.openSheet();
            },

            switchPayTab: (tab) => { 
                const isP = tab === 'payme'; 
                document.getElementById('content-payme').classList.toggle('hidden', !isP); 
                document.getElementById('content-alipay').classList.toggle('hidden', isP);
                document.getElementById('tab-payme').className = isP ? 'flex-1 py-4 rounded-xl text-[10px] font-black uppercase bg-white text-indigo-600 shadow-sm' : 'flex-1 py-4 rounded-xl text-[10px] font-black uppercase text-slate-400';
                document.getElementById('tab-alipay').className = !isP ? 'flex-1 py-4 rounded-xl text-[10px] font-black uppercase bg-white text-sky-600 shadow-sm' : 'flex-1 py-4 rounded-xl text-[10px] font-black uppercase text-slate-400';
            },

            previewReceipt: (input) => { 
                if(input.files && input.files[0]) { 
                    document.getElementById('receipt_placeholder').classList.add('hidden'); 
                    const thumb = document.getElementById('receipt_thumbnail'); 
                    thumb.src = URL.createObjectURL(input.files[0]); 
                    thumb.classList.remove('hidden'); 
                    document.getElementById('btn-submit-reg').disabled = false; 
                    document.getElementById('btn-submit-reg').classList.remove('opacity-50','cursor-not-allowed'); 
                } 
            },

            executeJoin: async () => {
                if(!tempJoinData) return; const file = document.getElementById('receipt_input').files[0]; if(!file) return;
                const btn = document.getElementById('btn-submit-reg'); btn.innerText = "Uploading..."; btn.disabled = true;
                try {
                    const base64Img = await vflow.compressImg(file);
                    await addDoc(collection(db, `games/${tempJoinData.gid}/players`), { 
                        ig: tempJoinData.ig, 
                        nickname: tempJoinData.nickname,
                        pos: tempJoinData.pos, status: "pending", receipt: base64Img, timestamp: serverTimestamp() 
                    });
                    vflow.sendTG(`📩 【有人報名】\n📍 ${tempJoinData.loc}\n👤 ${tempJoinData.nickname} (${tempJoinData.ig})`);
                    alert("Success! Waiting for verification."); vflow.closeSheet(); location.reload();
                } catch(e) { alert("Error, try again"); btn.disabled = false; }
            },

            viewReceipt: (b64) => { document.getElementById('receipt_display_img').src = b64; document.getElementById('receipt_modal').classList.remove('hidden'); },

            renderList: (games) => {
                const container = document.getElementById('main-content');
                if(games.length===0) { container.innerHTML = `<p class="text-center text-slate-400 py-20 font-bold uppercase tracking-widest text-[10px]">No Sessions Available</p>`; return; }
                container.innerHTML = games.map(g => {
                    if(!g.approved && user?.role !== 'super' && user?.name !== g.createdBy) return '';
                    return `
                    <div onclick="vflow.goToGame('${g.id}')" class="glass-card p-8 relative ${!g.approved ? 'opacity-70 grayscale' : ''}">
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full uppercase">${g.time}</span>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Org: ${g.createdBy}</span>
                        </div>
                        <h3 class="text-2xl font-black italic text-slate-900 tracking-tighter mb-2">${g.location}</h3>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6">${g.description ? g.description.substring(0,30)+'...' : 'PRO SESSION'}</p>
                        
                        ${(user?.role==='super'||user?.name===g.createdBy) ? `
                        <div class="flex gap-2 border-t border-slate-50 pt-6">
                            ${(user?.role==='super' && !g.approved) ? `<button onclick="event.stopPropagation();vflow.approveGame('${g.id}','${g.location}')" class="flex-1 bg-emerald-500 text-white text-[9px] font-black py-3 rounded-xl uppercase">Approve</button>` : ''}
                            <button onclick="event.stopPropagation();vflow.generateStory('${g.location}', '${g.time}', ${g.maxPlayers}, ${g.price}, '${g.createdBy}')" class="flex-1 bg-slate-900 text-white text-[9px] font-black py-3 rounded-xl uppercase">Story</button>
                            <button onclick="event.stopPropagation();vflow.delGame('${g.id}')" class="flex-1 bg-slate-100 text-slate-400 text-[9px] font-black py-3 rounded-xl uppercase">Delete</button>
                        </div>` : `
                        <div class="flex justify-end">
                            <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center text-white">
                                <i class="fa-solid fa-arrow-right-long"></i>
                            </div>
                        </div>
                        `}
                    </div>`;
                }).join('');
            },

            generateStory: (loc, time, max, price, orgName) => {
                const cvs = document.createElement('canvas'); cvs.width=1080; cvs.height=1920; const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,1080,1920); 
                ctx.textAlign='center'; ctx.fillStyle='white'; ctx.font='italic 900 120px Urbanist'; ctx.fillText('VOLLEYFLOW.',540,350);
                ctx.fillStyle='#6366f1'; ctx.font='900 40px Urbanist'; ctx.fillText(`ORGANIZER: @${orgName}`,540,430);
                ctx.fillStyle='white'; ctx.font='900 90px Urbanist'; ctx.fillText(loc,540,900);
                ctx.font='700 50px Urbanist'; ctx.fillText(time,540,1020);
                ctx.fillStyle='#6366f1'; ctx.font='900 100px Urbanist'; ctx.fillText(`$${price}`,540,1250);
                document.getElementById('story_preview').src = cvs.toDataURL("image/png");
                document.getElementById('story_download_btn').href = cvs.toDataURL("image/png");
                document.getElementById('story_modal').classList.remove('hidden');
            },

            goToGame: (id) => {
                currentView = 'detail'; selectedPositions = [];
                onSnapshot(doc(db, "games", id), (d) => {
                    if(!d.exists()) return; const g = d.data(); const isMgr = user?.role==='super'||user?.name===g.createdBy;
                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-6 flex items-center gap-2 text-slate-400 font-black text-[10px] uppercase tracking-widest"><i class="fa-solid fa-chevron-left"></i> Back to Gallery</button>
                        
                        <div class="glass-card p-10 mb-8 bg-slate-900 text-white relative overflow-hidden">
                            <div class="relative z-10">
                                <h2 class="text-4xl font-black italic mb-4 tracking-tighter">${g.location}</h2>
                                <span class="bg-indigo-600 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">${g.time}</span>
                                ${g.description ? `<p class="mt-8 text-sm font-medium text-slate-400 leading-relaxed">${g.description}</p>` : ''}
                            </div>
                            <i class="fa-solid fa-volleyball absolute -right-10 -bottom-10 text-[200px] opacity-10 rotate-12"></i>
                            ${isMgr ? `<button onclick="vflow.copyWA('${id}','${g.location}','${g.time}', ${g.maxPlayers})" class="mt-8 bg-white text-slate-900 text-[9px] px-6 py-3 rounded-full font-black uppercase shadow-xl">Copy List</button>` : ''}
                        </div>

                        ${isMgr ? `
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="glass-card p-6"><p class="text-[8px] font-black text-slate-400 uppercase mb-1">Received</p><p class="text-2xl font-black text-emerald-500" id="stat-paid">$0</p></div>
                            <div class="glass-card p-6"><p class="text-[8px] font-black text-slate-400 uppercase mb-1">Projection</p><p class="text-2xl font-black text-slate-900" id="stat-profit">$0</p></div>
                        </div>` : ''}

                        <div class="glass-card p-8 mb-8">
                            <div class="flex justify-between items-center mb-8">
                                <span class="font-black italic text-slate-400 text-[11px] uppercase tracking-widest">Entry Registration</span>
                                <span id="p-count" class="text-indigo-600 font-black text-[10px] bg-indigo-50 px-3 py-1.5 rounded-xl">0 / ${g.maxPlayers}</span>
                            </div>
                            
                            <div class="space-y-4 mb-8">
                                <div class="relative">
                                    <input id="nickname" type="text" placeholder="Your Alias" class="input-premium">
                                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-300 uppercase">Nickname</span>
                                </div>
                                <div class="relative">
                                    <input id="ig" type="text" placeholder="@Instagram" class="input-premium">
                                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-300 uppercase">Verification</span>
                                </div>
                            </div>

                            <p class="text-[9px] font-black text-slate-300 uppercase mb-4 text-center tracking-widest text-xs">Select Position (Max 2)</p>
                            <div class="grid grid-cols-1 gap-3 mb-8">
                                ${['Setter (二傳)','Outside Hitter (大搥)','Middle Blocker (快攻)','Opposite (接應)','Libero (自由人)'].map(p=>`<button data-pos="${p}" onclick="vflow.setPos('${p}')" class="pos-btn py-5 text-[10px] font-black uppercase tracking-tight">${p}</button>`).join('')}
                            </div>
                            <button onclick="vflow.prepJoin('${id}', ${g.price}, '${g.location}', '${g.time}', ${g.maxPlayers}, '${g.createdBy}')" class="w-full btn-primary font-black py-6 rounded-[24px] shadow-2xl uppercase text-xs tracking-widest">Register Session $${g.price}</button>
                        </div>

                        <div id="player-list" class="space-y-4 pb-20"></div>
                    `;
                    vflow.listenPlayers(id, isMgr, g.maxPlayers, g.price, g.cost||0);
                });
            },

            listenPlayers: (gid, isMgr, max, price, cost) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const players = []; let paidCount = 0; let mainCount = 0;
                    snap.forEach(d => { const p = {id: d.id, ...d.data()}; players.push(p); if(players.length<=max) mainCount++; if(p.status==='confirmed' && players.length<=max) paidCount++; });
                    if(document.getElementById('p-count')) document.getElementById('p-count').innerText = `${mainCount} / ${max}`;
                    if(isMgr && document.getElementById('stat-paid')) { 
                        document.getElementById('stat-paid').innerText = `$${paidCount * price}`; 
                        document.getElementById('stat-profit').innerText = `$${(mainCount * price) - cost}`; 
                    }
                    if(isMgr) {
                        document.getElementById('player-list').innerHTML = players.map((p, index) => {
                            const isWait = index >= max;
                            const nameTag = p.nickname ? `${p.nickname} (${p.ig})` : p.ig;
                            return `
                            <div class="glass-card p-6 flex justify-between items-center ${isWait ? 'bg-amber-50/50' : ''}">
                                <div>
                                    <p class="font-black text-slate-900 text-sm">${isWait ? 'W'+(index-max+1) : index+1}. ${nameTag}</p>
                                    <div class="flex gap-2 mt-1">
                                        <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded-md bg-slate-100 text-slate-500">${p.pos}</span>
                                        <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded-md ${p.status==='confirmed'?'bg-emerald-100 text-emerald-600':'bg-orange-100 text-orange-600'}">${p.status}</span>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="vflow.confirmP('${gid}','${p.id}')" class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs shadow-sm"><i class="fa-solid fa-check"></i></button>
                                    <button onclick="vflow.delP('${gid}','${p.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-400 flex items-center justify-center text-xs shadow-sm"><i class="fa-solid fa-trash-can"></i></button>
                                    ${p.receipt ? `<button onclick="vflow.viewReceipt('${p.receipt}')" class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs shadow-sm"><i class="fa-solid fa-receipt"></i></button>` : ''}
                                </div>
                            </div>`;
                        }).join('');
                    } else { 
                        document.getElementById('player-list').innerHTML = `<div class="p-10 text-center"><i class="fa-solid fa-lock text-slate-200 text-3xl mb-4"></i><p class="text-[9px] font-black text-slate-300 uppercase tracking-[0.2em]">Roster Privacy Enabled</p></div>`; 
                    }
                });
            },
            
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid) => { if(confirm("Remove Player?")) await deleteDoc(doc(db, `games/${gid}/players`, pid)); },
            addAdminAccount: async () => { const u=document.getElementById('new_admin_u').value.trim(); const p=document.getElementById('new_admin_p').value.trim(); if(!u||!p) return; await setDoc(doc(db, "admins", u), { username:u, password:p, role:'organizer' }); alert("Admin Added"); vflow.loadAdminList(); },
            loadAdminList: async () => { const snap = await getDocs(collection(db, "admins")); let h=""; snap.forEach(d => { if(d.id!=='Manusyip') h+=`<div class="flex justify-between p-3 bg-white rounded-xl mb-2"><span>@${d.id}</span><button onclick="vflow.delAdmin('${d.id}')" class="text-red-500 font-bold">X</button></div>`; }); document.getElementById('admin-list-container').innerHTML=h; },
            delAdmin: async (id) => { if(confirm("Delete Admin?")) await deleteDoc(doc(db, "admins", id)); vflow.loadAdminList(); },
            copyWA: async (gid, loc, time, max) => {
                const snap=await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")));
                let txt=`🏐 *VOLLEYFLOW PRO*\n📍 ${loc}\n⏰ ${time}\n\n`;
                let i=0; snap.forEach(d=>{ 
                    const p=d.data();
                    const nameTag = p.nickname ? `${p.nickname} (${p.ig})` : p.ig;
                    if(i===max) txt+=`\n--- ⏳ WAITING ---\n`; 
                    txt+=`${i>=max?'W'+(i-max+1):i+1}. ${nameTag} (${p.pos}) ${p.status==='confirmed'?'✅':'⏳'}\n`; i++; 
                });
                navigator.clipboard.writeText(txt); alert("List Copied!");
            }
        };

        if (user) { 
            document.getElementById('admin-status').innerHTML = `
                <div class="flex items-center justify-center gap-4">
                    <span class="bg-slate-900 text-white text-[9px] font-black px-4 py-2 rounded-full uppercase tracking-widest shadow-lg shadow-indigo-100">Portal: ${user.name}</span>
                    <button onclick="sessionStorage.clear();location.reload();" class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Logout</button>
                </div>`; 
            document.getElementById('admin-panel').classList.remove('hidden'); 
            if(user.role==='super') { document.getElementById('super-admin-tools').classList.remove('hidden'); vflow.loadAdminList(); } 
        }
        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => { const games=[]; snap.forEach(d=>games.push({id:d.id, ...d.data()})); if(currentView==='list') vflow.renderList(games); });
    </script>
</body>
</html>
