<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VolleyballFlow | 專業排球平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body{background:#fff;color:#1a1a1a;font-family:'Urbanist',sans-serif;-webkit-tap-highlight-color:transparent}
        .premium-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;transition:all .25s ease;position:relative;z-index:1}
        .btn-black{background:#000;color:#fff;border-radius:8px;font-weight:600;letter-spacing:1px;transition:all .2s;display:flex;align-items:center;justify-content:center}
        .btn-black:active{transform:scale(.98)}
        .btn-outline{border:1px solid #e5e5e5;border-radius:8px;font-weight:600;transition:all .2s}
        .btn-outline.selected{background:#000;color:#fff;border-color:#000}
        .input-flat{width:100%;border:1px solid #e5e5e5;padding:14px;border-radius:8px;font-size:14px;outline:none;transition:all .2s;background:#fff}
        .input-flat:focus{border-color:#000}
        #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#000;color:#fff;padding:12px 24px;border-radius:50px;font-size:12px;font-weight:600;letter-spacing:1px;z-index:5000;transition:transform .4s cubic-bezier(.17,.67,.83,.67);box-shadow:0 10px 30px rgba(0,0,0,.2)}
        #toast.show{transform:translateX(-50%) translateY(0)}
        .bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);z-index:1000;padding:30px 20px}
        .bottom-sheet.open{transform:translateY(0)}
        .section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:#a3a3a3}
    </style>
</head>
<body class="p-6 pb-24">
    <div id="toast">MESSAGE</div>
    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-16 mt-8">
            <h1 class="text-3xl font-extrabold tracking-tighter leading-none">VOLLEYBALL<br><span class="text-indigo-600">FLOW.</span></h1>
            <p class="section-title mt-4">HONG KONG VOLLEYBALL COMMUNITY</p>
        </header>

        <div id="main-content" class="space-y-8"></div>
    </div>

    <div id="sheet-overlay" class="fixed inset-0 bg-black/40 opacity-0 pointer-events-none transition-opacity z-[999]" onclick="vflow.closeSheet()"></div>
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="max-w-md mx-auto relative z-10">
            <div class="flex justify-between items-center mb-10"><h3 class="text-xl font-bold tracking-tighter uppercase">Register</h3><span class="text-2xl font-light" id="sheet-price">$0</span></div>
            <div class="flex gap-4 border-b border-gray-100 pb-8 mb-8"><button id="tab-payme" onclick="vflow.switchPayTab('payme')" class="text-[10px] font-extrabold border-b-2 border-black pb-1">PAYME</button><button id="tab-alipay" onclick="vflow.switchPayTab('alipay')" class="text-[10px] font-extrabold text-gray-300 pb-1">ALIPAY</button></div>
            <div id="content-payme" class="mb-10 text-center"></div><div id="content-alipay" class="hidden mb-10 text-center"></div>
            <div class="space-y-6">
                <div><label class="section-title block mb-3">Receipt Screenshot</label><div class="border border-dashed border-gray-200 rounded-lg p-8 text-center relative hover:bg-gray-50 cursor-pointer bg-white/80 backdrop-blur"><input type="file" id="receipt_input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="vflow.previewReceipt(this)"><div id="receipt_placeholder" class="text-gray-400 text-xs font-medium">Tap to upload receipt</div><img id="receipt_thumbnail" src="" class="hidden h-32 mx-auto rounded relative z-10"></div></div>
                <button id="btn-submit-reg" onclick="vflow.executeJoin()" class="w-full btn-black py-4 uppercase text-xs opacity-30 pointer-events-none">Confirm Submission</button>
                <button vflow.closeSheet() class="w-full text-gray-300 text-[10px] uppercase font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0", authDomain: "volleyballflow-7cf02.firebaseapp.com", projectId: "volleyballflow-7cf02", storageBucket: "volleyballflow-7cf02.firebasestorage.app", messagingSenderId: "1032620495700", appId: "1:1032620495700:web:c2d84f02e435d99e15eec1" };
        const app = initializeApp(firebaseConfig); 
        const db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };

        const $ = id => document.getElementById(id);
        let selectedPositions = []; let tempJoinData = null;

        window.vflow = {
            sendTG: async (msg) => { try { await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage?chat_id=${TG_CONFIG.chatId}&text=${encodeURIComponent(msg)}&parse_mode=HTML`); } catch(e){} },
            showToast: (msg, isError = false) => { const t = $('toast'); t.innerText = msg; t.style.background = isError ? '#ef4444' : '#000'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); },
            compressImg: (file) => new Promise(resolve => { const r = new FileReader(); r.onload = e => { const img = new Image(); img.onload = () => { const cvs = document.createElement('canvas'); const max = 800; const scale = img.width > max ? max / img.width : 1; cvs.width = img.width * scale; cvs.height = img.height * scale; const ctx = cvs.getContext('2d'); ctx.drawImage(img, 0, 0, cvs.width, cvs.height); resolve(cvs.toDataURL('image/jpeg', 0.6)); }; img.src = e.target.result; }; r.readAsDataURL(file); }),
            openSheet: () => { $('bottom-sheet').classList.add('open'); $('sheet-overlay').classList.replace('opacity-0','opacity-100'); $('sheet-overlay').classList.replace('pointer-events-none','pointer-events-auto'); },
            closeSheet: () => { $('bottom-sheet').classList.remove('open'); $('sheet-overlay').classList.replace('opacity-100','opacity-0'); $('sheet-overlay').classList.replace('pointer-events-auto','pointer-events-none'); },
            renderList: (games) => {
                const container = $('main-content');
                const activeGames = games.filter(g => g.approved);
                if(activeGames.length===0) { container.innerHTML = `<p class="section-title text-center py-20">No active events</p>`; return; }
                container.innerHTML = activeGames.map(g => `<div onclick="vflow.goToGame('${g.id}')" class="premium-card p-8"><div class="mb-10 text-indigo-600 font-extrabold text-[14px] uppercase tracking-wider">${g.time}</div><h3 class="text-2xl font-extrabold tracking-tight uppercase">${g.location}</h3></div>`).join('');
            },
            goToGame: (id) => {
                onSnapshot(doc(db, "games", id), (d) => {
                    if(!d.exists()) return; const g = d.data(); tempJoinData = { ...tempJoinData, location: g.location };
                    $('main-content').innerHTML = `<button onclick="location.reload()" class="section-title mb-10 flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Gallery</button><h2 class="text-4xl font-extrabold tracking-tighter mb-4 uppercase">${g.location}</h2><div class="flex justify-between mb-12"><div class="text-indigo-600 font-extrabold text-[14px]">${g.time}</div><span id="p-count" class="text-xs font-bold">...</span></div><div class="premium-card p-8 mb-12"><div class="relative z-10"><input id="nickname" type="text" placeholder="NICKNAME" class="input-flat mb-4"><input id="ig" type="text" placeholder="IG (必須有@)" class="input-flat mb-8"><div class="space-y-2 mb-8">${['Setter (二傳)','Outside Hitter (大搥)','Middle Blocker (快攻)','Opposite (接應)','Libero (自由人)'].map(p=>`<button data-pos="${p}" onclick="vflow.setPos('${p}')" class="pos-btn btn-outline w-full py-4 text-[10px] uppercase bg-white">${p}</button>`).join('')}</div><button onclick="vflow.prepJoin('${id}', ${g.price}, '${g.createdBy}')" class="w-full btn-black py-5 uppercase text-xs">Join $${g.price}</button></div></div><div id="player-list" class="space-y-4 pb-20"></div>`;
                    onSnapshot(query(collection(db, `games/${id}/players`), orderBy("timestamp", "asc")), (snap) => {
                        if($('p-count')) $('p-count').innerText = `${snap.size} / ${g.maxPlayers}`;
                        $('player-list').innerHTML = `<p class="section-title text-center py-10">Private List</p>`;
                    });
                });
            },
            setPos: (p) => {
                const idx = selectedPositions.indexOf(p); if(idx>-1) selectedPositions.splice(idx,1); else { if(selectedPositions.length>=2) return; selectedPositions.push(p); }
                document.querySelectorAll('.pos-btn').forEach(btn => btn.classList.toggle('selected', selectedPositions.includes(btn.getAttribute('data-pos'))));
            },
            switchPayTab: (t) => {
                const isP = t==='payme'; $('content-payme').classList.toggle('hidden', !isP); $('content-alipay').classList.toggle('hidden', isP);
                $('tab-payme').className = isP ? 'text-[10px] font-extrabold border-b-2 border-black pb-1' : 'text-[10px] font-extrabold text-gray-300 pb-1';
                $('tab-alipay').className = !isP ? 'text-[10px] font-extrabold border-b-2 border-black pb-1' : 'text-[10px] font-extrabold text-gray-300 pb-1';
            },
            previewReceipt: (input) => {
                if(input.files && input.files[0]) { $('receipt_placeholder').classList.add('hidden'); const thumb = $('receipt_thumbnail'); thumb.src = URL.createObjectURL(input.files[0]); thumb.classList.remove('hidden'); $('btn-submit-reg').classList.remove('opacity-30','pointer-events-none'); }
            },
            prepJoin: async (gid, pr, org) => {
                const ig = $('ig').value.trim(); const nick = $('nickname').value.trim();
                if(!nick || !ig.startsWith('@') || selectedPositions.length===0) { vflow.showToast("資料錯誤", true); return; }
                const adminDoc = await getDoc(doc(db, "admins", org)); const orgData = adminDoc.data() || {};
                $('content-payme').innerHTML = orgData.payUrl ? `<a href="${orgData.payUrl}" target="_blank" class="flex items-center justify-center w-full bg-[#E02443] text-white rounded-lg py-4 text-xs font-bold"><i class="fa-solid fa-link mr-2"></i> PayMe 付款</a>` : '<p class="text-xs py-4">未設定 PayMe</p>';
                $('content-alipay').innerHTML = orgData.payImg ? `<img src="${orgData.payImg}" class="w-48 mx-auto rounded-lg">` : '<p class="text-xs py-4">未設定 Alipay</p>';
                $('sheet-price').innerText = `$${pr}`; tempJoinData = { ...tempJoinData, gid, ig, nickname: nick, pos: selectedPositions.join(' & '), org }; vflow.openSheet();
            },
            executeJoin: async () => {
                const file = $('receipt_input').files[0]; if(!file) return;
                const base64Img = await vflow.compressImg(file);
                await addDoc(collection(db, `games/${tempJoinData.gid}/players`), { ...tempJoinData, status: "pending", receipt: base64Img, timestamp: serverTimestamp() });
                vflow.sendTG(`🔔 <b>新報名</b>\n場地：${tempJoinData.location}\n球員：${tempJoinData.nickname}`); vflow.showToast("報名成功！"); setTimeout(() => location.reload(), 2000);
            }
        };

        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => { 
            const games=[]; snap.forEach(d=>games.push({id:d.id, ...d.data()})); 
            vflow.renderList(games); 
        });
    </script>
</body>
</html>
