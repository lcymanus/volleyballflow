<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VolleyballFlow 2026 Pro | 全功能終極版</title>
    
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { background: #f4f7f6; color: #0f172a; font-family: 'Urbanist', sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 3000; }
        .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #ffffff; color: #0f172a; border-top-left-radius: 32px; border-top-right-radius: 32px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); z-index: 1000; padding: 32px; max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .pos-btn { transition: all 0.2s; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; }
        .pos-selected { background: #4f46e5 !important; color: #ffffff !important; border-color: #4f46e5 !important; font-weight: 900; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .input-light { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 16px; font-size: 14px; outline: none; color: #0f172a; transition: all 0.2s; }
        .input-light:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="p-5 pb-24">

    <div id="app-root" class="max-w-md mx-auto">
        <header class="mb-10 text-center relative z-10 pt-4">
            <h1 onclick="vflow.clickSecret()" class="text-4xl font-black italic tracking-tighter text-slate-900 leading-none cursor-pointer select-none">VOLLEYFLOW<span class="text-indigo-600">.</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em] mt-3">Professional Ecosystem</p>
            <div id="admin-status" class="mt-6"></div>
        </header>

        <div id="admin-panel" class="hidden space-y-6 mb-12">
            <div id="super-admin-tools" class="hidden glass-card p-6 border-red-200 bg-red-50">
                <h3 class="text-xs font-black uppercase text-red-600 tracking-widest mb-4">👑 Super Admin Tools</h3>
                <div class="flex gap-2 mb-4">
                    <input id="new_admin_u" type="text" placeholder="搞手帳號" class="flex-1 bg-white border border-red-200 p-3 rounded-xl text-xs outline-none">
                    <input id="new_admin_p" type="text" placeholder="密碼" class="flex-1 bg-white border border-red-200 p-3 rounded-xl text-xs outline-none">
                    <button onclick="vflow.addAdminAccount()" class="bg-red-500 text-white px-4 rounded-xl text-[10px] font-black">Add</button>
                </div>
                <div id="admin-list-container" class="space-y-2 mt-4 border-t border-red-200 pt-4"></div>
            </div>

            <div class="glass-card p-6">
                <h3 class="text-[11px] font-black uppercase text-slate-500 tracking-widest mb-4">收款設定 Payment Methods</h3>
                <div class="space-y-4">
                    <input id="pay_url_input" type="text" placeholder="PayMe 連結" class="input-light">
                    <button onclick="vflow.updatePayUrl()" class="w-full bg-indigo-600 text-white p-3 rounded-xl text-[10px] font-black uppercase shadow-md">儲存 PayMe 連結</button>
                </div>
            </div>

            <div class="glass-card p-8 bg-gradient-to-br from-white to-slate-50 border-2 border-indigo-100">
                <h3 class="text-sm font-black uppercase text-slate-800 tracking-tighter mb-6">Create New Game 🏐</h3>
                <div class="space-y-4">
                    <input id="new_loc" type="text" placeholder="體育館名稱" class="input-light">
                    
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">日期 Date</label>
                        <input id="new_date" type="date" class="input-light text-slate-600">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">開始時間 (刮輪)</label>
                            <input id="start_time" type="time" value="19:00" class="input-light text-slate-600">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">完場時間 (刮輪)</label>
                            <input id="end_time" type="time" value="21:00" class="input-light text-slate-600">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">場地描述 Description</label>
                        <textarea id="new_desc" placeholder="例如：1號場，中級賽，不准飛機..." class="input-light h-24"></textarea>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white p-3 rounded-2xl border border-slate-200"><label class="text-[9px] font-bold text-slate-400 uppercase block">名額</label><input id="new_max" type="number" value="15" class="bg-transparent text-slate-800 w-full outline-none font-black text-lg"></div>
                        <div class="bg-white p-3 rounded-2xl border border-slate-200"><label class="text-[9px] font-bold text-slate-400 uppercase block">收費</label><input id="new_price" type="number" value="30" class="bg-transparent text-slate-800 w-full outline-none font-black text-lg"></div>
                        <div class="bg-red-50 p-3 rounded-2xl border border-red-100"><label class="text-[9px] font-bold text-red-500 uppercase block">場租</label><input id="new_cost" type="number" value="0" class="bg-transparent text-red-600 w-full outline-none font-black text-lg"></div>
                    </div>
                    <button onclick="vflow.createGame()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">發布場次</button>
                </div>
            </div>
        </div>

        <div id="main-content" class="relative z-10 space-y-5"></div>
        
        <div id="login_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[3000]"><div class="glass-card w-full max-w-xs p-8 text-center bg-white"><h3 class="font-black italic text-slate-800 mb-6 uppercase text-xl">Login</h3><input id="login_u" type="text" placeholder="Username" class="input-light mb-3"><input id="login_p" type="password" placeholder="Password" class="input-light mb-6"><div class="flex gap-3"><button onclick="vflow.closeLogin()" class="flex-1 bg-slate-100 font-black py-3 rounded-xl text-xs uppercase">Cancel</button><button onclick="vflow.login()" class="flex-1 bg-indigo-600 text-white font-black py-3 rounded-xl text-xs uppercase">Login</button></div></div></div>
        <div id="story_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-6 z-[2000]"><div class="bg-white w-full max-w-sm p-6 rounded-[32px] shadow-2xl border border-slate-100 text-center"><h3 class="text-slate-800 font-black uppercase mb-4 tracking-widest">Post Ready! 📸</h3><img id="story_preview" src="" class="w-full rounded-2xl mb-6 shadow-md border border-slate-100"><a id="story_download_btn" href="#" download="story.png" class="block w-full bg-indigo-600 text-white text-center font-black py-4 rounded-2xl shadow-lg uppercase tracking-widest text-xs mb-2">下載宣傳圖</a><button onclick="document.getElementById('story_modal').classList.add('hidden')" class="w-full text-slate-400 font-bold py-2 text-[10px] uppercase">取消</button></div></div>
        <div id="receipt_modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-[4000]" onclick="this.classList.add('hidden')"><img id="receipt_display_img" src="" class="max-w-full max-h-[80vh] rounded-2xl shadow-2xl bg-slate-900 border-4 border-white"></div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay" onclick="vflow.closeSheet()"></div>
    <div id="bottom-sheet" class="bottom-sheet flex flex-col">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <div id="sheet-content" class="mb-6"></div>
        <div class="mt-4 pt-4 border-t border-slate-100">
            <label class="text-[11px] font-black text-slate-800 uppercase block mb-3 text-center">📸 上傳收據 Confirm Payment</label>
            <input type="file" id="receipt_input" accept="image/*" class="w-full text-xs" onchange="vflow.previewReceipt(this)">
            <button id="btn-submit-reg" onclick="vflow.executeJoin()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl mt-4 opacity-50" disabled>確認報名</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs, where, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0", authDomain: "volleyballflow-7cf02.firebaseapp.com", projectId: "volleyballflow-7cf02", storageBucket: "volleyballflow-7cf02.firebasestorage.app", messagingSenderId: "1032620495700", appId: "1:1032620495700:web:c2d84f02e435d99e15eec1" };
        const app = initializeApp(firebaseConfig); 
        const db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });
        const TG_CONFIG = { token: "8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM", chatId: "6503453177" };

        let user = JSON.parse(sessionStorage.getItem('vf_user')); 
        let currentView = 'list'; let selectedPositions = []; let secretClicks = 0; let tempJoinData = null;

        window.vflow = {
            sendTG: async (msg) => { try { await fetch(`https://api.telegram.org/bot${TG_CONFIG.token}/sendMessage?chat_id=${TG_CONFIG.chatId}&text=${encodeURIComponent(msg)}`); } catch(e){} },
            compressImg: (file) => new Promise(resolve => { const r = new FileReader(); r.onload = e => { const img = new Image(); img.onload = () => { const cvs = document.createElement('canvas'); const max = 800; const scale = img.width > max ? max / img.width : 1; cvs.width = img.width * scale; cvs.height = img.height * scale; const ctx = cvs.getContext('2d'); ctx.drawImage(img, 0, 0, cvs.width, cvs.height); resolve(cvs.toDataURL('image/jpeg', 0.6)); }; img.src = e.target.result; }; r.readAsDataURL(file); }),
            
            clickSecret: () => { secretClicks++; if(secretClicks===4){ document.getElementById('login_modal').classList.remove('hidden'); secretClicks=0; } setTimeout(()=>secretClicks=0, 3000); },
            closeLogin: () => document.getElementById('login_modal').classList.add('hidden'),
            login: async () => {
                const u = document.getElementById('login_u').value.trim(); const p = document.getElementById('login_p').value.trim();
                if(u==="Manusyip" && p==="Manusyip0830") { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'super'})); location.reload(); return; }
                const snap = await getDocs(query(collection(db, "admins"), where("username", "==", u), where("password", "==", p)));
                if(!snap.empty) { sessionStorage.setItem('vf_user', JSON.stringify({name:u, role:'normal'})); location.reload(); } else alert("帳號密碼錯誤");
            },

            // 發布場次 (滑輪 + 描述)
            createGame: async () => {
                const isSuper = user?.role === 'super';
                const loc = document.getElementById('new_loc').value.trim();
                const dateVal = document.getElementById('new_date').value;
                const sT = document.getElementById('start_time').value;
                const eT = document.getElementById('end_time').value;
                const desc = document.getElementById('new_desc').value.trim();
                if(!loc || !dateVal) return alert("填好地點同日期");

                const weekDay = ["日","一","二","三","四","五","六"][new Date(dateVal).getDay()];
                const fullLoc = loc.includes("體育館") ? loc : `${loc}體育館`;
                const fullTime = `${dateVal} (${weekDay}) ${sT} - ${eT}`;

                await addDoc(collection(db, "games"), {
                    location: fullLoc, time: fullTime, description: desc,
                    maxPlayers: parseInt(document.getElementById('new_max').value),
                    price: parseInt(document.getElementById('new_price').value),
                    cost: parseInt(document.getElementById('new_cost').value || 0),
                    createdBy: user.name, approved: isSuper, timestamp: serverTimestamp()
                });

                if(isSuper) vflow.sendTG(`🆕 新場次！\n📍 ${fullLoc}\n⏰ ${fullTime}\n📝 ${desc}`);
                alert("已成功發佈！"); location.reload();
            },

            approveGame: async (id, loc) => { await updateDoc(doc(db, "games", id), { approved: true }); vflow.sendTG(`✅ 場次已批准：${loc}`); alert("已上架！"); },
            delGame: async (id) => { if(confirm("刪除場次？")) await deleteDoc(doc(db, "games", id)); },

            renderList: (games) => {
                const container = document.getElementById('main-content');
                container.innerHTML = games.map(g => {
                    if(!g.approved && user?.role !== 'super' && user?.name !== g.createdBy) return '';
                    return `
                    <div onclick="vflow.goToGame('${g.id}')" class="glass-card p-6 relative ${!g.approved ? 'bg-amber-50 border-amber-200' : ''}">
                        <p class="text-[10px] font-black text-indigo-600 uppercase mb-2">${g.time}</p>
                        <h3 class="text-xl font-black italic text-slate-800">${g.location} ${!g.approved ? '⚠️' : ''}</h3>
                        ${g.description ? `<p class="text-[10px] text-slate-400 mt-2 line-clamp-1 italic">${g.description}</p>` : ''}
                        ${(user?.role==='super' || user?.name===g.createdBy) ? `
                        <div class="mt-4 flex gap-2 border-t pt-4">
                            ${(user?.role==='super' && !g.approved) ? `<button onclick="event.stopPropagation();vflow.approveGame('${g.id}','${g.location}')" class="flex-1 bg-amber-500 text-white text-[9px] font-black py-2 rounded-lg uppercase">Approve</button>` : ''}
                            <button onclick="event.stopPropagation();vflow.generateStory('${g.location}','${g.time}',${g.maxPlayers},${g.price},'${g.createdBy}')" class="flex-1 bg-indigo-50 text-indigo-600 text-[9px] font-black py-2 rounded-lg uppercase">Story</button>
                            <button onclick="event.stopPropagation();vflow.delGame('${g.id}')" class="flex-1 bg-red-50 text-red-500 text-[9px] font-black py-2 rounded-lg uppercase">Delete</button>
                        </div>` : ''}
                    </div>`;
                }).join('');
            },

            goToGame: (id) => {
                currentView = 'detail'; selectedPositions = [];
                onSnapshot(doc(db, "games", id), async (d) => {
                    if(!d.exists()) return; const g = d.data();
                    const isMgr = user?.role==='super' || user?.name===g.createdBy;
                    const adminDoc = await getDoc(doc(db, "admins", g.createdBy));
                    const payUrl = adminDoc.data()?.payUrl || "";

                    document.getElementById('main-content').innerHTML = `
                        <button onclick="location.reload()" class="mb-4 text-indigo-600 font-black text-xs uppercase underline">← Back</button>
                        <div class="glass-card p-8 bg-indigo-600 text-white mb-6 relative">
                            <h2 class="text-2xl font-black italic mb-1">${g.location}</h2>
                            <p class="text-xs opacity-80 font-bold mb-4">${g.time}</p>
                            ${g.description ? `<div class="bg-white/10 p-4 rounded-xl text-[11px] border border-white/20 whitespace-pre-wrap">${g.description}</div>` : ''}
                            ${isMgr ? `<button onclick="vflow.copyWA('${id}','${g.location}','${g.time}',${g.maxPlayers})" class="absolute right-4 top-4 bg-white/20 p-2 rounded-lg text-[9px] font-black uppercase">Copy WA</button>` : ''}
                        </div>
                        <div class="glass-card p-8 mb-6">
                            <input id="ig" type="text" placeholder="@Instagram" class="input-light mb-4 text-center font-black">
                            <div class="grid grid-cols-1 gap-2 mb-6">${['Setter','Outside','Middle','Opposite','Libero'].map(p=>`<button onclick="vflow.setPos('${p}')" data-pos="${p}" class="pos-btn py-3 rounded-xl text-[10px] font-black uppercase">${p}</button>`).join('')}</div>
                            <button onclick="vflow.prepJoin('${id}',${g.price},'${g.location}','${payUrl}')" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl uppercase text-xs">報名 $${g.price}</button>
                        </div>
                        <div id="player-list" class="space-y-3 pb-10"></div>
                    `;
                    vflow.listenPlayers(id, isMgr, g.maxPlayers, g.price, g.cost);
                });
            },

            listenPlayers: (gid, isMgr, max, price, cost) => {
                onSnapshot(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc")), (snap) => {
                    const list = document.getElementById('player-list');
                    if(!isMgr) { list.innerHTML = `<p class="text-center text-slate-400 text-[10px] font-black py-10 uppercase tracking-widest">List Protected 🔒</p>`; return; }
                    let h = ""; let i = 1; let paidTotal = 0;
                    snap.forEach(d => {
                        const p = d.data(); if(p.status==='confirmed' && i<=max) paidTotal += price;
                        h += `<div class="glass-card p-4 flex justify-between items-center ${i > max ? 'bg-amber-50' : ''}">
                                <div><p class="font-black text-sm">${i}. ${p.ig} ${(p.noShowCount>0)?'<span class="text-red-500 text-[8px] animate-pulse-soft">⚠️ 飛機底</span>':''}</p><p class="text-[9px] font-black ${p.status==='confirmed'?'text-emerald-500':'text-orange-500'} uppercase">${p.pos} | ${p.status}</p></div>
                                <div class="flex gap-1">
                                    <button onclick="vflow.confirmP('${gid}','${d.id}')" class="bg-emerald-50 text-emerald-600 p-2 rounded-lg text-[8px] font-black uppercase">Confirm</button>
                                    <button onclick="vflow.markNoShow('${p.ig}')" class="bg-red-50 text-red-500 p-2 rounded-lg text-[8px] font-black uppercase">黑名單</button>
                                    ${p.receipt ? `<button onclick="vflow.viewReceipt('${p.receipt}')" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg text-[8px] font-black uppercase">收據</button>` : ''}
                                    <button onclick="vflow.delP('${gid}','${d.id}')" class="bg-slate-100 text-slate-400 p-2 rounded-lg text-[8px] font-black uppercase">踢</button>
                                </div>
                              </div>`;
                        i++;
                    });
                    list.innerHTML = (isMgr ? `<div class="text-[10px] font-black uppercase text-slate-400 mb-2 px-2 flex justify-between"><span>Profit: $${(Math.min(i-1,max)*price)-cost}</span><span>Paid: $${paidTotal}</span></div>` : '') + h;
                });
            },

            // 其他功能邏輯
            setPos: (p) => { const idx = selectedPositions.indexOf(p); if(idx>-1) selectedPositions.splice(idx,1); else { if(selectedPositions.length>=2) return; selectedPositions.push(p); } document.querySelectorAll('.pos-btn').forEach(btn => btn.classList.toggle('pos-selected', selectedPositions.includes(btn.getAttribute('data-pos')))); },
            confirmP: async (gid, pid) => await updateDoc(doc(db, `games/${gid}/players`, pid), { status: "confirmed" }),
            delP: async (gid, pid) => { if(confirm("踢人？")) await deleteDoc(doc(db, `games/${gid}/players`, pid)); },
            markNoShow: async (ig) => { const ref = doc(db, "blacklists", ig.toLowerCase()); await setDoc(ref, { ig: ig.toLowerCase(), count: increment(1) }, { merge: true }); alert("已標記！"); },
            
            prepJoin: (gid, pr, loc, payUrl) => {
                const ig = document.getElementById('ig').value.trim(); if(!ig.startsWith('@')) return alert("輸入 @IG");
                tempJoinData = { gid, pr, loc, ig, pos: selectedPositions.join('&') };
                document.getElementById('sheet-content').innerHTML = `<h3 class="text-xl font-black text-center">${loc}</h3><p class="text-center font-bold text-indigo-600 mb-4">$${pr}</p><a href="${payUrl}" target="_blank" class="block w-full bg-[#E51B5C] text-white text-center font-black py-4 rounded-xl text-xs">開啟 PayMe 付款</a>`;
                vflow.openSheet();
            },
            
            executeJoin: async () => {
                const btn = document.getElementById('btn-submit-reg'); btn.innerText = "上傳中..."; btn.disabled = true;
                const b64 = await vflow.compressImg(document.getElementById('receipt_input').files[0]);
                const bl = await getDoc(doc(db, "blacklists", tempJoinData.ig.toLowerCase()));
                await addDoc(collection(db, `games/${tempJoinData.gid}/players`), { ...tempJoinData, receipt: b64, status: 'pending', noShowCount: bl.exists() ? bl.data().count : 0, timestamp: serverTimestamp() });
                vflow.sendTG(`📩 收到報名：${tempJoinData.ig} (${tempJoinData.loc})`);
                alert("已提交！"); location.reload();
            },

            generateStory: (loc, time, max, price, org) => { /* 同原本產生成 Story 邏輯... */ const cv=document.createElement('canvas'); cv.width=1080; cv.height=1920; const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,1080,1920); ctx.fillStyle='#0f172a'; ctx.font='italic 900 100px sans-serif'; ctx.textAlign='center'; ctx.fillText('VOLLEYFLOW.',540,300); ctx.font='700 80px sans-serif'; ctx.fillText(loc,540,800); ctx.font='400 50px sans-serif'; ctx.fillText(time,540,920); ctx.fillStyle='#4f46e5'; ctx.font='900 80px sans-serif'; ctx.fillText(`$${price} | @${org}`,540,1100); document.getElementById('story_preview').src=cv.toDataURL(); document.getElementById('story_download_btn').href=cv.toDataURL(); document.getElementById('story_modal').classList.remove('hidden'); },
            copyWA: async (gid, loc, time, max) => { const s = await getDocs(query(collection(db, `games/${gid}/players`), orderBy("timestamp", "asc"))); let t=`🏐 *${loc}*\n⏰ ${time}\n\n`; let i=1; s.forEach(d=>{ const p=d.data(); t+=`${i==max+1?'\n---⏳ 後補---\n':''}${i}. ${p.ig} (${p.pos})\n`; i++; }); navigator.clipboard.writeText(t); alert("名單已複製！"); },
            
            closeSheet: () => { document.getElementById('bottom-sheet').classList.remove('open'); document.getElementById('sheet-overlay').classList.remove('open'); },
            openSheet: () => { document.getElementById('bottom-sheet').classList.add('open'); document.getElementById('sheet-overlay').classList.add('open'); },
            previewReceipt: (i) => { if(i.files[0]) { document.getElementById('btn-submit-reg').disabled = false; document.getElementById('btn-submit-reg').classList.remove('opacity-50'); } },
            viewReceipt: (b64) => { document.getElementById('receipt_display_img').src = b64; document.getElementById('receipt_modal').classList.remove('hidden'); },
            updatePayUrl: async () => { await setDoc(doc(db, "admins", user.name), { payUrl: document.getElementById('pay_url_input').value }, { merge: true }); alert("已更新！"); },
            addAdminAccount: async () => { const u=document.getElementById('new_admin_u').value.trim(); const p=document.getElementById('new_admin_p').value.trim(); if(u&&p) await setDoc(doc(db, "admins", u), { username:u, password:p, role:'normal' }); vflow.loadAdminList(); },
            loadAdminList: async () => { const s = await getDocs(collection(db, "admins")); let h=""; s.forEach(d=>{ if(d.id!=='Manusyip') h+=`<div class="flex justify-between p-2 text-[10px]"><span>@${d.id}</span><button onclick="vflow.delAdmin('${d.id}')" class="text-red-500">Del</button></div>`; }); document.getElementById('admin-list-container').innerHTML=h; },
            delAdmin: async (id) => { if(confirm("Del?")) await deleteDoc(doc(db, "admins", id)); vflow.loadAdminList(); }
        };

        // 初始化
        document.getElementById('new_date').valueAsDate = new Date();
        if (user) {
            document.getElementById('admin-status').innerHTML = `<span class="bg-indigo-50 text-indigo-700 text-[10px] font-black px-4 py-2 rounded-full uppercase tracking-widest">Organizer: ${user.name}</span><button onclick="sessionStorage.clear();location.reload();" class="ml-4 text-[9px] font-black text-slate-400">LOGOUT</button>`;
            document.getElementById('admin-panel').classList.remove('hidden');
            if(user.role==='super') { document.getElementById('super-admin-tools').classList.remove('hidden'); vflow.loadAdminList(); }
        }

        onSnapshot(query(collection(db, "games"), orderBy("timestamp", "desc")), (snap) => {
            const gs = []; snap.forEach(d => gs.push({id:d.id, ...d.data()}));
            if(currentView==='list') vflow.renderList(gs);
        });
    </script>
</body>
</html>
