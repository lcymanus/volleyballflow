<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolleyballFlow Ultimate V10.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gradient { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: all 0.3s; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .admin-card { border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="min-h-screen pb-20">

<div id="app">
    <!-- Header -->
    <header class="glass sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-400 italic tracking-tighter">VOLLEYBALLFLOW <span class="text-xs text-slate-500 not-italic">V10.0</span></h1>
            <div id="userStatus" class="text-sm"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-8" id="mainArea"></main>
</div>

<script>
    // ==========================================
    // 1. 核心配置 (已填妥老細資料)
    // ==========================================
    const TELEGRAM_TOKEN = '8740891593:AAENShXduM8xMG1RMzKGGrO2L0exDQ_rPbM'; 
    const CHAT_ID = '6503453177'; 
    const SUPER_USER = 'Manusyip';
    const SUPER_PASS = 'Manusyip0830';
    const COMMISSION_RATE = 3; 

    // 數據初始化
    let games = JSON.parse(localStorage.getItem('vbf_games')) || [];
    let admins = JSON.parse(localStorage.getItem('vbf_admins')) || [
        { name: 'Manusyip', pass: 'Manusyip0830', role: 'SUPER', payment: 'PayMe 98765432' }
    ];
    let currentUser = null;

    // ==========================================
    // 2. 通訊與自動化邏輯
    // ==========================================
    async function sendTG(msg) {
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`;
        try { await fetch(url); } catch (e) {}
    }

    function checkAutoKick() {
        const now = Date.now();
        let changed = false;
        games.forEach(game => {
            game.players = game.players.filter(p => {
                if (p.status === 'PENDING' && (now - p.regTime > 20 * 60 * 1000)) {
                    sendTG(`⚠️ VolleyballFlow 逾時自動釋放：\n場次：${game.date}\n球員：${p.igName}`);
                    changed = true;
                    return false;
                }
                return true;
            });
        });
        if (changed) save();
    }
    setInterval(checkAutoKick, 60000); // 每分鐘巡邏

    function save() {
        localStorage.setItem('vbf_games', JSON.stringify(games));
        localStorage.setItem('vbf_admins', JSON.stringify(admins));
        render();
    }

    // ==========================================
    // 3. 界面渲染大腦
    // ==========================================
    function render() {
        const main = document.getElementById('mainArea');
        const status = document.getElementById('userStatus');

        if (!currentUser) {
            status.innerHTML = `<button onclick="renderLogin()" class="text-blue-400">Admin Login</button>`;
            renderHome(main);
        } else if (currentUser.role === 'SUPER') {
            status.innerHTML = `<span class="text-green-400 mr-2">King Manusyip</span><button onclick="logout()" class="text-red-400">Logout</button>`;
            renderSuperDashboard(main);
        } else {
            status.innerHTML = `<span>Admin: ${currentUser.name}</span><button onclick="logout()" class="text-red-400 ml-2">Logout</button>`;
            renderAdminPanel(main);
        }
    }

    function renderHome(el) {
        el.innerHTML = `
            <div class="glass p-8 rounded-3xl text-center mb-8">
                <h2 class="text-3xl font-bold mb-2 italic">🏐 排球王國・隨時開波</h2>
                <p class="text-slate-400 text-sm">報名後請於 20 分鐘內入數，否則系統會自動釋放名額。</p>
            </div>
            <div class="grid gap-6 md:grid-cols-2">
                ${games.length === 0 ? '<p class="col-span-2 text-center text-slate-500 py-10">目前未有場次，請聯繫 Admin 開場。</p>' : 
                games.map(g => `
                    <div class="glass p-6 rounded-2xl admin-card">
                        <div class="flex justify-between mb-4">
                            <div>
                                <h3 class="text-xl font-bold">${g.date}</h3>
                                <p class="text-xs text-slate-400">${g.venue}</p>
                            </div>
                            <span class="text-blue-400 font-bold">$${g.price}</span>
                        </div>
                        <div class="space-y-2 mb-6">
                            <div class="flex justify-between text-xs"><span>名額</span><span>${g.players.length}/${g.maxSize}</span></div>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full"><div class="bg-blue-500 h-full rounded-full" style="width: ${(g.players.length/g.maxSize)*100}%"></div></div>
                        </div>
                        <button onclick="handleJoin('${g.id}')" class="w-full btn-gradient py-3 rounded-xl font-bold text-sm">立即報名</button>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderSuperDashboard(el) {
        // 超級管理員控制台功能
        let totalComm = 0;
        admins.filter(a => a.role !== 'SUPER').forEach(a => {
            const adminGames = games.filter(g => g.admin === a.name);
            totalComm += adminGames.reduce((s, g) => s + (g.players.length * COMMISSION_RATE), 0);
        });

        el.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass p-6 rounded-2xl border-b-4 border-green-500">
                    <p class="text-slate-400 text-xs">預計佣金總收入</p>
                    <p class="text-3xl font-black text-green-400">$${totalComm}</p>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <h3 class="font-bold mb-4 italic">ADMIN 佣金清單 (每位球員 $${COMMISSION_RATE})</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <tr class="text-slate-500 border-b border-slate-800"><th class="text-left pb-2">Admin 名稱</th><th class="text-right pb-2">應繳佣金</th></tr>
                        ${admins.filter(a => a.role !== 'SUPER').map(a => `
                            <tr class="border-b border-slate-800/50 text-slate-300">
                                <td class="py-3">${a.name}</td>
                                <td class="py-3 text-right font-bold text-blue-400">$${games.filter(g => g.admin === a.name).reduce((s, g) => s + (g.players.length * COMMISSION_RATE), 0)}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            </div>
        `;
    }

    function renderLogin() {
        const main = document.getElementById('mainArea');
        main.innerHTML = `
            <div class="max-w-md mx-auto glass p-8 rounded-3xl">
                <h2 class="text-2xl font-bold mb-6 text-center italic text-blue-400">VOLLEYBALLFLOW LOGIN</h2>
                <div class="space-y-4">
                    <input id="u" type="text" placeholder="Admin ID" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700">
                    <input id="p" type="password" placeholder="Password" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700">
                    <button onclick="login()" class="w-full btn-gradient py-4 rounded-xl font-bold">進入系統</button>
                </div>
            </div>
        `;
    }

    window.login = function() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        const user = admins.find(a => a.name === u && a.pass === p);
        if (user) { currentUser = user; render(); } else { alert('老細，密碼錯咗！'); }
    }

    window.logout = function() { currentUser = null; render(); }

    window.onload = render;
</script>

<footer class="fixed bottom-4 w-full text-center text-[10px] text-slate-600 font-bold uppercase tracking-widest">
    VolleyballFlow V10.0 | Super Admin: Manusyip | Auto-Kick & Commission Active
</footer>

</body>
</html>
