<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VolleyballFlow | 後台管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body {
    background: #f8fafc;
    color: #0f172a;
    font-family: 'Urbanist', sans-serif;
}
.admin-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
}
.btn-black {
    background: #0f172a;
    color: #ffffff;
    border-radius: 12px;
    font-weight: 600;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}
.btn-black:hover { background: #1e293b; }
.btn-black:disabled { opacity: 0.4; pointer-events: none; background: #64748b; }
.input-flat {
    width: 100%;
    border: 1px solid #e2e8f0;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
    background: #f8fafc;
}
.input-flat:focus {
    border-color: #6366f1;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
}
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-xl mx-auto w-full">
    <header class="mb-8 mt-4 border-b border-slate-200 pb-6">
        <h1 class="text-2xl font-extrabold tracking-tighter">
            VOLLEYBALLFLOW <span class="text-indigo-600">管理後台</span>
        </h1>
        <p class="text-xs font-bold text-slate-400 tracking-widest uppercase mt-1">Payment & Global Settings</p>
    </header>

    <div class="admin-card p-6 space-y-6">
        <div class="border-b border-slate-100 pb-3">
            <h2 class="text-lg font-bold tracking-tight text-slate-800"><i class="fa-solid fa-wallet mr-2 text-indigo-500"></i>收款設定變更</h2>
            <p class="text-xs text-slate-400 mt-0.5">此設定會直接連動前台報名時的 PayMe 與 Alipay 顯示</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">管理員身份 (Creator ID)</label>
                <select id="admin_id_select" class="input-flat font-mono font-bold text-indigo-600">
                    <option value="super_admin">超級管理員 (super_admin)</option>
                    </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">PayMe 付款連結 (payUrl)</label>
                <input id="pay_url_input" type="text" placeholder="https://payme.hsbc/yourname" class="input-flat font-mono">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Alipay 收款二維碼截圖 (payImg)</label>
                <div class="border border-dashed border-slate-200 rounded-xl p-6 text-center relative hover:bg-slate-50 transition cursor-pointer bg-white">
                    <input type="file" id="pay_img_input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-50">
                    <div id="upload_placeholder" class="text-slate-400 text-xs font-medium space-y-1">
                        <p><i class="fa-solid fa-qrcode text-xl mb-1 block text-slate-300"></i> 點擊上傳新 QR Code 截圖</p>
                    </div>
                    <img id="upload_preview" src="" class="hidden h-40 mx-auto rounded-lg relative z-10 object-contain shadow-sm border border-slate-100">
                </div>
            </div>

            <button id="btn_save_settings" class="w-full btn-black py-4 uppercase text-xs font-bold tracking-wider mt-4 shadow-md">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存變更設定
            </button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 使用與前台完全相同的 Firebase 配置
const firebaseConfig = { apiKey: 'AIzaSyBTd2xfvfNxoaD9irEx-W4B5gptzC-Mon0', authDomain: "volleyballflow-7cf02.firebaseapp.com", projectId: "volleyballflow-7cf02", storageBucket: "volleyballflow-7cf02.firebasestorage.app", messagingSenderId: "1032620495700", appId: "1:1032620495700:web:c2d84f02e435d99e15eec1" };
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app);

const $ = id => document.getElementById(id);
let currentBase64Img = ""; // 用來暫存轉碼後的圖片

// 圖片壓縮並轉為 Base64 (高相容性做法)
const compressAndGetBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const max = 600; // 後台收款碼不需太大，600px 即可清晰掃碼
            const scale = img.width > max ? max / img.width : 1;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            if (!ctx) return reject(new Error("Canvas Error"));
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // 壓縮為 jpeg，品質 0.7
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
});

// 即時預覽上傳的圖片
$('pay_img_input').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
        $('btn_save_settings').disabled = true;
        $('btn_save_settings').innerText = "PROCESSING IMAGE...";
        
        currentBase64Img = await compressAndGetBase64(file);
        
        $('upload_preview').src = currentBase64Img;
        $('upload_preview').classList.remove('hidden');
        $('upload_placeholder').classList.add('hidden');
    } catch (err) {
        alert("圖片處理失敗，請重試");
    } finally {
        $('btn_save_settings').disabled = false;
        $('btn_save_settings').innerText = "儲存變更設定";
    }
};

// 進入頁面時，自動載入現有的設定資料
const loadCurrentSettings = async () => {
    const adminId = $('admin_id_select').value;
    // 依據前台邏輯：super_admin 存放在 global_settings/payment；其餘存放在 admins/adminId
    const docRef = adminId === 'super_admin' ? doc(db, "global_settings", "payment") : doc(db, "admins", adminId);
    
    try {
        const dSnap = await getDoc(docRef);
        if (dSnap.exists()) {
            const data = dSnap.data();
            $('pay_url_input').value = data.payUrl || "";
            if (data.payImg) {
                currentBase64Img = data.payImg;
                $('upload_preview').src = data.payImg;
                $('upload_preview').classList.remove('hidden');
                $('upload_placeholder').classList.add('hidden');
            } else {
                $('upload_preview').classList.add('hidden');
                $('upload_placeholder').classList.remove('hidden');
            }
        } else {
            $('pay_url_input').value = "";
            currentBase64Img = "";
            $('upload_preview').classList.add('hidden');
            $('upload_placeholder').classList.remove('hidden');
        }
    } catch (err) {
        console.error("載入失敗:", err);
    }
};

// 當切換身分時自動重新載入資料
$('admin_id_select').onchange = loadCurrentSettings;
window.addEventListener('DOMContentLoaded', loadCurrentSettings);

// 重大修復：直接在 JS 內綁定 click 事件，徹底解決 type="module" 導致 onclick 撳唔到嘅問題！
$('btn_save_settings').onclick = async () => {
    const adminId = $('admin_id_select').value;
    const payUrl = $('pay_url_input').value.trim();
    const btn = $('btn_save_settings');
    
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> SAVING...`;

    // 依據前台標準路徑對接
    const docRef = adminId === 'super_admin' ? doc(db, "global_settings", "payment") : doc(db, "admins", adminId);

    try {
        await setDoc(docRef, {
            payUrl: payUrl,
            payImg: currentBase64Img // 寫入前台對應的變數
        }, { merge: true });

        alert("🎉 付款設定變更成功！前台已即時同步。");
    } catch (error) {
        console.error("儲存失敗:", error);
        alert("儲存失敗，請檢查網路或 Firebase 權限設定！");
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up mr-2"></i> 儲存變更設定`;
    }
};
</script>
</body>
</html>
